<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>黑心弹珠摊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: one-screen phone column — HUD plank on top, pachinko board fills the middle, controls tray at the bottom. Night-market stall at night. */
:root {
  --night: #1b1217;
  --dusk: #2a1d33;
  --plank: #5a3a28;
  --plank-dark: #3b261b;
  --rim: #b8262b;
  --brass: #d9a441;
  --gold: #f2c94c;
  --pop: #ef5b9c;
  --sus: #e04a3a;
  --ink: #f6e7c8;
  --muted: #b79f86;
  --display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { max-width: 460px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; position: relative; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* HUD */
.hud { background: var(--plank); border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px var(--plank-dark), 0 3px 0 #000; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr 1.25fr; gap: 4px 10px; align-items: center; }
.avatar { width: 52px; height: 52px; background: #6c7f99; border: 2px solid var(--brass); grid-row: span 1; }
.who { min-width: 0; }
.day { font-family: var(--display); color: var(--muted); font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
.money { font-family: var(--display); color: var(--gold); font-size: 34px; line-height: 1; text-shadow: 2px 2px 0 var(--plank-dark); font-variant-numeric: tabular-nums; }
.money.neg { color: var(--sus); }
.bars { display: grid; gap: 5px; min-width: 0; }
.bar-row { display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; align-items: center; font-size: 12px; font-weight: 700; }
.bar-row .num { justify-self: end; font-family: var(--display); font-size: 16px; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--plank-dark); border: 1px solid #000; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; display: block; transition: width .2s; }
#popBar { background: var(--pop); }
#susBar { background: var(--sus); }
.bar.danger { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { border-color: var(--gold); } }
.hud-foot { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr 1.25fr; gap: 10px; align-items: center; }
.watch { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.queue { display: flex; gap: 3px; min-width: 0; overflow: hidden; height: 22px; align-items: flex-end; }
.queue img { width: 18px; height: 18px; flex: none; }
.progress { position: relative; height: 22px; }
.track { position: absolute; left: 0; right: 6px; bottom: 3px; height: 7px; background: var(--plank-dark); border: 1px solid #000; overflow: hidden; }
.track .zone { position: absolute; top: 0; bottom: 0; background: rgba(242, 201, 76, .3); }
.track .fill { position: absolute; inset: 0 auto 0 0; background: #7bbf4a; }
.flag { position: absolute; bottom: 2px; width: 2px; height: 19px; background: var(--ink); }
.flag::after { content: ""; position: absolute; left: 2px; top: 0; border-left: 9px solid var(--gold); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.flag.end { right: 6px; } .flag.end::after { border-left-color: var(--rim); }

/* Board */
.stage { flex: 1; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.banner { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: var(--gold); color: #3a1f0e; font-family: var(--display); font-size: 16px; padding: 3px 12px; border: 2px solid #000; box-shadow: 2px 2px 0 #000; white-space: nowrap; pointer-events: none; }
.banner.alert { background: var(--sus); color: #fff; animation: blink .5s steps(2) infinite; }

/* Controls */
.tray { display: grid; gap: 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { appearance: none; border: 2px solid #000; background: #3c3330; color: var(--ink); font: inherit; padding: 6px 8px; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; box-shadow: inset 0 0 0 2px #5a4c46, 0 3px 0 #000; cursor: pointer; touch-action: manipulation; }
.card canvas { grid-row: span 2; width: 40px; height: 40px; }
.card b { font-size: 14px; }
.card span { font-family: var(--display); color: var(--gold); font-size: 15px; }
.card.on { background: #6b4b1f; box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 #000; }
.card.poor span { color: var(--sus); }
.card:focus-visible, .btn:focus-visible, .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.actbar { min-height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.hint-text { font-size: 12px; color: var(--muted); text-align: center; }
.mini { appearance: none; border: 2px solid #000; background: #4d3f3a; color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; padding: 5px 10px; box-shadow: inset 0 0 0 2px #6a5952, 0 2px 0 #000; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
.mini:active { transform: translateY(1px); }
.mini.warn { background: #7a2a1f; box-shadow: inset 0 0 0 2px #b4483a, 0 2px 0 #000; }
.mini.ok { background: var(--gold); color: #3a1f0e; box-shadow: inset 0 0 0 2px #c99a2a, 0 2px 0 #000; }
.mini:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1.3fr auto auto; gap: 8px; }
.btn.sound { width: 58px; font-size: 13px; line-height: 1.15; padding: 6px 4px; }
.btn.sound small { display: block; font-size: 11px; color: var(--gold); }
.btn { appearance: none; border: 2px solid #000; font: inherit; color: var(--ink); background: #4d3f3a; box-shadow: inset 0 0 0 2px #6a5952, 0 3px 0 #000; padding: 8px 10px; font-weight: 700; cursor: pointer; position: relative; overflow: hidden; touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px #6a5952, 0 1px 0 #000; }
.btn.slap { background: #c4671f; box-shadow: inset 0 0 0 2px #e89a4f, 0 3px 0 #000; font-family: var(--display); font-size: 18px; line-height: 1; }
.btn.slap small { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; margin-top: 2px; }
.btn.slap .cd { position: absolute; inset: auto 0 0 0; background: rgba(0, 0, 0, .55); pointer-events: none; }
.btn.speed { font-family: var(--display); font-size: 20px; }
.btn.pause { width: 54px; font-size: 18px; }
.btn[disabled] { opacity: .55; cursor: default; }

.tip { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: #fff4d6; color: #3a1f0e; border: 2px solid #000; box-shadow: 3px 3px 0 #000; padding: 8px 10px; font-size: 13px; line-height: 1.5; z-index: 5; }
.tip b { display: block; font-family: var(--display); font-size: 16px; }
.tray { position: relative; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: rgba(15, 8, 12, .82); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(100%, 380px); max-height: 100%; overflow: auto; background: var(--plank); border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px var(--plank-dark), 6px 6px 0 #000; padding: 18px 18px 16px; display: grid; gap: 12px; }
.sheet h1, .sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--gold); text-wrap: balance; text-shadow: 2px 2px 0 var(--plank-dark); }
.sheet h1 { font-size: 40px; letter-spacing: .06em; }
.sheet h2 { font-size: 28px; }
.sheet p { margin: 0; line-height: 1.6; font-size: 14px; }
.sheet ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 14px; line-height: 1.55; }
.sheet em { font-style: normal; color: var(--gold); font-weight: 700; }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.ledger .v { font-family: var(--display); font-size: 18px; text-align: right; }
.ledger .plus { color: #9be36b; } .ledger .minus { color: #ff8a7a; }
.ledger .total { border-top: 2px dashed var(--muted); padding-top: 6px; font-weight: 700; }
.cta { appearance: none; border: 2px solid #000; background: var(--gold); color: #3a1f0e; font-family: var(--display); font-size: 22px; padding: 10px; box-shadow: inset 0 -4px 0 #c99a2a, 0 4px 0 #000; cursor: pointer; }
.cta:active { transform: translateY(2px); }
.small { font-size: 12px; color: var(--muted); }

@media (max-width: 380px) { .money { font-size: 28px; } .hud { gap: 4px 8px; } .avatar { width: 44px; height: 44px; } }
#app.jolt { animation: jolt .4s ease-out; }
@keyframes jolt { 0% { transform: translate(0, 0); } 15% { transform: translate(-7px, 4px) rotate(-.6deg); } 30% { transform: translate(6px, -3px) rotate(.5deg); } 50% { transform: translate(-4px, 2px); } 70% { transform: translate(3px, -1px); } 100% { transform: translate(0, 0); } }
@media (prefers-reduced-motion: reduce) { .bar.danger, .banner.alert, #app.jolt { animation: none; } }
</style>

<div id="app">
  <header class="hud">
    <canvas class="avatar px" id="avatar" width="12" height="12" aria-label="摊主头像"></canvas>
    <div class="who">
      <div class="day" id="dayLabel">第 1 天 开张大吉</div>
      <div class="money" id="money">¥66</div>
    </div>
    <div class="bars">
      <div class="bar-row"><span>♥ 人气</span><span class="num" id="popNum" style="color:var(--pop)">50</span>
        <div class="bar"><i id="popBar" style="width:50%"></i></div></div>
      <div class="bar-row"><span>◉ 嫌疑</span><span class="num" id="susNum" style="color:var(--sus)">0</span>
        <div class="bar" id="susWrap"><i id="susBar" style="width:0%"></i></div></div>
    </div>
    <div class="hud-foot">
      <div class="watch" id="watch">围观 3 人</div>
      <div class="queue" id="queue" aria-label="排队顾客"></div>
      <div class="progress" aria-label="今日进度">
        <div class="track"><div class="zone" id="zone"></div><div class="fill" id="dayFill"></div></div>
        <div class="flag" id="patrolFlag"></div>
        <div class="flag end"></div>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="tray">
    <div class="tip" id="tip" hidden></div>
    <div class="actbar" id="actbar" aria-live="polite"></div>
    <div class="cards">
      <button class="card" id="card-fist" data-type="fist"><canvas class="px" width="20" height="20"></canvas><b>弹簧拳头</b><span>¥10</span></button>
      <button class="card" id="card-magnet" data-type="magnet"><canvas class="px" width="20" height="20"></canvas><b>磁铁</b><span>¥14</span></button>
    </div>
    <div class="row">
      <button class="btn slap" id="slap">拍桌子<small>拍飞一批</small><i class="cd" id="slapCd"></i></button>
      <button class="btn speed" id="speed">1 倍速</button>
      <button class="btn sound" id="sound" aria-label="切换声音">声音<small id="soundState">全开</small></button>
      <button class="btn pause" id="pause" aria-label="暂停">❚❚</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovStart">
  <div class="sheet">
    <h1>黑心弹珠摊</h1>
    <p>夜市口支个弹珠台。顾客花 <em>¥2</em> 打一颗弹珠，落进哪格你就赔哪格的钱。</p>
    <ul>
      <li>老老实实摆摊，赚的钱刚够交摊位费。想发财，就得靠<em>机关</em>“调教”弹珠。</li>
      <li>机关出手、拍桌子都会涨<em>嫌疑</em>，围观的人越多涨得越快。嫌疑满了，摊子就被掀了。</li>
      <li>黄旗那一段<em>城管巡逻</em>，嫌疑翻倍。</li>
      <li>顾客老是不中奖，<em>人气</em>就掉，人气低了没人来玩。</li>
      <li>每天收摊交摊位费，钱不够就破产。</li>
      <li>机关放错了，点它就能撤掉：<em>还没用过全额退钱</em>，用过的回收一半。</li>
    </ul>
    <button class="cta" id="startBtn">开张</button>
    <p class="small" id="best"></p>
  </div>
</div>
<div class="overlay" id="ovDay" hidden>
  <div class="sheet">
    <h2 id="dayTitle">第 1 天 收摊</h2>
    <div class="ledger" id="ledger"></div>
    <p class="small" id="dayNote"></p>
    <button class="cta" id="nextBtn">明天接着摆</button>
  </div>
</div>
<div class="overlay" id="ovOver" hidden>
  <div class="sheet">
    <h2 id="overTitle">摊子被掀了</h2>
    <p id="overText"></p>
    <button class="cta" id="againBtn">再来一局</button>
  </div>
</div>

<script>
// ===== Pachinko physics engine (pure, no DOM) =====
const W = 360, H = 520;
const G = 620;
const BR = 6;
const B = { L: 12, R: 348, cx: 180, cy: 172, dr: 168, laneX: 326, laneTop: 150, bottom: 504, slotTop: 440 };
const SLOT_N = 9;
const SLOT_W = (B.laneX - B.L) / SLOT_N;
const PRIZES = [0, 1, 0, 3, 8, 3, 0, 1, 0];
const PEG_R = 3;

function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

function buildPegs() {
  const pegs = [];
  for (let r = 0; r < 8; r++) {
    const y = 196 + r * 31;
    if (r % 2 === 0) {
      for (let i = 0; i <= 9; i++) {
        let x = B.L + i * SLOT_W;
        if (i === 0) x = B.L + 4; if (i === 9) x = B.laneX - 4;
        pegs.push({ x, y });
      }
    } else {
      for (let i = 0; i < 9; i++) pegs.push({ x: B.L + (i + 0.5) * SLOT_W, y });
    }
  }
  return pegs;
}
function buildSegs() {
  const s = [{ x1: B.laneX, y1: B.laneTop, x2: B.laneX, y2: B.bottom }];
  for (let i = 1; i < SLOT_N; i++) { const x = B.L + i * SLOT_W; s.push({ x1: x, y1: B.slotTop, x2: x, y2: B.bottom }); }
  return s;
}

function createWorld(seed) {
  return {
    rng: makeRng(seed || 12345), pegs: buildPegs(), segs: buildSegs(),
    balls: [], mechs: [], events: [], nextId: 1, magnetTime: 0, t: 0,
  };
}

function launchBall(w, power) {
  const p = power != null ? power : 690 + w.rng() * 230;
  const b = { id: w.nextId++, x: (B.laneX + B.R) / 2, y: B.bottom - BR - 12, vx: (w.rng() - 0.5) * 6, vy: -p, mt: {}, trail: [], age: 0, inLane: true };
  w.balls.push(b);
  return b;
}

function collideCircle(b, px, py, pr, e, w) {
  const dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy, m = BR + pr;
  if (d2 >= m * m || d2 === 0) return 0;
  const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
  b.x = px + nx * m; b.y = py + ny * m;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    const j = (w.rng() - 0.5) * 36; b.vx += -ny * j; b.vy += nx * j;
    return -vn;
  }
  return 0;
}

function collideSeg(b, s, e, w) {
  const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
  let t = ((b.x - s.x1) * ex + (b.y - s.y1) * ey) / (ex * ex + ey * ey);
  t = Math.max(0, Math.min(1, t));
  return collideCircle(b, s.x1 + ex * t, s.y1 + ey * t, 1.5, e, w);
}

function stepWorld(w, dt) {
  const sub = 4, h = dt / sub;
  for (let k = 0; k < sub; k++) substep(w, h);
  for (const m of w.mechs) { if (m.cd > 0) m.cd -= dt; if (m.anim > 0) m.anim -= dt; }
  w.t += dt;
}

function substep(w, h) {
  const balls = w.balls;
  for (const b of balls) {
    let ax = 0, ay = G;
    for (const m of w.mechs) {
      if (m.type !== 'magnet') continue;
      const dx = m.x - b.x, dy = m.y - b.y, d = Math.hypot(dx, dy);
      const used = b.mt[m.id] || 0;
      if (d < 66 && used < 1.1 && b.y > B.laneTop - 10 && b.x < B.laneX) {
        const f = 1500 * (1 - d / 66) + 260;
        ax += dx / (d + 0.01) * f; ay += dy / (d + 0.01) * f;
        b.mt[m.id] = used + h; w.magnetTime += h; m.usedT = (m.usedT || 0) + h;
        b.vx *= 0.995; b.vy *= 0.995;
      }
    }
    b.vx += ax * h; b.vy += ay * h;
    const sp = Math.hypot(b.vx, b.vy); if (sp > 1100) { b.vx *= 1100 / sp; b.vy *= 1100 / sp; }
    b.x += b.vx * h; b.y += b.vy * h; b.age += h;
  }
  for (const b of balls) {
    // dome
    if (b.y < B.cy) {
      const dx = b.x - B.cx, dy = b.y - B.cy, d = Math.hypot(dx, dy), lim = B.dr - BR;
      if (d > lim) {
        const nx = dx / d, ny = dy / d; b.x = B.cx + nx * lim; b.y = B.cy + ny * lim;
        const vn = b.vx * nx + b.vy * ny; if (vn > 0) { b.vx -= 1.25 * vn * nx; b.vy -= 1.25 * vn * ny; }
      }
    }
    if (b.x < B.L + BR) { b.x = B.L + BR; if (b.vx < 0) b.vx = -b.vx * 0.4; }
    if (b.x > B.R - BR) { b.x = B.R - BR; if (b.vx > 0) b.vx = -b.vx * 0.4; }
    if (b.inLane && b.y < B.laneTop - BR) b.inLane = false;
    if (b.y > 170 && b.y < B.slotTop + 10) for (const p of w.pegs) {
      const v = collideCircle(b, p.x, p.y, PEG_R, 0.5, w);
      if (v > 70) w.events.push({ type: 'hit', v });
    }
    for (const s of w.segs) if (b.y > s.y1 - 10) collideSeg(b, s, 0.3, w);
    // fists
    for (const m of w.mechs) {
      if (m.type !== 'fist' || m.cd > 0) continue;
      if (Math.hypot(b.x - m.x, b.y - m.y) < 20) {
        b.vx = m.dir * 380; b.vy = Math.min(b.vy, -40) - 90;
        m.cd = 0.8; m.anim = 0.25; w.events.push({ type: 'fist', mech: m, x: m.x, y: m.y });
      }
    }
  }
  // ball-ball
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], c = balls[j]; const dx = c.x - a.x, dy = c.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 4 * BR * BR && d2 > 0) {
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (2 * BR - d) / 2;
      a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o;
      const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
      if (rv < 0) { const j2 = -0.9 * rv; a.vx -= j2 * nx; a.vy -= j2 * ny; c.vx += j2 * nx; c.vy += j2 * ny; }
    }
  }
  // scoring / reload
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.y >= B.bottom - BR - 0.5) {
      if (b.x < B.laneX) {
        const slot = Math.max(0, Math.min(SLOT_N - 1, Math.floor((b.x - B.L) / SLOT_W)));
        balls.splice(i, 1); w.events.push({ type: 'score', slot, prize: PRIZES[slot], x: B.L + (slot + 0.5) * SLOT_W, ball: b });
      } else if (b.vy > 0) {
        balls.splice(i, 1); w.events.push({ type: 'reload', ball: b });
      }
    } else if (b.age > 25) { balls.splice(i, 1); w.events.push({ type: 'stuck', ball: b }); }
  }
}

function slapTable(w) {
  for (const b of w.balls) { if (b.inLane) continue; b.vy = -(260 + w.rng() * 220); b.vx += (w.rng() - 0.5) * 320; }
}

<script>
// ===== 音效与背景音乐：全部用 Web Audio 实时合成，无音频文件 =====
const Sfx = (() => {

    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);

    musicBus = ac.createGain(); musicBus.gain.value = pref.music ? 0.5 : 0; musicBus.connect(master);

<script>
(() => {
const $ = s => document.querySelector(s);

  magnet: { name: '磁铁', price: 14, desc: '把附近的弹珠吸过去，放在「谢谢惠顾」上方最好用。吸住弹珠时嫌疑会持续上涨。' },
};
const MECH_TIP = '放错了点它撤掉：没用过全额退，用过回收一半。';

// ---------- pixel sprites ----------
function paint(cv, map, pal) {
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);

}
const BOSS = ['...kkkkkk...', '..kkkkkkkk..', '.kkssssssskk', '.kssssssssk.', '.gggggggggg.', '.gwggsggwgg.', '.ssssnsssss.', '.ssmmmmmmss.', '..ssswwsss..', '...ssssss...', '.bbbyyyybbb.', 'bbbbbbbbbbbb'];

const GIRL = ['kk.kkkk.kk', 'kkkkkkkkkk', '.kssssssk.', '.sgssssgs.', '.ssssssss.', '.spsmmsps.', '..ssssss..', '.rrrrrrrr.', 'rrrrrrrrrr', 'rrrrrrrrrr'];
const BOY = ['..kkkkkk..', '.kkkkkkkk.', '.kssssssk.', '.sgssssgs.', '.ssssssss.', '.sssmmsss.', '..ssssss..', '.bbbbbbbb.', 'bbbbbbbbbb', 'bbbbbbbbbb'];
const KID_PAL = { k: '#2a1a14', s: '#f0b989', g: '#141018', p: '#f08a9a', m: '#7a2a1f', r: '#d8566b', b: '#4f86c6' };
paint($('#avatar'), BOSS, BOSS_PAL);
function kidURL(map) { const c = document.createElement('canvas'); c.width = 10; c.height = 10; paint(c, map, KID_PAL); return c.toDataURL(); }

// ---------- state ----------

function newGame() {
  S = { money: 66, pop: 50, sus: 0, day: 1, t: 0, phase: 'start', speed: 1, paused: false, queue: [], arriveT: 0.6, launchCD: 0.5,
    slapCD: 0, placing: null, sel: null, mood: 'normal', magActive: false, floats: [], shake: 0, shakeDur: 1, shakeAmp: 0, flash: 0, mechId: 1, world: createWorld((Date.now() % 99991) + 1), lastMag: 0, ghost: null, stats: null };
  resetStats(); renderQueue();
}
function resetStats() { S.stats = { income: 0, payout: 0, spend: 0, refund: 0, balls: 0, big: 0 }; }
const isUsed = m => m.used || (m.usedT || 0) > 0.1;
const refundOf = m => isUsed(m) ? Math.floor(m.cost / 2) : m.cost;
const selMech = () => S.sel == null ? null : S.world.mechs.find(m => m.id === S.sel) || null;
const watchers = () => Math.max(1, Math.round(S.pop / 12));

function shake(dur, amp) {
  S.shake = dur; S.shakeDur = dur; S.shakeAmp = reduceMotion ? Math.min(amp, 3) : amp; S.flash = Math.max(S.flash, amp >= 10 ? 0.16 : 0.06);

let last = performance.now(), acc = 0;
function frame(now) {

  } else acc = 0;

  for (const f of S.floats) f.life -= dt; S.floats = S.floats.filter(f => f.life > 0);

function update(dt) {
  const w = S.world;

    S.t += dt;

      launchBall(w); float(B.laneX - 4, B.bottom - 30, '+¥2', '#9be36b', 12); Sfx.fx.coin(); Sfx.fx.launch();
      S.launchCD = 1.0;
    }
  }

        Sfx.fx.payout(ev.prize);

    } else if (ev.type === 'fist') { ev.mech.used = true; addSus(3); float(ev.x, ev.y - 16, '嫌疑+', '#ff8a7a', 11); Sfx.fx.fist(); }

}

  for (const t of ['fist', 'magnet']) set('card-' + t, 'class', 'card' + (S.placing === t ? ' on' : '') + (S.money < MECH[t].price ? ' poor' : ''));
}
function renderQueue() {
  const q = $('#queue'); q.innerHTML = '';
  for (const k of S.queue) { const im = new Image(); im.src = KIDS[k]; im.className = 'px'; im.alt = ''; q.appendChild(im); }
}
{ const z = $('#zone'); z.style.left = PATROL[0] * 100 + '%'; z.style.width = (PATROL[1] - PATROL[0]) * 100 + '%'; $('#patrolFlag').style.left = `calc(${PATROL[0] * 100}% - ${PATROL[0] * 6}px)`; }

newGame(); renderSound();
const b = bestDay(); if (b) $('#best').textContent = `最好成绩：撑过 ${b} 天`;
resize();
if (document.fonts) document.fonts.ready.then(buildStatic);
requestAnimationFrame(frame);
})();
