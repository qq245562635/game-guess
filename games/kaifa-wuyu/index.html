<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>开发物语</title>
<style>
/* 设计分辨率 720 宽，1rem = 1 设计像素。布局照原作：顶栏 / 场景 / 信息栏 / 底栏 */
:root{
  --frame:#0E6268; --frame-dark:#075C63; --panel:#FDEED5; --panel-2:#F1DFC0; --paper:#FFF8EA;
  --ink:#043E3D; --ink-soft:#56706B; --label:#0B6E73; --neg:#E0383E; --gold:#B57514;
  --bar-bg:#075C63; --bar-bg-2:#03505B; --sel:#E2F2C4; --sel-2:#C6E39C;
  --row-label:#075C63; --row-label-2:#0E6D70; --line:#C7AA82;
  --c-fun:#E2701A; --c-creat:#D9A400; --c-gfx:#2A7BDB; --c-snd:#1C9660; --c-bug:#6B4FB8;
  color-scheme:light;
}
@font-face{font-family:"Noto Sans SC";src:url('assets/fonts/NotoSansSC-wght.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
html{font-size:min(calc(100vw / 720), calc(100vh / 1380))}
html,body{height:100%;margin:0}
body{background:#10141F;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{width:720rem;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bar-bg-2)}

/* ① 顶栏 */
#topbar{height:68rem;flex:none;padding:6rem;background:var(--frame);box-sizing:border-box}
#topbar .in{height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 26rem;background:linear-gradient(var(--panel),var(--panel-2));border-radius:4rem;box-shadow:inset 0 0 0 2rem #fff;font-size:34rem;color:var(--ink)}
#tick{display:inline-block;width:12rem;opacity:1}
#tick.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ② 场景 */
#scene{flex:1;position:relative;overflow:hidden;background:#AEB6C2;touch-action:none;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:22rem;line-height:1;color:#fff;background:var(--c);padding:6rem 10rem;border-radius:14rem;white-space:nowrap;animation:rise 1.4s ease-out forwards}
.pop.talk{background:var(--paper);color:var(--ink);font-weight:500;border:2rem solid var(--frame)}
@keyframes rise{0%{opacity:0;margin-top:8rem}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-50rem}}
#badge{position:absolute;left:12rem;top:12rem;display:flex;align-items:center;gap:10rem;pointer-events:none}
#badge .ico{width:56rem;height:56rem;border-radius:8rem;background:#3C84F4;box-shadow:inset 0 0 0 4rem #fff,0 0 0 2rem #075C63;display:grid;place-items:center;color:#fff;font-size:22rem;font-weight:700}
#badge b{font-size:40rem;color:#043E3D;-webkit-text-stroke:2rem #fff;paint-order:stroke}
#sidetab{position:absolute;left:0;top:60%;width:52rem;height:118rem;border:0;border-radius:0 16rem 16rem 0;background:rgba(40,46,66,.75);color:#fff;font-size:44rem;font-weight:700}
#toast{position:absolute;left:50%;top:90rem;transform:translateX(-50%);background:rgba(4,62,61,.88);color:#fff;font-size:24rem;padding:10rem 20rem;border-radius:30rem;pointer-events:none;white-space:nowrap}

/* 弹出菜单（场景左侧） */
#menu{position:absolute;left:18rem;top:330rem;width:236rem;padding:6rem;background:var(--frame-dark);border-radius:6rem;display:grid;gap:6rem}
#submenu{position:absolute;left:262rem;width:220rem;padding:6rem;background:var(--frame-dark);border-radius:6rem;display:grid;gap:6rem}
.mitem{height:70rem;border:0;border-radius:4rem;background:linear-gradient(#FFF8EA,#F1DFC0);box-shadow:inset 0 0 0 2rem #fff;display:flex;align-items:center;gap:0;padding:0 16rem;font-size:34rem;color:var(--ink)}
.mitem .mico{width:44rem;height:44rem;border-radius:8rem;display:grid;place-items:center;color:#fff;font-size:22rem;font-weight:700;flex:none}
.mitem span:last-child{flex:1;text-align:center}
.mitem.sel{background:linear-gradient(var(--sel),var(--sel-2));box-shadow:inset 0 0 0 3rem #F4FBE6}
#submenu .mitem{justify-content:center}

/* 居中弹窗 */
#dlg{position:absolute;left:28rem;right:28rem;top:50%;transform:translateY(-50%);background:var(--frame-dark);padding:5rem;border-radius:6rem;max-height:88%;display:flex;flex-direction:column}
.dlg-in{background:var(--panel);border-radius:3rem;display:flex;flex-direction:column;min-height:0}
.dlg-title{height:62rem;flex:none;display:grid;place-items:center;font-size:34rem;background:linear-gradient(#FDEED5,#F1DFC0);border-bottom:2rem solid var(--frame-dark)}
.dlg-body{padding:18rem 30rem;overflow:auto;display:grid;gap:12rem;min-height:0}
.dlg-foot{height:72rem;flex:none;display:flex;align-items:center;justify-content:center}
.dlg-foot button{border:0;background:none;font-size:34rem;padding:8rem 40rem;border-radius:6rem}
.dlg-foot button:active,.dlg-foot button.sel{background:var(--panel-2)}
.cost{display:flex;justify-content:flex-end;gap:60rem;font-size:32rem;padding-right:24rem}
.cost .k{color:var(--label)}
.fbox{background:var(--panel-2);padding:14rem 40rem;display:grid;gap:8rem;border:2rem solid var(--frame)}
.frow{display:grid;grid-template-columns:200rem 1fr;height:60rem;border:0;padding:0;border-radius:3rem;overflow:hidden;box-shadow:0 0 0 3rem #075C63}
.frow .fl{background:linear-gradient(90deg,var(--row-label),var(--row-label-2));color:#fff;font-size:32rem;display:flex;align-items:center;padding-left:16rem}
.frow .fv{background:var(--paper);font-size:32rem;display:flex;align-items:center;gap:16rem;padding-left:20rem;justify-content:center}
.frow.sel .fv{background:#DCEDB8}
.frow .tico{width:44rem;height:44rem;border-radius:6rem;display:grid;place-items:center;color:#fff;font-size:20rem;font-weight:700}
.staffstrip{display:flex;justify-content:space-between;align-items:flex-end;height:80rem;padding:0 6rem}
.staffstrip i{width:34rem;height:70rem;border-radius:17rem 17rem 4rem 4rem;display:block}
.prow{height:64rem;border:0;border-bottom:2rem solid var(--panel-2);background:var(--paper);font-size:30rem;display:flex;align-items:center;justify-content:space-between;padding:0 20rem;text-align:left}
.prow small{font-size:22rem;color:var(--ink-soft)}
.prow:disabled{color:#A0A7BA}
.prow.sel{background:#DCEDB8}
.remain{display:flex;justify-content:flex-end;align-items:center;gap:40rem;font-size:32rem;color:var(--label)}
.remain b{font-size:44rem;color:#043E3D}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6rem 20rem;border:2rem solid var(--frame);border-radius:10rem;padding:14rem 16rem;background:var(--paper)}
.pcell{display:grid;gap:4rem;border:0;background:none;padding:4rem 0;text-align:left}
.pcell .pn{font-size:32rem;color:var(--ink-soft)}
.pslide{display:flex;align-items:center;gap:6rem}
.pslide .ar{width:28rem;flex:none;text-align:center;font-size:28rem;color:#D9A400;visibility:hidden}
.pcell.sel .ar{visibility:visible}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2rem;width:190rem;height:32rem;padding:2rem;background:#EADBBE}
.segs i{background:#FFF8EA}
.segs i.on{background:linear-gradient(#7FE05A,#2FA81C)}
.pfoot{display:grid;grid-template-columns:1fr auto;align-items:center}
.pfoot .lv{display:grid;grid-template-columns:auto 1fr auto;gap:6rem 14rem;font-size:30rem;align-items:center}
.pfoot .lv em{font-style:normal;color:var(--neg)}
.pfoot button{border:0;background:none;font-size:34rem;padding:8rem 36rem}
.talkbox{border:2rem solid var(--frame);border-radius:14rem;background:var(--paper);padding:24rem 30rem;font-size:32rem;line-height:1.7;min-height:170rem}
.speaker{display:flex;justify-content:space-between;align-items:center;padding:6rem 10rem 0 180rem;font-size:32rem;color:var(--label)}
.speaker .face{display:block;flex-shrink:0;width:96rem;height:84rem;border-radius:10rem;background:url('assets/ui_secretary.png') center bottom / contain no-repeat}
.rv{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--paper);border:2rem solid var(--panel-2);padding:10rem 18rem;font-size:28rem;opacity:0;transition:opacity .3s}
.rv.on{opacity:1}
.rv b{font-size:46rem;grid-row:span 2}
.rv small{font-size:22rem;color:var(--ink-soft)}
.rtotal{text-align:center;font-size:64rem;font-weight:700;opacity:0;transition:opacity .3s}
.rtotal.on{opacity:1}
.srow{display:grid;grid-template-columns:1fr repeat(4,70rem);font-size:26rem;align-items:center;padding:8rem 0;border-bottom:2rem solid var(--panel-2)}
.srow b{text-align:center}

/* ③ 信息栏 */
#info{height:118rem;flex:none;background:var(--frame);padding:5rem;box-sizing:border-box}
#info .in{height:100%;background:var(--paper);border-radius:3rem;display:grid;grid-template-columns:1fr 36rem;box-shadow:inset 0 0 0 2rem var(--panel-2)}
.ip{display:grid;grid-template-columns:1fr 2rem 1fr;align-items:center;padding:0 0 0 24rem}
.ip .div{height:76%;background:var(--frame)}
.ip .ys{display:grid;gap:6rem;padding-right:24rem}
.ip .ys div{display:flex;justify-content:space-between;font-size:34rem}
.ip .ys span{color:var(--label)}
.ip .rt{text-align:center;font-size:36rem}
.ipd{display:grid;grid-template-rows:1fr 1fr;padding:6rem 10rem 6rem 22rem;align-content:center}
.ipd .r{display:flex;align-items:center;justify-content:space-between;font-size:30rem}
.ipd .lab{color:var(--label)}
.ipd .pct{font-size:36rem;font-weight:700;color:#043E3D;width:110rem}
.ico-s{width:40rem;height:30rem;border-radius:8rem;display:inline-grid;place-items:center;color:#fff;font-size:18rem;font-weight:700;vertical-align:middle;margin-right:6rem}
.cnt{display:inline-block;min-width:34rem;text-align:center;background:#043E3D;color:#fff;border-radius:4rem;font-size:24rem;font-weight:700;padding:2rem 4rem}
.cnt.bug{background:var(--neg)}
#scroll{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:6rem 0}
#scroll button{border:0;background:none;font-size:22rem;color:#075C63;padding:0;width:100%}
#scroll .track{width:12rem;background:var(--panel-2);border-radius:6rem;position:relative}
#scroll .thumb{position:absolute;left:0;right:0;height:50%;background:#5C7BE0;border-radius:6rem;transition:top .2s}

/* ④ 底栏 */
#bottombar{height:186rem;flex:none;position:relative;background:linear-gradient(var(--bar-bg),var(--bar-bg-2) 60%)}
.bb{position:absolute;top:22rem;width:196rem;height:84rem;border-radius:8rem;border:0;font-size:32rem;background:linear-gradient(#FAFBFE,#CFD8E8);box-shadow:inset 0 0 0 3rem #fff,0 0 0 4rem #043E3D}
.bb.empty{background:linear-gradient(#2E3B6E,#1E2850);box-shadow:inset 0 0 0 2rem #043E3D;color:transparent;pointer-events:none}
#btnL{left:16rem} #btnR{right:16rem}
#tabUp{position:absolute;left:50%;bottom:12rem;transform:translateX(-50%);width:200rem;height:56rem;border:0;border-radius:6rem;background:linear-gradient(#FAFBFE,#CFD8E8);box-shadow:0 0 0 4rem #043E3D}
#tabUp::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:22rem solid transparent;border-bottom:24rem solid #F07A1A;border-top:0}
#tabUp.down::after{border-bottom:0;border-top:24rem solid #F07A1A}
button:focus-visible{outline:3rem solid #F07A1A;outline-offset:2rem}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}#tick.blink{animation:none}}
/* 新企划：列表图标、等级、方针标记 */
.frow .flv{font-style:normal;color:var(--neg);font-size:26rem}
.prow{min-height:64rem;height:auto;gap:16rem}
.prow .pl{display:flex;align-items:center;gap:14rem;flex:none}
.prow .tico{width:40rem;height:40rem;border-radius:6rem;display:grid;place-items:center;color:#fff;font-size:20rem;font-weight:700}
.prow:disabled .tico{opacity:.35}
.prow small{text-align:right;white-space:nowrap}
/* 宣传方式：表头 + 白底列表框 + 底部提示 */
.adbox{display:grid;gap:12rem}
.adhead{display:flex;justify-content:space-between;padding:0 30rem;font-size:30rem;color:var(--label)}
.adlist{display:grid;border:2rem solid var(--panel-2);border-radius:10rem;background:var(--paper);padding:10rem 12rem;min-height:300rem;align-content:start}
.adrow{border-bottom:0;font-size:30rem}
.adrow small{font-size:30rem;color:var(--ink)}
.adrow:disabled small{font-size:22rem;color:#A0A7BA}
/* 负责人工作画面（正在整理企划 / 绘制画面 / 制作音乐） */
.wbody{display:grid;gap:14rem}
.wsub{text-align:center;font-size:32rem;color:var(--label)}
.wbox{display:grid;grid-template-columns:270rem 1fr;align-items:center;gap:8rem;background:var(--paper);border:2rem solid var(--panel-2);border-radius:10rem;padding:16rem 12rem;min-height:250rem}
.wstage{position:relative;display:grid;place-items:center}
.wdesk{width:250rem;height:auto;display:block}
.wpop{position:absolute;left:38%;top:12%;animation:wpop .7s ease-out forwards}
@keyframes wpop{0%{opacity:0;transform:translateY(10rem)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-34rem)}}
.wright{display:grid;gap:18rem;justify-items:center}
.wround{font-size:30rem;color:var(--label);min-height:36rem}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8rem;width:100%}
.wst{display:grid;justify-items:center;gap:8rem}
.wst .ico-s{margin:0}
.wst b{font-size:34rem;color:var(--ink)}
.wst b.bump{animation:wbump .35s ease-out}
@keyframes wbump{40%{transform:scale(1.35)}}
.wsay{text-align:center;font-size:30rem;min-height:40rem;color:var(--ink)}
/* 点数 / 能力图标（SVG 占位，交付 ui_stat_* / ui_skill_* 后换成贴图） */
.sicon{padding:0;overflow:hidden}
.sicon svg{width:100%;height:100%;display:block}
.sicon.art{border-radius:0;box-shadow:none}
.wst .ico-s{width:56rem;height:42rem;border-radius:10rem}
.pop.ipop{display:flex;align-items:center;gap:4rem;padding:4rem 10rem 4rem 6rem}
.pop .pico{width:34rem;height:26rem;display:inline-block;border-radius:0}
.pmk{font-style:normal;font-size:22rem;color:#E2A400;margin-left:6rem}.pmk.x{color:var(--neg)}
.pfoot .tico{width:40rem;height:40rem;border-radius:6rem;display:grid;place-items:center;color:#fff;font-size:20rem;font-weight:700}
/* 制作人卡片 */
.dlg-title.pager{display:flex;justify-content:space-between;align-items:center;padding:0 12rem}
.dlg-title .pg{border:0;background:none;font-size:34rem;color:#D9A400;width:70rem;height:100%}
.card{display:grid;gap:12rem}
.chead{display:flex;justify-content:space-between;align-items:center;font-size:34rem;padding:0 24rem}
.ctag{background:var(--paper);color:var(--label);font-size:26rem;padding:4rem 20rem;border:2rem solid var(--frame)}
.cbox{display:grid;grid-template-columns:1fr 1fr;gap:12rem;border:2rem solid var(--frame);border-radius:10rem;padding:14rem;background:var(--paper)}
.cleft{background:#FBE6E0;padding:10rem 14rem;display:grid;gap:6rem}
.cjob{font-size:28rem;color:var(--label)}
.cfig{height:120rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.cfig .head{display:block;width:40rem;height:40rem;border-radius:50%;background:#F1C7A5;border-top:14rem solid;box-sizing:border-box}
.cfig .body{display:block;width:56rem;height:62rem;border-radius:24rem 24rem 4rem 4rem;margin-top:2rem}
.csta{display:flex;align-items:center;gap:10rem;font-size:22rem;color:var(--neg)}
.csta .bar{flex:1;height:14rem;background:#EADBBE;display:block}
.csta .bar i{display:block;height:100%;background:#3C84F4}
.csta .bar.low i{background:var(--neg)}
.cright{background:#E9F0DC;padding:6rem 12rem;display:grid;align-content:space-around}
.cs{display:grid;grid-template-columns:36rem 1fr auto;gap:10rem;align-items:center;font-size:28rem;color:var(--ink-soft)}
.cs b{color:var(--ink);font-size:32rem;font-weight:500}
.cs.hi span:nth-child(2){color:var(--label);font-weight:700}
.csi{width:32rem;height:32rem;border-radius:6rem;color:#fff;font-size:18rem;display:grid;place-items:center}
.cfoot{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16rem;padding:0 10rem}
.cfee{display:grid;font-size:28rem}.cfee .k{color:var(--label)}
.cfav{font-size:24rem;color:var(--ink-soft);text-align:center}.cfav.on{color:var(--sel-2);font-weight:700}
.cok{border:0;background:#DCEDB8;font-size:34rem;padding:8rem 40rem;border-radius:4rem}
.chint{text-align:center;font-size:26rem;color:var(--label)}
/* 职员卡补充：等级、月薪、培训按钮 */
.cjob{display:flex;justify-content:space-between;align-items:center}
.clv{font-size:22rem;color:#1C9660;font-weight:700}.clv b{font-size:34rem;color:#043E3D;margin-left:4rem}
.csal{display:flex;gap:40rem}.csal .k{color:var(--label)}
.tfoot{display:flex;justify-content:center}.cok:disabled{opacity:.45}
/* 培训画面 */
.tscene{position:relative;min-height:220rem;overflow:hidden;border:3rem solid #6B7486;background:#9FD3F2}
.tbar{position:absolute;left:14rem;right:14rem;top:12rem;height:20rem;background:#7A1F1F;border:2rem solid #3A3F4C;z-index:3}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(#7BE36B,#2FA43A)}
.tsky{position:absolute;inset:0;background:linear-gradient(#7CC4EE,#CFEBFA 70%)}
.tcity{position:absolute;left:0;right:0;bottom:62rem;height:70rem;opacity:.55;background:
  linear-gradient(#8FA6BE,#8FA6BE) 4% 100%/14% 70% no-repeat,linear-gradient(#7F97B0,#7F97B0) 22% 100%/10% 100% no-repeat,
  linear-gradient(#97ACC2,#97ACC2) 40% 100%/16% 55% no-repeat,linear-gradient(#8098B2,#8098B2) 62% 100%/12% 85% no-repeat,
  linear-gradient(#90A7BF,#90A7BF) 84% 100%/18% 62% no-repeat}
.tground{position:absolute;left:0;right:0;bottom:0;height:62rem;background:linear-gradient(#E9DCC5 0 18rem,#CDBA98 18rem 22rem,#D9C8A8 22rem)}
.tfig{position:absolute;left:50%;bottom:22rem;height:auto;transform:translateX(-50%) scale(.8);transform-origin:50% 100%;z-index:2}
.t-walk,.t-jam{animation:tbob .5s ease-in-out infinite}
.t-code,.t-read,.t-sketch,.t-music,.t-class{animation:tnod 1s ease-in-out infinite}
.t-spa .body{background:#6EC3E8!important;border-radius:30rem 30rem 6rem 6rem}
.t-spa{animation:tbob 1.6s ease-in-out infinite}
@keyframes tbob{50%{transform:translateX(-50%) scale(.8) translateY(-8rem)}}
@keyframes tnod{50%{transform:translateX(-50%) scale(.8) rotate(-3deg)}}
.cs{position:relative}
.cs.up b{color:#E0383E}
.tplus{position:absolute;right:-8rem;top:-6rem;font-weight:700;font-size:24rem;line-height:1;font-style:normal;color:#E0383E;animation:tplus .9s ease-out forwards;pointer-events:none}
@keyframes tplus{0%{opacity:0;transform:translateY(8rem)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26rem)}}
@media (prefers-reduced-motion:reduce){.tfig,.tplus{animation-duration:.01s;animation-iteration-count:1}}

/* ===== UI 第一批正式素材（assets/ui/，2 倍图）。这批都按设计尺寸原样显示，不走九宫格，避免切片接缝 ===== */
#app{background:var(--bar-bg-2)}
#topbar{background:var(--bar-bg);padding:0}
#topbar .in{box-shadow:none;border-radius:0;background:url('assets/ui/ui_topbar_frame.png') center/100% 100% no-repeat;padding:0 30rem;color:var(--ink);font-weight:700}
#date{flex:1}
#tick{width:6rem;height:6rem;margin-left:4rem;vertical-align:middle;background:url('assets/ui/ui_date_dot.png') center/contain no-repeat;color:transparent;overflow:hidden}
.mny{display:flex;align-items:center;gap:16rem;padding-left:26rem;border-left:2rem solid var(--line);height:40rem}
.mny .coin{width:48rem;height:48rem;flex:none;background:url('assets/ui/ui_coin.png') center/contain no-repeat}
#badge .ico{background:url('assets/ui/ui_badge_icon.png') center/contain no-repeat;box-shadow:none;border-radius:0;color:transparent}
#badge b{color:var(--ink)}
#sidetab{background:url('assets/ui/ui_sidetab.png') center/100% 100% no-repeat;border-radius:0;color:transparent}
#info{background:var(--bar-bg);padding:0}
#info .in{box-shadow:none;border-radius:0;background:url('assets/ui/ui_info_frame.png') center/100% 100% no-repeat;margin:0}
.ip .div{width:2rem;background:url('assets/ui/ui_info_divider.png') center/100% 100% no-repeat}

<script>
"use strict";
// ================= 声音：音乐和音效全部用 WebAudio 现场合成，不需要任何音频文件。
// 想换成正式音频：把文件放进 assets/audio/<key>.mp3（或 .ogg / .wav），并在 assets/audio/index.json 写 key 数组，
// 例如 ["bgm_office","sfx_coin"]。启动后自动加载，同名 key 优先用文件，缺的继续用合成版。key 一览见 AUDIO.md。
// 浏览器要求用户先点一下页面才能出声：第一次触屏 / 点击时自动打开音频。
const SND=(()=>{
  const PK='kaifa_wuyu_audio',MUS_VOL=.42,SFX_VOL=.9;
  const pref={mus:true,sfx:true};try{Object.assign(pref,JSON.parse(localStorage.getItem(PK)||'{}'));}catch(e){}
  const savePref=()=>{try{localStorage.setItem(PK,JSON.stringify(pref));}catch(e){}};
  let ctx=null,out,MUS,SFX,noiseBuf=null,cur=null,want='office';const FILES={},lastAt={};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const r=(a,b)=>a+Math.random()*(b-a);
  const NN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const nn=s=>{const m=/^([A-G])(b|#)?(\d)$/.exec(s);return 12*(+m[3]+1)+NN[m[1]]+(m[2]==='b'?-1:m[2]==='#'?1:0);};

  // ---- 初始化（第一次用户操作时）
  function makeIR(sec,decay){const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
  // 一条总线：干声 g + 混响送 rv（混响出来也回到 g，静音时一起静）
  function mkBus(vol,dest,revAmt){const g=ctx.createGain();g.gain.value=vol;g.connect(dest);
    const rv=ctx.createGain();rv.gain.value=1;const cv=ctx.createConvolver();cv.buffer=makeIR(1.8,3);const wet=ctx.createGain();wet.gain.value=revAmt;
    rv.connect(cv);cv.connect(wet);wet.connect(g);return {g,rv};}
  function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();}catch(e){return false;}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;comp.connect(ctx.destination);
    out=ctx.createGain();out.gain.value=1;out.connect(comp);
    MUS=mkBus(pref.mus?MUS_VOL:0,out,.5);SFX=mkBus(pref.sfx?SFX_VOL:0,out,.6);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    loadFiles();setInterval(tickMusic,25);return true;}
  function loadFiles(){fetch('assets/audio/index.json').then(x=>x.ok?x.json():[]).catch(()=>[]).then(keys=>{if(!Array.isArray(keys))return;
    for(const k of keys){const tryExt=exts=>{if(!exts.length)return;fetch(`assets/audio/${k}.${exts[0]}`).then(x=>{if(!x.ok)throw 0;return x.arrayBuffer();})
      .then(ab=>new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no))).then(buf=>{FILES[k]=buf;if(k.startsWith('bgm_')&&cur&&cur.name===k.slice(4))restartMusic();}).catch(()=>tryExt(exts.slice(1)));};
      tryExt(['mp3','ogg','wav']);}});}
  const unlock=()=>{if(!init())return;if(ctx.state!=='running')ctx.resume();};
  for(const ev of ['pointerdown','touchend','keydown'])addEventListener(ev,unlock,true);
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
  const live=()=>ctx&&ctx.state==='running';

  // ---- 基础发声
  function route(node,bus,rev,pan){let n=node;if(pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;n.connect(p);n=p;}
    n.connect(bus.g);if(rev){const s=ctx.createGain();s.gain.value=rev;n.connect(s);s.connect(bus.rv);}}
  function env(g,t,a,vol,dur,rel=.05){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setTargetAtTime(0,t+a+dur,rel);}
  function tone(t,f,o={}){const {type='sine',dur=.12,vol=.2,a=.004,f1=0,bus=SFX,rev=0,pan=0}=o;
    const os=ctx.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);if(f1)os.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dur);
    os.connect(g);route(g,bus,rev,pan);os.start(t);os.stop(t+a+dur+.05);}
  function noise(t,o={}){const {dur=.08,vol=.15,type='bandpass',freq=2000,f1=0,q=1,a=.002,bus=SFX,rev=0,pan=0}=o;
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(freq,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=q;
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dur);
    s.connect(fl);fl.connect(g);route(g,bus,rev,pan);s.start(t,Math.random()*.5);s.stop(t+a+dur+.05);}
  // 钟琴：正弦 + 高次泛音，敲击感
  function bell(t,m,o={}){const {vol=.12,dur=.6,bus=SFX,rev=.35,pan=0}=o;const f=mtof(m);
    tone(t,f,{vol,dur,bus,rev,pan,a:.002});tone(t,f*2.76,{vol:vol*.25,dur:dur*.35,bus,rev,pan,a:.001});tone(t,f*5.4,{vol:vol*.08,dur:dur*.15,bus,rev,pan,a:.001});}
  // 铜管：锯齿波 + 低通开合
  function brass(t,m,dur,vol,bus=SFX,rev=.3){const f=mtof(m);const g=ctx.createGain();env(g,t,.03,vol,dur,.08);
    const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.Q.value=1;fl.frequency.setValueAtTime(600,t);fl.frequency.linearRampToValueAtTime(2600,t+.05);fl.frequency.setTargetAtTime(1300,t+.08,.15);

  const mel=bars=>{const out=[];bars.forEach((bar,bi)=>{bar.split(' ').forEach((tk,si)=>{const st=bi*8+si;

  const TRACKS={

      bass:['F2','A2','Bb2','C3','F2','D2','G2','C3'].map(nn),
      chords:[[53,57,60,64],[57,60,64,67],[53,57,62],[55,58,64],[53,57,60,64],[57,60,62,65],[53,58,62],[52,58,62]],

    // 开发中：更有干劲的 pop，C 大调
    dev:{bpm:118,swing:0,
      bass:['C3','A2','F2','G2','C3','A2','F2','G2'].map(nn),

      mel:mel(['E5 . G5 . E5 D5 C5 .','A4 . C5 . E5 - - .','F5 . E5 . D5 . C5 .','D5 - - . B4 . G4 .',
               'E5 . G5 . A5 G5 E5 .','C5 . E5 . A5 - G5 .','F5 E5 D5 . C5 . A4 .','B4 - - . D5 - - .']),

  function startMusic(name){const L=TRACKS[name];if(!L)return null;const t0=ctx.currentTime+.08;
    const g=ctx.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(1,t0+.6);g.connect(MUS.g);

    // 旋律：前两遍唱，第三遍只留伴奏换口气
    P.lead=(t,i,vol)=>{const loop=Math.floor(i/64)%3;if(loop===2)return;const n=L.mel[i%64];if(n)vibes(t,n.m,(n.end-n.st)*P.sd*.95,vol,P.bus);};

// k:'a' 人在桌前(y+1)背对镜头；k:'b' 人在桌后(y-1)面朝镜头。返回 [世界x, 世界y, 排序深度]

// ================= 上下班
// 原作没有「天」，以周为单位。员工体力用光会起身走出门回家，休息一会儿再走回来；路线用 BFS 绕开家具
const DOOR=[6,6],GRID_H=7;  // 门垫 (6,5) 外面一格进出，进出门时淡入淡出
const seatTile=st=>st.k==='a'?[st.d[0],st.d[1]+1]:[st.d[0],st.d[1]-1];

  const bfs=goal=>{const prev={},key=p=>p.join(','),q=[DOOR];prev[key(DOOR)]=null;
    while(q.length){const c=q.shift();if(c[0]===goal[0]&&c[1]===goal[1])break;
      for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){const n=[c[0]+dx,c[1]+dy];if(n[0]<0||n[0]>=ROOM_W||n[1]<0||n[1]>=GRID_H||key(n) in prev||block.has(key(n)))continue;prev[key(n)]=c;q.push(n);}}

// 返回 {mode:'absent'|'walk'|'seat', x,y,d,key,flip}
function personState(id){if(!ROUTES)buildRoutes();let who=id,r=ROUTES[id];

  const c=away.get(id);if(!c)return {mode:'seat'};if(c.phase==='home')return {mode:'absent'};

// 不在座位的员工：phase out(走出门) → home(在家休息) → in(走回来)。只存在内存里，读档后大家都在座位上

function goHome(s){if(away.has(s.id))return;away.set(s.id,{phase:'out',t0:simT});const [x,y]=seatWorld(s.seat);popWorld(x,y-104,pick(['好累，先回家了','撑不住了…','回去睡一觉']),'',true);}

  if(c.phase==='out'&&simT-c.t0>=r.dur){c.phase='home';c.t0=simT;c.rest=rnd(...REST_SEC);}
  else if(c.phase==='home'&&simT-c.t0>=c.rest){c.phase='in';c.t0=simT;s.sta=100;}
  else if(c.phase==='in'&&simT-c.t0>=r.dur){away.delete(id);const [x,y]=seatWorld(s.seat);popWorld(x,y-104,pick(['早！','精神满满','继续干活']),'',true);}}}
// 每周：坐班的人消耗体力，体力低时有概率回家

const cam={x:0,y:0,z:1,fit:true};let stageW=1,stageH=1;

const MAG_ART={};function loadMagArt(){for(const k in MAG_CAT){const img=new Image();img.onload=()=>{MAG_ART[k]=img.src;};img.src=`assets/ui/ui_mag_${k}.png`;}}
const MAG_EV=Object.fromEntries(MAG_EVENTS.map(e=>[e.id,e]));
// 效果：每个函数可返回一句给秘书说
const MAG_FX={
  money:f=>{addMoney(f.v);return f.v>0?`收到 ${fmt(f.v)} 金。`:`支出 ${fmt(-f.v)} 金。`;},
  fans:f=>{S.fans+=f.v;return `粉丝 ${f.v>0?'+':''}${fmt(f.v)}。`;},
  trend:f=>{S.mag.trends.push({k:f.k,mul:f.mul,until:am()+f.months});const n=f.k==='all'?'所有':`「${(GN[f.k]||TN[f.k]).n}」`;return `接下来 ${f.months} 个月，${n}作品${f.mul>=1?'会更好卖':'会难卖一些'}。`;},
  flag:f=>{S.mag.flags[f.k]=f.v??true;},
  chain:f=>{S.mag.queue.push({id:f.id,at:am()+(f.after??1)});},
};
function magFx(list){const out=[];for(const f of list||[]){const r=MAG_FX[f.t]?.(f);if(r)out.push(r);}renderAll();return out.length?[out.join('')]:[];}
// 流行加成：作品类型或内容正在流行时，销量 ×mul
function trendMul(g){let m=1;if(!S.mag)return m;const now=am();for(const t of S.mag.trends)if(t.until>now&&(t.k==='all'||t.k===g.genre||t.k===g.type))m*=t.mul;return m;}
const isHot=id=>!!S.mag&&S.mag.trends.some(t=>t.until>am()&&t.k===id&&t.mul>1);
// 程序推送一篇稿子到下一期（或 after 个月后）
function magPush(art,after=0){S.mag.queue.push({art,at:am()+after});}
const magText=t=>typeof t==='function'?t():t;
function magCompose(){const M=S.mag,now=am(),arts=[];
  M.trends=M.trends.filter(t=>t.until>now);
  for(const q of M.queue.filter(q=>q.at<=now)){const e=q.id&&MAG_EV[q.id];arts.push(e?{id:e.id,cat:e.cat,title:e.title,text:magText(e.text),prio:99}:{...q.art,prio:99});}
  M.queue=M.queue.filter(q=>q.at>now);
  const ok=e=>{const n=M.seen[e.id]||0;if(n&&e.once!==false)return false;if(n&&e.cd&&now-M.last[e.id]<e.cd)return false;
    if(e.month&&!e.month.includes(S.month))return false;if(e.when&&!e.when())return false;return Math.random()<(e.chance??1);};
  for(const e of [...MAG_EVENTS].sort((a,b)=>(b.prio||0)-(a.prio||0))){if(arts.length>=MAG_MAX)break;if(ok(e))arts.push({id:e.id,cat:e.cat,title:e.title,text:magText(e.text),prio:e.prio||0});}
  return arts;}
function magIssue(){if(blocking()){schedule(.5,magIssue);return;}
  const arts=magCompose();if(!arts.length)return;const M=S.mag,now=am();M.no++;
  for(const a of arts)if(a.id){M.seen[a.id]=(M.seen[a.id]||0)+1;M.last[a.id]=now;}
  M.archive.unshift({no:M.no,y:S.year,m:S.month,arts:arts.map(({cat,title,text})=>({cat,title,text}))});M.archive.length=Math.min(M.archive.length,MAG_KEEP);
  save();SND.sfx('unlock');magRead(arts,()=>magAfter(arts,0));}

function magAfter(arts,i){if(i>=arts.length){renderAll();return;}const e=arts[i].id&&MAG_EV[arts[i].id];const next=()=>magAfter(arts,i+1);

  const wk=rint(2,6),need=Math.round(rnd(18,45)*(1+.35*(S.year-1)));

// ================= 员工经验 / 升级 / 转职
// 经验来源：开发或委托中每周坐班 +2，负责人工作 +5，培训 +3。升级时本职能力 +3、其他 +1，月薪 +8%。
// 5 级（满级）才能转职；转职后等级归 1，能力保留。在某职业练满过记在 s.done，用来解锁黑客。
const LV_EXP=[0,20,50,90,140],LV_MAX=5;
const ADV_JOBS={
  prog:{fee:1000,d:'转回程序员'},plan:{fee:1000,d:'转回剧本作家'},art:{fee:1000,d:'转回设计师'},sound:{fee:1000,d:'转回音效师'},
  prod:{fee:3000,need:['plan'],d:'当制作人时全员点数 +10%'},
  hw:{fee:3000,need:['prog'],d:'以后自建渠道需要'},
  hacker:{fee:8000,need:['prog','plan'],d:'四项 +5，写的 Bug 很少，修 Bug 快',bonus:{prog:5,scen:5,gfx:5,snd:5}}};
function addExp(s,n){if(!s||!S.staff.includes(s)||(s.lv||1)>=LV_MAX)return;s.lv=s.lv||1;s.exp=(s.exp||0)+n;let up=0;
  while(s.lv<LV_MAX&&s.exp>=LV_EXP[s.lv]){s.lv++;up++;const mk=MAINK[s.job];for(const k of STAFFK)s[k]+=k===mk?3:1;s.salary=Math.round(s.salary*1.08);}
  if(!up)return;if(s.lv>=LV_MAX){s.done=s.done||[];if(!s.done.includes(s.job))s.done.push(s.job);}
  const [x,y]=seatWorld(s.seat);schedule(.3,()=>{SND.sfx('levelup');popWorld(x,y-124,`升级！Lv${s.lv}`,'var(--gold)',true);});}
const expPct=s=>(s.lv||1)>=LV_MAX?100:Math.round(((s.exp||0)-LV_EXP[(s.lv||1)-1])/(LV_EXP[s.lv||1]-LV_EXP[(s.lv||1)-1])*100);
function jobPick(i){closeMenu();const L=S.staff;i=(i+L.length)%L.length;const s=L[i],ok=(s.lv||1)>=LV_MAX;
  const body=h('div',{class:'card'},
    h('div',{class:'chead'},h('span',{},s.name),h('span',{class:'csal'},h('span',{class:'k'},'月薪'),h('span',{class:'num'},fmt(s.salary)+'金'))),
    staffBox(s,MAINK[s.job]),
    h('div',{class:'chint'},ok?'满级了，可以转职':`等级 ${LV_MAX} 才能转职（经验 ${expPct(s)}%）`),
    h('div',{class:'tfoot'},h('button',{type:'button',class:'cok',disabled:!ok,onclick:()=>jobCourse(i)},'转职')));
  openDlg(`转职 ${i+1}/${L.length}`,body,null,[null,{label:'返回',fn:closeDlg}]);$('#dlg').onclick=null;
  if(L.length>1){const t=$('#dlg .dlg-title');t.classList.add('pager');
    t.prepend(h('button',{type:'button',class:'pg',onclick:()=>jobPick(i-1)},'◀'));
    t.append(h('button',{type:'button',class:'pg',onclick:()=>jobPick(i+1)},'▶'));}}
function jobCourse(i){const s=S.staff[i],done=s.done||[];
  picker(`转职 · ${s.name}`,Object.entries(ADV_JOBS).filter(([j])=>j!==s.job).map(([j,J])=>{const miss=(J.need||[]).filter(x=>!done.includes(x));
    return {v:j,label:JOBN[j],disabled:miss.length>0||S.money<J.fee,sub:miss.length?`需要${miss.map(x=>JOBN[x]).join('、')}练满过`:`${fmt(J.fee)}金 · ${J.d}`};}),
    j=>{const J=ADV_JOBS[j];addMoney(-J.fee);const from=JOBN[s.job];s.job=j;s.lv=1;s.exp=0;for(const k in J.bonus||{})s[k]+=J.bonus[k];save();renderAll();SND.sfx('levelup');
      talk([`${s.name}从${from}转职成了${JOBN[j]}！`,'等级从 1 开始，能力都保留下来了。'],()=>jobPick(i));},()=>jobPick(i));}

// ================= 除 Bug 阶段
// 进度 100% 时还有 Bug：问要不要继续修。除错中每周按全员编程减少 Bug，修完自动提交；「开发 → 新企划」可随时喊停发售。
const bugN=p=>Math.round(p.bugs);
const fixPower=()=>S.staff.reduce((a,s)=>a+(isSeated(s.id)?s.prog*(s.job==='hacker'?.12:.06):0),0);
function devDone(p){if(bugN(p)>=1&&!p.debugAsked){p.debugAsked=true;const wk=Math.max(1,Math.ceil(p.bugs/Math.max(.5,fixPower())));
    talk([`《${p.title}》完成了！`,`不过还有 ${bugN(p)} 个 Bug，要继续修吗？`],()=>picker('发售前',[{v:0,label:'直接发售',sub:'Bug 会拉低评分'},{v:1,label:'继续修 Bug',sub:`全部修完大约 ${wk} 周`}],
      v=>{closeDlg();if(v){p.debug=true;p.awaiting=null;renderInfo();talk(['开始除错！','想提前发售的话，从「开发 → 新企划」喊停。']);}else submit(p,[]);},null));return;}
  submit(p,[`《${p.title}》完成了！`]);}
function submit(p,lines){const C=CN[p.chan];p.debug=false;p.awaiting='done';SND.sfx('complete');
  talk([...lines,C.rev?`提交到${C.n}审核，大约要 ${C.rev} 周。`:'马上发售吧。'],()=>{if(C.rev){p.awaiting='review';p.review=C.rev;renderInfo();}else release();});}
function debugWeek(){const p=S.project;let fix=0;
  for(const s of S.staff){if(!isSeated(s.id))continue;const f=s.prog*(s.job==='hacker'?.12:.06)*rnd(.7,1.3);fix+=f;addExp(s,2);
    const [x,y]=seatWorld(s.seat);if(f>=.3)schedule(rnd(0,WEEK_SEC*.6),()=>isSeated(s.id)&&popWorld(x,y-104,`-${Math.max(1,Math.round(f))}`,STATC.bug,false,'bug'));}
  p.bugs=Math.max(0,p.bugs-fix);
  if(p.bugs<.5){p.bugs=0;p.debug=false;p.awaiting='done';schedule(.5,()=>submit(p,['Bug 全部修好了！']));}}
function debugStopAsk(){const p=S.project;closeMenu();
  picker('除错中',[{v:1,label:'现在发售',sub:`还剩 ${bugN(p)} 个 Bug`},{v:0,label:'继续修'}],v=>{closeDlg();if(v){p.awaiting='done';submit(p,[]);}},closeDlg);}

// ---- 职员培训：选职员 → 选培训内容 → 培训动画（时间暂停）→ 回到选职员
// fee=费用；sta=消耗体力（负数=恢复）；gain=各项基础成长（main=本职能力）；un=解锁条件
const TRAINS=[
  {id:'walk',n:'散步',fee:50,sta:5,gain:{rand:2},d:'随机小幅提升'},
  {id:'code',n:'刷算法题',fee:200,sta:12,gain:{prog:4},d:'编程↑'},
  {id:'read',n:'读书充电',fee:200,sta:10,gain:{scen:4},d:'编剧↑'},
  {id:'sketch',n:'写生速写',fee:200,sta:10,gain:{gfx:4},d:'画面↑'},
  {id:'music',n:'扒谱练琴',fee:200,sta:10,gain:{snd:4},d:'作曲↑'},
  {id:'jam',n:'参加 GameJam',fee:600,sta:30,gain:{prog:3,scen:3,gfx:3,snd:3},d:'全面提升·很累',un:'g:1'},
  {id:'class',n:'大厂进修班',fee:1500,sta:20,gain:{main:10,all:2},d:'本职大幅提升',un:'y:2'},
  {id:'spa',n:'泡温泉',fee:300,sta:-100,gain:{},d:'体力回满'}];
const MAINK={prog:'prog',plan:'scen',art:'gfx',sound:'snd',prod:'scen',hw:'prog',hacker:'prog'};
// 能力越高越难涨；有基础成长的项至少 +1
function trainGains(s,c){const base={};const G=c.gain;
  if(G.rand)for(const k of STAFFK)base[k]=rint(0,G.rand);
  for(const k of STAFFK)if(G[k])base[k]=(base[k]||0)+G[k];
  if(G.all)for(const k of STAFFK)base[k]=(base[k]||0)+G.all;
  if(G.main)base[MAINK[s.job]]=(base[MAINK[s.job]]||0)+G.main;
  const out={};for(const k in base){if(!base[k])continue;out[k]=Math.max(1,Math.round(base[k]*rnd(.7,1.3)*clamp(60/(40+s[k]),.3,1.4)));}return out;}
function trainPick(i){const list=S.staff;i=(i+list.length)%list.length;const s=list[i];const out=away.has(s.id);
  const body=h('div',{class:'card'},
    h('div',{class:'chead'},h('span',{},s.name),h('span',{class:'csal'},h('span',{class:'k'},'月薪'),h('span',{class:'num'},fmt(s.salary)+'金'))),
    staffBox(s,MAINK[s.job]),
    h('div',{class:'chint'},out?'正在外面休息，回来后才能培训':'选择要培训的职员'),
    h('div',{class:'tfoot'},h('button',{type:'button',class:'cok',disabled:out,onclick:()=>trainCourse(i)},'培训')));
  openDlg(`选择职员 ${i+1}/${list.length}`,body,null,[null,{label:'返回',fn:closeDlg}]);$('#dlg').onclick=null;
  const t=$('#dlg .dlg-title');t.classList.add('pager');
  t.prepend(h('button',{type:'button',class:'pg',onclick:()=>trainPick(i-1)},'◀'));
  t.append(h('button',{type:'button',class:'pg',onclick:()=>trainPick(i+1)},'▶'));}
function trainCourse(i){const s=S.staff[i];
  picker(`培训内容 · ${s.name}`,TRAINS.map(c=>{const u=cond(c.un);const noMoney=S.money<c.fee,tired=c.sta>0&&s.sta<c.sta,full=c.sta<0&&s.sta>=100;
    return {v:c.id,label:c.n,disabled:!u.ok||noMoney||tired||full,
      sub:!u.ok?u.txt:noMoney?`${fmt(c.fee)}金 · 资金不足`:tired?`体力不足（需 ${c.sta}）`:full?'体力已满':`${fmt(c.fee)}金 · ${c.sta>0?'体力-'+c.sta:'体力回满'} · ${c.d}`};}),
    id=>doTrain(i,TRAINS.find(c=>c.id===id)),()=>trainPick(i));}
function doTrain(i,c){const s=S.staff[i];addMoney(-c.fee);const gains=trainGains(s,c);const before={};for(const k of STAFFK)before[k]=s[k];
  for(const k in gains)s[k]+=gains[k];s.sta=clamp(s.sta-c.sta,0,100);addExp(s,3);save();
  const fill=h('i',{}),fig=staffFig(s);fig.classList.add('tfig','t-'+c.id);
  const left=h('div',{class:'tscene'},h('div',{class:'tbar'},fill),h('div',{class:'tsky'}),h('div',{class:'tcity'}),h('div',{class:'tground'}),fig);
  const box=staffBox({...s,...before},null,left);const msg=h('div',{class:'chint'},`正在培训${c.n}`);
  openDlg('正在培训',h('div',{class:'card'},h('div',{class:'chead',style:'justify-content:center'},s.name),box,msg),null,[null,null]);$('#dlg').onclick=null;renderAll();
  const DUR=2400,keys=Object.keys(gains);const t0=performance.now();
  // 每项分几次往上跳，并在数字旁冒「+n」
  const steps=[];for(const k of keys){let left=gains[k];const n=Math.min(left,3);for(let j=0;j<n;j++){const d=j===n-1?left:Math.max(1,Math.round(gains[k]/n));left-=d;steps.push([k,d]);}}
  steps.sort(()=>Math.random()-.5).forEach(([k,d],j)=>setTimeout(()=>{const row=box.querySelector(`.cs[data-k="${k}"]`);if(!row)return;const b=row.querySelector('b');b.textContent=+b.textContent+d;
    SND.sfx('plus');row.classList.add('up');const pl=h('em',{class:'tplus'},'+'+d);row.append(pl);pl.addEventListener('animationend',()=>pl.remove());},DUR*(j+1)/(steps.length+1)));
  const tick=now=>{const u=clamp((now-t0)/DUR,0,1);fill.style.width=(u*100)+'%';if(u<1)requestAnimationFrame(tick);else done();};requestAnimationFrame(tick);
  function done(){for(const k of STAFFK){const row=box.querySelector(`.cs[data-k="${k}"] b`);if(row)row.textContent=s[k];}
    SND.sfx(keys.length||c.sta<0?'levelup':'bad');msg.textContent=keys.length?'培训完成！'+keys.map(k=>`${SKN[k][0]}+${gains[k]}`).join('  '):c.sta<0?'泡完温泉，体力回满了！':'培训完成！这次没什么收获…';
    const next=()=>trainPick(i);setBottom(null,{label:'确定',fn:next});setTimeout(()=>{$('#dlg').onclick=next;},0);}}

    const body=h('div',{class:'adbox'},
      h('div',{class:'adhead'},h('span',{},'宣传方式'),h('span',{},'费用')),
      h('div',{class:'adlist'},...rows),
      h('div',{class:'chint'},'知名度与公司粉丝产生变化'));
    const foot=okFoot('确定',()=>{if(sel)doAd(ADS.find(a=>a.id===sel));});foot.firstChild.disabled=!sel;
    openDlg('宣传方式 1/1',body,foot,[null,{label:'返回',fn:closeDlg}]);$('#dlg').onclick=null;};
  render();}
function doAd(a){if(S.money<a.fee)return;addMoney(-a.fee);const games=onSale();
  const best=Math.max(...games.map(g=>g.total));
  const fans=Math.round(a.fans*rnd(.8,1.2)*(.5+best/40));S.fans+=fans;
  // 同一部作品连续宣传，边际效果递减
  for(const g of games)g.ad=(g.ad||0)+a.boost/(1+(g.ad||0));
  save();renderAll();SND.sfx('promo');const [x,y]=tc(3,2.5);popWorld(x,y-60,`粉丝 +${fmt(fans)}`,'var(--gold)');
  const names=games.slice(0,2).map(g=>`《${g.title}》`).join('、')+(games.length>2?'等作品':'');
  talk([`${a.n}，粉丝增加了 ${fmt(fans)} 人！`,`${names}接下来几周的销量会上涨。`]);}
function recordsDlg(){openDlg('作品记录',S.games.length?h('div',{},...S.games.map(g=>h('div',{class:'srow',style:'grid-template-columns:1fr 90rem 140rem'},h('span',{},`《${g.title}》`,h('small',{style:'color:var(--ink-soft);font-size:20rem;margin-left:8rem'},(CN[g.chan]||CN.web).n)),h('b',{class:'num'},`${g.total}分`),h('b',{class:'num'},fmt(g.units))))):h('div',{style:'font-size:30rem;text-align:center;padding:30rem'},'还没有发售过作品'),okFoot('确定',closeDlg),[null,{label:'返回',fn:closeDlg}]);$('#dlg').onclick=null;}
// 声音设置：音乐 / 音效各自开关，记在本地
function soundDlg(){const row=(k,n)=>({v:k,label:`${n}　${SND.get(k)?'开':'关'}`,sel:SND.get(k)});
  picker('声音',[row('mus','音乐'),row('sfx','音效')],k=>{SND.set(k,!SND.get(k));soundDlg();},closeDlg);}
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button,.ar');if(b&&!b.disabled)SND.sfx('tap');},true);
function restartAsk(){picker('重新开始？',[{v:1,label:'清空进度，从 1 年 4 月开始'},{v:0,label:'算了'}],v=>{closeDlg();if(v)restartNow();},closeDlg);}
function restartNow(){askCompany();}
// 月底发完工资还是负数：秘书提醒，可以直接重开
function brokeAsk(){SND.sfx('bad');talk(['社长，发完工资后资金变成负数了……','要不要从头再来？'],()=>picker('资金不足',[{v:1,label:'重新开始',sub:'清空进度，从 1 年 4 月开始'},{v:0,label:'继续经营',sub:'等新作卖钱'}],v=>{closeDlg();if(v)restartNow();},null));}

// ================= 信息栏
// 信息栏分页：sale = 最新在售作品的每周销量柱状图；dev = 新作开发进度；year = 全年销售/收益
const infoPages=()=>[S.games[0]?'sale':null,S.project?'dev':null,S.contract?'job':null,'year'].filter(Boolean);
let chartSeen={title:null,n:0};
function salePage(pg,g){const hist=g.hist||[],N=Math.max(24,hist.length),last=hist[hist.length-1]||0,mx=Math.max(1,...hist);
  const isNew=chartSeen.title===g.title&&hist.length>chartSeen.n;const from=isNew?g.units-last:g.units;chartSeen={title:g.title,n:hist.length};
  const bars=[];for(let i=0;i<N;i++){const v=hist[i];bars.push(h('i',{class:v==null?'':(i===hist.length-1?'cur'+(isNew?' grow':''):''),style:v==null?'':`height:${Math.max(4,v/mx*100)}%`}));}
  const tot=h('b',{class:'num'},fmt(from));
  pg.className='isale';pg.replaceChildren(
    h('div',{class:'sl'},h('div',{class:'st'},`《${g.title}》`),h('div',{class:'sr'},h('span',{class:g.onSale?'':'off'},g.onSale?`第${hist.length}周`:'已下架'),h('b',{class:'num'},hist.length?'+'+fmt(last):'—')),h('div',{class:'sr'},h('span',{},'累计'),h('span',{},tot,'套'))),
    h('div',{class:'div'}),
    h('div',{class:'chart',style:`--n:${N}`},...bars));
  if(isNew&&last>0){const t0=performance.now(),D=900;const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);tot.textContent=fmt(Math.round(from+last*e));if(k<1&&tot.isConnected)requestAnimationFrame(step);};requestAnimationFrame(step);}}
function renderInfo(){const pg=$('#ipage');const p=S.project;const pages=infoPages();if(!pages.includes(UI.pk))UI.pk=pages[0];const pi=pages.indexOf(UI.pk);
  if(UI.pk==='sale')salePage(pg,S.games[0]);
  else if(UI.pk==='dev'){const ic=k=>h('span',{},icon(k),h('span',{class:'cnt num'+(k==='bug'?' bug':'')},Math.round(k==='bug'?p.bugs:p[k])));
    pg.className='ipd';pg.replaceChildren(h('div',{class:'r'},h('span',{class:'lab',style:'width:110rem;color:var(--ink)'},'新作'),ic('fun'),ic('creat'),ic('gfx'),ic('snd')),
      h('div',{class:'r'},h('span',{class:'pct num'},p.debug?'除错':Math.floor(p.progress)+'%'),h('span',{class:'lab'},'期待度 ',h('b',{class:'num',style:'color:var(--ink)'},Math.round(p.hype))),h('span',{class:'lab'},'知名度 ',h('b',{class:'num',style:'color:var(--ink)'},fmt(S.fans))),ic('bug')));}
  else if(UI.pk==='job'){const c=S.contract;
    pg.className='ipd';pg.replaceChildren(h('div',{class:'r'},h('span',{class:'lab',style:'width:110rem'},'委托'),h('span',{class:'jn'},c.n),h('span',{class:'lab'},c.client)),
      h('div',{class:'r'},h('span',{class:'pct num'},Math.floor(contractPct(c))+'%'),h('span',{class:'lab'},`第 ${c.w}/${c.wk} 周`),h('span',{class:'lab'},'报酬 ',h('b',{class:'num',style:'color:var(--ink)'},fmt(c.pay)+'金'))));}
  else{pg.className='ip';pg.replaceChildren(h('div',{class:'ys'},h('div',{},h('span',{},'全年销售'),h('b',{class:'num'},fmt(S.ys.units))),h('div',{},h('span',{},'全年收益'),h('b',{class:'num',style:S.ys.profit<0?'color:var(--neg)':''},fmt(S.ys.profit)+'金'))),
      h('div',{class:'div'}),h('div',{class:'rt'},p?(p.awaiting==='review'?`《${p.title}》审核中`:(p.debug?`《${p.title}》除错中`:`《${p.title}》开发中`)):S.contract?'委托开发中':'无新作开发'));}
  $('#thumb').style.top=(pi*100/pages.length)+'%';$('#thumb').style.height=(100/pages.length)+'%';}
$('#pgUp').onclick=()=>{const ps=infoPages();UI.pk=ps[Math.max(0,ps.indexOf(UI.pk)-1)];renderInfo();};
$('#pgDn').onclick=()=>{const ps=infoPages();UI.pk=ps[Math.min(ps.length-1,ps.indexOf(UI.pk)+1)];renderInfo();};
function renderTop(){$('#date').firstChild.textContent=`${S.year}年 ${S.month}月 ${S.week}周 `;$('#tick').classList.toggle('blink',!blocking());$('#money').textContent=fmt(S.money)+'金';$('#money').style.color=S.money<0?'var(--neg)':'';$('#badgeNum').textContent=fmt(S.fans);}
function renderAll(){renderTop();renderInfo();SND.music(S.project?'dev':'office');}

// ================= 杂项
function popWorld(wx,wy,text,color,talkStyle,ik){const [x,y]=w2s(wx,wy);const el=h('div',{class:'pop'+(talkStyle?' talk':'')+(ik?' ipop':''),style:`left:${x}px;top:${y}px;--c:${color||'#3651C9'}`},ik?icon(ik,'pico','stat','transparent'):null,text);$('#fx').append(el);el.addEventListener('animationend',()=>el.remove());if(ik)SND.sfx(ik==='bug'?'bug':'pop',ik);}
const KEY='kaifa_wuyu_v2';
function doSave(){try{localStorage.setItem(KEY,JSON.stringify(S));toast('已保存');SND.sfx('save');}catch(e){toast('这个浏览器不能本地存档');}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&(s.v===2||s.v===3)){S=migrate(s);if(!S.mag)S.mag=magInit();S.company=S.company||DEF_COMPANY;S.uid=S.uid||10;S.hist=S.hist||[];if(!S.combos)S.combos=Object.fromEntries(S.games.map(g=>[g.genre+'|'+g.type,true]));return true;}}catch(e){}return false;}
$('#sidetab').onclick=()=>{if(!blocking())talk(['这里以后放快捷列表（职员状态、在售作品）。']);};
$('#tabUp').onclick=()=>{UI.collapsed=!UI.collapsed;$('#info').hidden=UI.collapsed;$('#tabUp').classList.toggle('down',UI.collapsed);};

// 镜头拖动 / 缩放 / 点员工
// ptrs: 当前按下的手指 id → {x,y}；pinch: 双指缩放起始状态；multi: 本次手势出现过多指（不触发点击）
const ptrs=new Map();let drag=null,moved=0,pinch=null,multi=false;
function startDrag(x,y){drag={x,y,cx:cam.x,cy:cam.y};}
function startPinch(){const [a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),z:cam.z,wx:(mx-cam.x)/cam.z,wy:(my-cam.y)/cam.z};drag=null;}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});if(ptrs.size===1){moved=0;multi=false;startDrag(e.offsetX,e.offsetY);}else if(ptrs.size===2){multi=true;startPinch();}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.offsetX;p.y=e.offsetY;
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.25,3);cam.fit=false;cam.z=z;cam.x=mx-pinch.wx*z;cam.y=my-pinch.wy*z;return;}
  if(!drag)return;const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>6){cam.fit=false;cam.x=drag.cx+dx;cam.y=drag.cy+dy;}});
function endPtr(e,tap){if(!ptrs.has(e.pointerId))return;if(tap&&ptrs.size===1&&drag&&!multi&&moved<=6&&!blocking())tapAt(e.offsetX,e.offsetY);ptrs.delete(e.pointerId);
  if(ptrs.size===1){pinch=null;const [p]=[...ptrs.values()];startDrag(p.x,p.y);moved=99;}else if(ptrs.size>=2)startPinch();else{pinch=null;drag=null;}}
canvas.addEventListener('pointerup',e=>endPtr(e,true));
canvas.addEventListener('pointercancel',e=>endPtr(e,false));
canvas.addEventListener('wheel',e=>{e.preventDefault();const z=clamp(cam.z*Math.exp(-e.deltaY*.0015),.25,3);const wx=(e.offsetX-cam.x)/cam.z,wy=(e.offsetY-cam.y)/cam.z;cam.fit=false;cam.z=z;cam.x=e.offsetX-wx*z;cam.y=e.offsetY-wy*z;},{passive:false});
canvas.addEventListener('dblclick',()=>{cam.fit=true;fitCam();});
function tapAt(x,y){for(const s of S.staff){const ps=personState(s.id);if(ps.mode==='absent')continue;const [wx,wy]=ps.mode==='walk'?[ps.x,ps.y]:seatWorld(s.seat);const [sx,sy]=w2s(wx,wy);if(Math.abs(x-sx)<20*cam.z&&y>sy-100*cam.z&&y<sy+6*cam.z){staffDlg();return;}}}

// ================= 渲染循环
function draw(t){if(!gl)return;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.68,.71,.76,1);gl.clear(gl.COLOR_BUFFER_BIT);
  nq=0;const hasBG=!!bgTex.bg_city;if(hasBG)bgQuad();const q0=nq;for(const [k,x,y,fl] of staticFlat)if(!(hasBG&&k==='outside'))spr(k,x,y,fl);drawShadows();const items=[];
  for(const [k,x,y] of DECOR){const [sx,sy]=tc(x,y);items.push([x+y,k,sx,sy]);}
  for(const s of SEATS){const [x,y]=s.d;const [sx,sy]=tc(x,y);items.push([x+y,s.k==='a'?'desk':'desk_back',sx,sy]);}
  for(const [who,o,desk] of [['boss',BOSS,'boss_desk'],['secretary',SEC_SPOT,'reception']]){const [x,y]=o.d;const [sx,sy]=tc(x,y);items.push([x+y,desk,sx,sy]);const [wx,wy,dd]=deskSeat(o.d,'b');items.push([dd-.01,'chair',wx,wy]);const ps=personState(who);if(ps.mode==='seat')items.push([dd,`${who}_${Math.floor(t*.7+(who==='boss'?0:.5))%2?'b':'a'}`,wx,wy]);else if(ps.mode==='walk')items.push([ps.d,ps.key,ps.x,ps.y,ps.flip,ps.a]);}
  const working=!!(S.project&&!S.project.awaiting)&&!blocking();
  for(let i=0;i<SEATS.length;i++){const [wx,wy,dd]=seatWorld(i);items.push([dd-.01,'chair',wx,wy]);}
  for(const s of S.staff){const ps=personState(s.id);if(ps.mode==='walk'){items.push([ps.d,ps.key,ps.x,ps.y,ps.flip,ps.a]);continue;}if(ps.mode!=='seat')continue;const [wx,wy,dd]=seatWorld(s.seat);const f=working?(Math.floor(t*5+s.seat*1.7)%2?'b':'a'):'a';items.push([dd,`char_${s.look%CHAR_N}_${SEATS[s.seat].k==='a'?'back':'front'}_${f}`,wx,wy+(working?0:Math.sin(t*1.5+s.seat)*1.2)]);}
  items.sort((a,b)=>a[0]-b[0]);for(const it of items)spr(it[1],it[2],it[3],it[4],it[5]);const cs=carSprite();if(cs)spr(...cs);const q1=nq;if(bgTex.bg_city_front)bgQuad();
  gl.uniform2f(uRes,stageW,stageH);gl.uniform3f(uCam,cam.x,cam.y,cam.z);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferSubData(gl.ARRAY_BUFFER,0,vdata.subarray(0,nq*48));
  if(hasBG){gl.bindTexture(gl.TEXTURE_2D,bgTex.bg_city);gl.drawArrays(gl.TRIANGLES,0,q0*6);}
  gl.bindTexture(gl.TEXTURE_2D,tex);gl.drawArrays(gl.TRIANGLES,q0*6,(q1-q0)*6);
  if(nq>q1){gl.bindTexture(gl.TEXTURE_2D,bgTex.bg_city_front);gl.drawArrays(gl.TRIANGLES,q1*6,(nq-q1)*6);}}
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!blocking()){simT+=dt;weekAcc+=dt;updateAway();for(let i=0;i<pending.length&&!blocking();)if(pending[i].at<=simT){const p=pending.splice(i,1)[0];p.fn();}else i++;if(weekAcc>=WEEK_SEC&&!blocking()){weekAcc-=WEEK_SEC;weekTick();}}
  updateCar(dt);renderTop();draw(now/1000);requestAnimationFrame(frame);}
function tryLoadArt(){return fetch('assets/index.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(keys=>{keys=Array.isArray(keys)?keys:[];loadBG(keys);return Promise.all((Array.isArray(keys)?keys:[]).filter(k=>M[k]).map(k=>new Promise(res=>{const img=new Image();img.onload=()=>{overrides[k]=img;res();};img.onerror=()=>res();img.src=`assets/${k}.png`;})));});}
function start(){if(gl)initGL();buildStatic();buildAtlas();if(!load())newGame();if(!S.unl)S.unl=unlockedIds();
  resize();renderAll();showTitle();requestAnimationFrame(frame);loadStaffArt();loadIconArt();loadMagArt();tryLoadArt().then(()=>{if(Object.keys(overrides).length)buildAtlas();});}
start();
