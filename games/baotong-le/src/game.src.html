<title>爆桶了·垃圾分类大作战</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Outfit:wght@700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 整页只有一块 WebGL 画布，界面也画在画布里（和微信小游戏同一套代码） */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);color-scheme:light}
html,body{height:100%;margin:0;background:#f5f1e8;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;display:block;touch-action:none}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;font:15px/1.6 system-ui,sans-serif;color:#1b2a4a;text-align:center}
</style>
<div id="app"><canvas id="cv" aria-label="爆桶了 游戏画面"></canvas><div id="err"></div></div>
<script>
addEventListener('error',e=>{const el=document.getElementById('err');el.style.display='grid';el.textContent='游戏启动失败：'+(e.message||e.error);});
</script>
<script>
/*GAME*/
</script>
