:root {
  --teal: #48b8af; --teal-d: #23807a; --cream: #fff4db; --coral: #ef7965; --coral-d: #c4553c;
  --wood: #c99a62; --wood-d: #8a5a32; --ink: #3a2416; --gold: #f5c03a;
  --font: Nunito, "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: #e6c48f; color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* 顶栏：体力 / 金币 / 星星 */
#hud { position: fixed; z-index: 2; display: flex; gap: 10px; justify-content: center; pointer-events: none; }
.pill { pointer-events: auto; position: relative; display: flex; align-items: center; gap: 6px; min-width: 84px; height: 38px; padding: 0 14px 0 4px;
  background: var(--cream); border: 3px solid #e9d2a6; border-radius: 22px; box-shadow: 0 3px 0 rgba(120,80,40,.35);
  font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; box-sizing: border-box; transition: transform .12s; }
.pill.bump { transform: scale(1.12); }
.pill svg { width: 30px; height: 30px; flex: none; margin-left: -10px; filter: drop-shadow(0 2px 0 rgba(120,80,40,.3)); }
.pill .sub { font-size: 12px; font-weight: 800; opacity: .65; }
#energy-timer:empty { display: none; }

/* 底部导航（Tasks 不在 #39 范围，只做 Café / Merge） */
#nav { position: fixed; z-index: 2; display: flex; gap: 10px; }
.navb { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid #e9d2a6; border-radius: 18px;
  background: var(--cream); color: var(--teal-d); font: 900 20px var(--font); box-shadow: 0 4px 0 rgba(120,80,40,.35); cursor: pointer; padding: 0 10px; }
.navb svg { width: 34px; height: 34px; flex: none; }
.navb.on { background: var(--coral); border-color: #f6a08f; color: #fff; box-shadow: 0 4px 0 var(--coral-d); }
.navb:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(120,80,40,.35); }
body.tut #nav { opacity: .45; pointer-events: none; }

/* 新手引导气泡 */
#tip { position: fixed; z-index: 4; display: none; box-sizing: border-box; width: max-content; padding: 12px 16px; border-radius: 16px; background: var(--cream);
  border: 3px solid var(--teal-d); box-shadow: 0 4px 0 rgba(30,70,70,.4); font: 800 17px/1.3 var(--font); text-align: center; transform: translate(-50%, -100%);
  animation: tipIn .3s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
#tip.show { display: block; }
@keyframes tipIn { from { transform: translate(-50%, -100%) scale(.8); opacity: 0; } }

/* 提示 */
#toast { position: fixed; z-index: 5; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .2s, transform .2s;
  max-width: min(86vw, 420px); padding: 10px 16px; border-radius: 14px; background: rgba(58,36,22,.92); color: #fff8ec;
  font-weight: 800; font-size: 16px; text-align: center; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 弹窗 */
#modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(20,40,45,.45); }
#modal.show { display: flex; }
.card { width: min(86vw, 340px); background: var(--cream); border: 4px solid var(--wood-d); border-radius: 22px; box-shadow: 0 6px 0 rgba(60,35,20,.4);
  padding: 18px 18px 16px; text-align: center; animation: pop .22s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card h2 { margin: 0 0 8px; font-size: 23px; font-weight: 900; color: var(--teal-d); }
.card p { margin: 0 0 16px; font-size: 17px; font-weight: 700; line-height: 1.35; }
.btns { display: flex; gap: 10px; justify-content: center; }
.btn { appearance: none; border: 3px solid var(--coral-d); background: var(--coral); color: #fff; font: 900 18px var(--font);
  border-radius: 16px; padding: 10px 18px; min-width: 110px; box-shadow: 0 4px 0 var(--coral-d); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--coral-d); }
.btn.alt { background: #fff; color: var(--ink); border-color: var(--wood-d); box-shadow: 0 4px 0 var(--wood-d); }

/* 装修面板（Café 模式） */
#deco { position: fixed; z-index: 3; display: none; box-sizing: border-box; padding: 12px 14px 14px; background: var(--cream);
  border: 3px solid #e9d2a6; border-radius: 20px; box-shadow: 0 5px 0 rgba(120,80,40,.35); }
body.cafe #deco { display: block; }
.deco-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
#deco-act { font-size: 19px; font-weight: 900; color: var(--teal-d); }
#deco-prog { font-weight: 900; opacity: .6; }
#deco-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 10px; }
.chip { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 10px; background: #f6e7c6;
  font-size: 13px; font-weight: 800; }
.chip b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip span { flex: none; color: #c4851a; font-weight: 900; }
.chip.done { background: #d9f1e2; } .chip.done span { color: #2e9a5a; }
.chip.next { background: #fff; outline: 3px solid var(--gold); }
.chip.todo { opacity: .55; }
#deco-btn { width: 100%; }
#deco-btn.dim { filter: grayscale(.6); opacity: .7; }
.navb { position: relative; }
.navb.dot::after { content: ""; position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: #e2433a; border: 3px solid #fff; }

/* 激励视频：订单翻倍按钮（不打断操作，几秒后消失） */
#x2 { position: fixed; z-index: 3; display: none; transform: translateX(-50%); border: 3px solid #fff; border-radius: 16px; padding: 6px 12px;

/* 本地化：所有玩家可见文案只从 locale/en.json 取（构建时内联为 LOCALE）。
   DOM 里写 data-l10n="key"，启动时 L.apply() 统一填。 */
const L = (() => {
  const table = LOCALE;
  const missing = new Set();
  function t(key, vars) {
    let s = table[key];
    if (s === undefined) { if (!missing.has(key)) { missing.add(key); console.warn('[l10n] missing', key); } s = key; }
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    return s;
  }
  function apply(root) { for (const el of (root || document).querySelectorAll('[data-l10n]')) el.textContent = t(el.dataset.l10n); }
  return { t, apply, missing };
})();

/* Merge Café Lite · 核心逻辑（纯数据，不碰 DOM / WebGL）
   浏览器里挂到全局 Core，Node 里 require 后做单测（tools/test_core.js）。
   所有数值来自 CONFIG（src/config/*.json），这里不写死任何数。
   时间一律用毫秒时间戳 now 传入，随机数用 rng 传入，方便离线结算和测试。 */
const Core = (() => {
  const SAVE_VERSION = 3;
  const TUT_DONE = -1;

  /* ---------- 配置索引 ---------- */
  function index(cfg) {
    const b = cfg.board, gens = {};
    for (const g of cfg.generators.generators) gens[g.id] = g;
    const O = cfg.orders, tpl = {};
    for (const t of O.templates) tpl[t.id] = t;
    if (cfg.tutorial && cfg.tutorial.firstOrder) tpl[cfg.tutorial.firstOrder.id] = cfg.tutorial.firstOrder;
    const deco = [];
    if (cfg.deco) cfg.deco.acts.forEach((a, ai) => a.nodes.forEach((nd, ni) => deco.push(Object.assign({ act: ai, inAct: ni, actName: a.name }, nd))));
    return {
      deco, ads: cfg.ads || {},
      cfg, cols: b.cols, rows: b.rows, n: b.cols * b.rows,
      maxLevel: cfg.chains.maxLevel, chains: cfg.chains.chains, gens, genList: cfg.generators.generators,
      eco: cfg.economy, O, tpl, tut: cfg.tutorial || { enabled: false },
    };
  }
  const idx = (C, r, c) => r * C.cols + c;
  const rc = (C, i) => [Math.floor(i / C.cols), i % C.cols];
  const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

  /* ---------- 新档 ---------- */
  function newState(C, now, rng) {
    rng = rng || Math.random;
    const b = C.cfg.board;
    const s = {
      v: SAVE_VERSION,
      coins: C.eco.startCoins, stars: C.eco.startStars, gems: C.eco.startGems,
      energy: C.eco.energy.start, energyTs: now,
      cells: new Array(C.n).fill(null),
      unlocked: new Array(C.n).fill(false),
      gens: {},
      orders: [],
      tut: C.tut.enabled ? 0 : TUT_DONE,
      seq: 0,
      deco: 0,                 // 已完成的装修节点数（按顺序解锁）
      ads: newAdStats(),
      stats: { merges: 0, spawns: 0, ordersDone: 0, coinsEarned: 0, firstMergeAt: 0, firstOrderAt: 0, createdAt: now },
    };
    for (let r = 0; r < C.rows; r++) for (let c = 0; c < C.cols; c++) s.unlocked[idx(C, r, c)] = b.mask[r][c] === 'x';
    for (const g of C.genList) s.gens[g.id] = { charges: g.charges, cdEnd: 0 };
    for (const it of b.startItems) s.cells[idx(C, it.at[0], it.at[1])] = { k: 'item', chain: it.chain, lvl: it.level };
    for (let k = 0; k < C.O.slots; k++) {
      if (k === 0 && s.tut !== TUT_DONE) s.orders.push(makeOrder(C, s, C.tut.firstOrder, now, rng, C.tut.firstOrder.customer));
      else s.orders.push(rollOrder(C, s, now, rng));
    }
    return s;
  }

  /* ---------- 体力：按时间戳结算，返回本次恢复了多少 ---------- */
  function settleEnergy(C, s, now) {

  api.begin = function (rgb) {
    gl.clearColor(rgb[0], rgb[1], rgb[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
    nq = 0; draws = 0; api.alpha = 1; M = [1, 0, 0, 1, 0, 0]; stack.length = 0;
  };
  function flush() {
    if (!nq) return;
    gl.uniform2f(uRes, W, H); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, buf.subarray(0, nq * 4 * FL));
    gl.drawElements(gl.TRIANGLES, nq * 6, gl.UNSIGNED_SHORT, 0);
    nq = 0; draws++;
  }
  api.end = () => { flush(); return draws; };

  /* 变换（弹跳缩放用） */
  api.save = () => stack.push(M.slice());
  api.restore = () => { M = stack.pop() || [1, 0, 0, 1, 0, 0]; };
  api.scaleAt = function (cx, cy, s) {
    const [a, b, c, d, e, f] = M;
    M = [a * s, b * s, c * s, d * s, a * cx * (1 - s) + c * cy * (1 - s) + e, b * cx * (1 - s) + d * cy * (1 - s) + f];
  };

  /* 轴对齐四边形：中心 (cx,cy)，半尺寸 hw/hh；loc 四角 = (l0,t0)…(l1,t1) */
  function quad(cx, cy, hw, hh, l0, t0, l1, t1, p0, p1, p2, p3, kind, q1, q2, soft, col) {
    if (nq >= MAXQ) flush();
    const a = col[3] * api.alpha; if (a <= 0.003) return;
    const r = col[0] * a, g = col[1] * a, b = col[2] * a;
    const [m0, m1, m2, m3, m4, m5] = M;
    let o = nq * 4 * FL;
    for (let k = 0; k < 4; k++) {
      const sx = (k === 0 || k === 3) ? -1 : 1, sy = k < 2 ? -1 : 1;
      const x = cx + hw * sx, y = cy + hh * sy;
      buf[o] = m0 * x + m2 * y + m4; buf[o + 1] = m1 * x + m3 * y + m5;
      buf[o + 2] = sx < 0 ? l0 : l1; buf[o + 3] = sy < 0 ? t0 : t1;
      buf[o + 4] = p0; buf[o + 5] = p1; buf[o + 6] = p2; buf[o + 7] = p3;
      buf[o + 8] = kind; buf[o + 9] = q1; buf[o + 10] = q2; buf[o + 11] = soft;
      buf[o + 12] = r; buf[o + 13] = g; buf[o + 14] = b; buf[o + 15] = a;
      o += FL;
    }
    nq++;
  }
  const aa = () => 1 / dpr;
  /* 圆角矩形（左上角 x,y）。o.stroke 描边宽，o.soft 柔边宽（做阴影） */
  api.rect = function (x, y, w, h, r, col, o) {
    const st = o && o.stroke ? o.stroke / 2 : 0, soft = (o && o.soft) || aa();
    const hw = w / 2, hh = h / 2, m = soft + 1;
    r = Math.min(r || 0, hw, hh);
    quad(x + hw, y + hh, hw + m, hh + m, -(hw + m), -(hh + m), hw + m, hh + m, hw, hh, r, st, 0, 0, 0, soft, col);
  };
  api.circle = (cx, cy, rad, col, soft) => api.rect(cx - rad, cy - rad, rad * 2, rad * 2, rad, col, soft ? { soft } : null);
  /* 圆环 / 圆弧：从 12 点方向顺时针 sweep 弧度（≥2π 为整圈） */
  api.arc = function (cx, cy, rad, w, sweep, col) {
    const hw = w / 2, m = rad + hw + 2;
    quad(cx, cy, m, m, -m, -m, m, m, rad, hw, 0, 0, 1, 0, Math.min(sweep, 6.3), aa(), col);
  };

  /* ---------- 图集 ---------- */
  function alloc(key, w, h, draw) {
    let e = atlas.map.get(key); if (e) return e;
    w = Math.max(1, Math.ceil(w)); h = Math.max(1, Math.ceil(h));
    if (atlas.x + w + 2 > atlas.size) { atlas.x = 0; atlas.y += atlas.row + 2; atlas.row = 0; }
    if (atlas.y + h + 2 > atlas.size) { // 满了：清空重来（图标会按需重画）
      flush(); atlas.x = atlas.y = atlas.row = 0; atlas.map.clear();
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, atlas.size, atlas.size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    }
    const c = atlas.scratch; c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.clearRect(0, 0, w, h); ctx.save(); draw(ctx, w, h); ctx.restore();
    flush();
    gl.texSubImage2D(gl.TEXTURE_2D, 0, atlas.x, atlas.y, gl.RGBA, gl.UNSIGNED_BYTE, c);
    e = { u0: atlas.x / atlas.size, v0: atlas.y / atlas.size, u1: (atlas.x + w) / atlas.size, v1: (atlas.y + h) / atlas.size, w, h };
    atlas.map.set(key, e); atlas.x += w + 2; atlas.row = Math.max(atlas.row, h);
    return e;
  }
  /* 图标精灵：在 w×h CSS 像素（按 dpr 放大）的格子里画；size 取 4 的倍数避免缩放时反复生成 */
  api.sprite = function (key, w, h, draw) {
    const pw = Math.max(4, Math.round(w * dpr / 4) * 4), ph = Math.max(4, Math.round(h * dpr / 4) * 4);
    return alloc(key + '|' + pw + 'x' + ph, pw, ph, (ctx) => draw(ctx, pw, ph));
  };
  api.forget = function (prefix) { for (const k of [...atlas.map.keys()]) if (k.startsWith(prefix)) atlas.map.delete(k); };
  api.img = function (e, cx, cy, w, h, col) {
    quad(cx, cy, w / 2, h / 2, e.u0, e.v0, e.u1, e.v1, 0, 0, 0, 0, 2, 0, 0, 1, col || WHITE);
  };
  const WHITE = [1, 1, 1, 1];
  /* 文字：逐字缓存进图集（计时器数字每秒变化也不会撑爆图集）。y 为中线。
     o = {size, weight, fill, outline(颜色), align: left|center|right, font} */
  api.font = 'Nunito, "Avenir Next", "Trebuchet MS", system-ui, sans-serif';
  function glyph(ch, wt, px, fill, oc, ow, font) {
    const key = 'G|' + wt + '|' + px + '|' + fill + '|' + oc + '|' + ow + '|' + font + '|' + ch;
    let e = atlas.map.get(key); if (e) return e;
    const sc = atlas.scratch.getContext('2d'); sc.font = `${wt} ${px}px ${font}`;
    const adv = sc.measureText(ch).width, pad = 2 + ow;
    e = alloc(key, adv + pad * 2, px * 1.4 + pad * 2, (g, w, h) => {
      g.font = `${wt} ${px}px ${font}`; g.textBaseline = 'middle'; g.textAlign = 'left';
      if (ow) { g.lineJoin = 'round'; g.lineWidth = ow * 2; g.strokeStyle = oc; g.strokeText(ch, pad, h / 2); }
      g.fillStyle = fill; g.fillText(ch, pad, h / 2);
    });
    e.adv = adv; e.pad = pad; return e;
  }
  function glyphs(str, o) {
    const px = Math.max(6, Math.round(o.size * dpr)), wt = o.weight || 800, font = o.font || api.font;
    const ow = o.outline ? Math.max(1, Math.round(o.size * 0.16 * dpr)) : 0;
    return Array.from(String(str)).map((ch) => glyph(ch, wt, px, o.fill || '#fff', o.outline || '', ow, font));
  }
  api.measure = (str, o) => glyphs(str, o).reduce((w, g) => w + g.adv, 0) / dpr;
  api.text = function (str, x, y, o) {
    const gs = glyphs(str, o), sc = o.scale || 1;
    const tw = gs.reduce((w, g) => w + g.adv, 0) / dpr * sc;
    let cx = o.align === 'left' ? x : o.align === 'right' ? x - tw : x - tw / 2;
    for (const g of gs) {
      const w = g.w / dpr * sc, h = g.h / dpr * sc;
      api.img(g, cx - g.pad / dpr * sc + w / 2, y, w, h, WHITE);
      cx += g.adv / dpr * sc;
    }
    return tw;
  };
  api.reset = function () { flush(); atlas.x = atlas.y = atlas.row = 0; atlas.map.clear();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, atlas.size, atlas.size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null); };
  return api;
})();

/* Merge Café Lite · 图标（占位 + 正式图替换）
   占位规则（Codex 终稿前）：咖啡链圆形、烘焙链圆角方形；每级换底色 + 中间大号等级数字 + 顶部等级小点 + 底部名字，
   48px 下靠"形状 + 数字 + 点数"三重区分，不只靠颜色。
   正式图：assets/items/<id>.png 到位并登记进 config/art.json 后，自动换掉同 id 的占位，逻辑代码不用改。 */
const Art = (() => {
  const loaded = {};           // id -> HTMLImageElement（正式图）
  function load(list, base, onReady) {
    for (const id of list) {
      const im = new Image();
      im.onload = () => { loaded[id] = im; GL.forget('I|' + id + '|'); if (onReady) onReady(id); };
      im.onerror = () => console.warn('[art] missing', id);
      im.src = base + id + '.png';
    }
  }
  const FONT = 'Nunito, "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';

  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function shade(hex, k) { // k<0 变暗，k>0 变亮
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = (c) => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
  function fitText(g, str, maxW, px, wt) {
    let p = px; g.font = `${wt} ${p}px ${FONT}`;
    while (p > 6 && g.measureText(str).width > maxW) { p -= 1; g.font = `${wt} ${p}px ${FONT}`; }
    return p;
  }

  /* 物品图标精灵 */
  function item(C, it, size) {
    const def = Core.itemDef(C, it), shape = C.chains[it.chain].shape;
    return GL.sprite('I|' + def.id + '|', size, size, (g, w) => {
      if (loaded[def.id]) { g.drawImage(loaded[def.id], 0, 0, w, w); return; }
      const pad = w * 0.08, s = w - pad * 2, col = def.color;
      // 主体
      g.fillStyle = col; g.strokeStyle = shade(col, -0.45); g.lineWidth = w * 0.045;
      if (shape === 'round') { g.beginPath(); g.arc(w / 2, w / 2, s / 2, 0, Math.PI * 2); }
      else rr(g, pad, pad, s, s, s * 0.22);
      g.fill(); g.stroke();
      // 高光
      g.save(); g.clip();
      g.fillStyle = 'rgba(255,255,255,0.22)'; g.beginPath(); g.ellipse(w * 0.38, w * 0.3, s * 0.36, s * 0.2, -0.5, 0, Math.PI * 2); g.fill();
      g.restore();
      // 等级小点（每级多一个可见元素）
      const dots = it.lvl, dr = w * 0.035, gap = dr * 2.6, y = pad + w * 0.13;
      for (let k = 0; k < dots; k++) {
        const x = w / 2 + (k - (dots - 1) / 2) * gap;
        g.fillStyle = lum(col) > 0.6 ? 'rgba(60,35,20,0.8)' : 'rgba(255,248,235,0.95)';
        g.beginPath(); g.arc(x, y, dr, 0, Math.PI * 2); g.fill();
      }
      // 等级数字
      const light = lum(col) > 0.6;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `900 ${w * 0.42}px ${FONT}`;
      g.lineJoin = 'round'; g.lineWidth = w * 0.06; g.strokeStyle = light ? 'rgba(255,255,255,0.9)' : 'rgba(30,18,10,0.55)';
      g.strokeText(String(it.lvl), w / 2, w * 0.5); g.fillStyle = light ? '#3a2416' : '#fff8ec'; g.fillText(String(it.lvl), w / 2, w * 0.5);
      // 名字
      const name = L.t(def.name);
      const px = fitText(g, name, s * 0.92, w * 0.13, 800);
      g.lineWidth = px * 0.3; g.strokeStyle = light ? 'rgba(255,255,255,0.9)' : 'rgba(30,18,10,0.6)';
      g.strokeText(name, w / 2, w * 0.78); g.fillStyle = light ? '#3a2416' : '#fff8ec'; g.fillText(name, w / 2, w * 0.78);
    });
  }

  /* 生成器图标精灵 */
  function gen(C, id, size) {
    const def = C.gens[id];
    return GL.sprite('I|' + id + '|', size, size, (g, w) => {
      if (loaded[id]) { g.drawImage(loaded[id], 0, 0, w, w); return; }
      const pad = w * 0.06, s = w - pad * 2, col = def.color;
      rr(g, pad, pad, s, s, s * 0.2);
      const grd = g.createLinearGradient(0, pad, 0, pad + s); grd.addColorStop(0, shade(col, 0.15)); grd.addColorStop(1, shade(col, -0.2));
      g.fillStyle = grd; g.fill(); g.lineWidth = w * 0.05; g.strokeStyle = shade(col, -0.5); g.stroke();
      g.fillStyle = '#fff8ec'; g.strokeStyle = shade(col, -0.5); g.lineWidth = w * 0.03;
      if (def.chain === 'coffee') { // 咖啡机：机身 + 出水口 + 杯子
        rr(g, w * 0.26, w * 0.18, w * 0.48, w * 0.2, w * 0.05); g.fill(); g.stroke();
        g.fillRect(w * 0.45, w * 0.38, w * 0.1, w * 0.08);
        g.beginPath(); g.moveTo(w * 0.36, w * 0.5); g.lineTo(w * 0.64, w * 0.5); g.lineTo(w * 0.6, w * 0.68); g.lineTo(w * 0.4, w * 0.68); g.closePath(); g.fill(); g.stroke();
      } else { // 食材箱：木箱横条
        for (let k = 0; k < 3; k++) { rr(g, w * 0.22, w * (0.2 + k * 0.16), w * 0.56, w * 0.12, w * 0.03); g.fill(); g.stroke(); }
      }
    });
  }

  /* 锁 */
  function lock(size) {
    return GL.sprite('lock', size, size, (g, w) => {
      g.fillStyle = 'rgba(255,255,255,0.9)'; g.strokeStyle = 'rgba(255,255,255,0.9)';
      g.lineWidth = w * 0.11; g.beginPath(); g.arc(w / 2, w * 0.42, w * 0.2, Math.PI, 0); g.stroke();
      rr(g, w * 0.24, w * 0.42, w * 0.52, w * 0.4, w * 0.08); g.fill();
    });
  }
  function coin(size) {
    return GL.sprite('coin', size, size, (g, w) => {
      g.fillStyle = '#f2b632'; g.beginPath(); g.arc(w / 2, w / 2, w * 0.46, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#b97a12'; g.lineWidth = w * 0.08; g.stroke();
      g.fillStyle = '#ffe28a'; g.beginPath(); g.arc(w / 2, w / 2, w * 0.22, 0, Math.PI * 2); g.fill();
    });
  }

  /* 顾客头像占位：圆底 + 肩膀 + 脸 + 发型（id 与正式图 avatar_customer_XX 一致，到图自动替换） */
  function avatar(C, k, size) {
    const cu = C.O.customers[k % C.O.customers.length];
    return GL.sprite('I|' + cu.id + '|', size, size, (g, w) => {
      if (loaded[cu.id]) { g.drawImage(loaded[cu.id], 0, 0, w, w); return; }
      rr(g, 0, 0, w, w, w * 0.18); g.fillStyle = '#cfe9e6'; g.fill(); g.save(); g.clip();
      g.fillStyle = cu.color; g.beginPath(); g.ellipse(w / 2, w * 1.02, w * 0.42, w * 0.3, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#e9b98f'; g.fillRect(w * 0.44, w * 0.6, w * 0.12, w * 0.14);
      g.fillStyle = cu.hair; g.beginPath(); g.ellipse(w / 2, w * 0.43, w * 0.25, w * 0.27, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#f1c9a0'; g.beginPath(); g.ellipse(w / 2, w * 0.48, w * 0.19, w * 0.22, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = cu.hair; g.beginPath(); g.ellipse(w / 2, w * 0.3, w * 0.22, w * 0.1, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3a2416'; for (const dx of [-0.07, 0.07]) { g.beginPath(); g.arc(w * (0.5 + dx), w * 0.47, w * 0.018, 0, Math.PI * 2); g.fill(); }
      g.strokeStyle = '#a8553f'; g.lineWidth = w * 0.02; g.beginPath(); g.arc(w / 2, w * 0.53, w * 0.06, 0.2, Math.PI - 0.2); g.stroke();
      g.restore();
    });
  }
  function star(size) {
    return GL.sprite('star', size, size, (g, w) => {
      g.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = (k % 2 ? 0.2 : 0.46) * w; g.lineTo(w / 2 + Math.cos(a) * r, w * 0.53 + Math.sin(a) * r); }
      g.closePath(); g.fillStyle = '#f5c03a'; g.fill(); g.lineJoin = 'round'; g.lineWidth = w * 0.07; g.strokeStyle = '#c4851a'; g.stroke();
    });
  }
  function clock(size) {
    return GL.sprite('clock', size, size, (g, w) => {
      g.strokeStyle = '#3a2416'; g.lineWidth = w * 0.12; g.beginPath(); g.arc(w / 2, w / 2, w * 0.38, 0, Math.PI * 2); g.stroke();
      g.lineCap = 'round'; g.beginPath(); g.moveTo(w / 2, w / 2); g.lineTo(w / 2, w * 0.28); g.moveTo(w / 2, w / 2); g.lineTo(w * 0.66, w * 0.58); g.stroke();
    });
  }
  function check(size) {
    return GL.sprite('check', size, size, (g, w) => {
      g.fillStyle = '#3bb36a'; g.beginPath(); g.arc(w / 2, w / 2, w * 0.46, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = w * 0.14; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(w * 0.28, w * 0.52); g.lineTo(w * 0.44, w * 0.68); g.lineTo(w * 0.72, w * 0.36); g.stroke();
    });
  }
  function bolt(size) {
    return GL.sprite('bolt', size, size, (g, w) => {
      g.beginPath(); g.moveTo(w * 0.58, w * 0.06); g.lineTo(w * 0.2, w * 0.56); g.lineTo(w * 0.46, w * 0.56); g.lineTo(w * 0.38, w * 0.94); g.lineTo(w * 0.8, w * 0.4); g.lineTo(w * 0.53, w * 0.4); g.closePath();
      g.fillStyle = '#f5c03a'; g.fill(); g.lineJoin = 'round'; g.lineWidth = w * 0.07; g.strokeStyle = '#c4851a'; g.stroke();
    });
  }
  function hand(size) {
    return GL.sprite('hand', size, size, (g, w) => {
      g.fillStyle = '#fff'; g.strokeStyle = '#3a2416'; g.lineWidth = w * 0.06; g.lineJoin = 'round';
      g.beginPath(); rr(g, w * 0.36, w * 0.08, w * 0.16, w * 0.5, w * 0.08); g.fill(); g.stroke();
      g.beginPath(); rr(g, w * 0.3, w * 0.42, w * 0.46, w * 0.46, w * 0.16); g.fill(); g.stroke();
    });
  }
  return { load, item, gen, lock, coin, avatar, star, clock, check, bolt, hand, FONT };
})();

/* Merge Café Lite · 广告层（当前全部 Mock）
   对外两个入口，返回 Promise：
     Ads.rewarded(kind) → true=看完发奖 / false=没看完
     Ads.interstitial() → 播完 resolve
   Mock：全屏遮罩倒计时 CONFIG.ads.mockSec / interstitialMockSec 秒，自动视为看完。
   接 SDK 时只改这个文件，玩法代码不动：
     TODO(SDK) CrazyGames：window.CrazyGames.SDK.ad.requestAd('rewarded' | 'midgame', { adFinished, adError, adStarted })
     TODO(SDK) Playgama：bridge.advertisement.showRewarded() / showInterstitial()，监听 rewardedStateChanged / interstitialStateChanged
     接入后 adStarted 时要暂停游戏音频和计时、adFinished / adError 时恢复。 */
const Ads = (() => {
  let busy = false;
  const FAST = /[?&]fastads\b/.test(location.search); // QA / 自动化测试：Mock 广告 1 秒播完
  const secs = (n) => (FAST ? 1 : n);
  function mock(sec, label) {
    return new Promise((resolve) => {
      const box = document.getElementById('ad'), txt = document.getElementById('ad-count');
      document.getElementById('ad-label').textContent = label;
      box.classList.add('show');
      let n = sec;
      const tick = () => {
        txt.textContent = L.t('ad.playing', { n });
        if (n-- <= 0) { box.classList.remove('show'); resolve(true); return; }
        setTimeout(tick, 1000);
      };
      tick();
    });
  }
  async function rewarded(kind) {
    if (busy) return false;
    busy = true;
    try { return await mock(secs(CONFIG.ads.mockSec), L.t('ad.label')); } // TODO(SDK)：换成门户激励视频
    finally { busy = false; }
  }
  async function interstitial() {
    if (busy) return;
    busy = true;
    try { await mock(secs(CONFIG.ads.interstitialMockSec), L.t('ad.label')); } // TODO(SDK)：换成门户插屏（midgame）
    finally { busy = false; }
  }
  return { rewarded, interstitial, get busy() { return busy; } };
})();

/* Merge Café Lite · 主循环：布局、绘制、输入、HUD、订单、新手引导、存档
   场景 / 订单卡 / 棋盘 / 生成器按钮全部用 GL（原生 WebGL）画；顶栏、底部导航、弹窗、提示、引导气泡是 DOM。
   布局按 #38 效果图：竖屏 顶栏 → 场景+Logo → 3 张订单卡 → 棋盘 → 生成器 → 底栏；横屏 左场景+底栏 / 中棋盘 / 右订单+生成器。 */
(() => {
  'use strict';
  const C = Core.index(CONFIG);
  const $ = (id) => document.getElementById(id);
  const SAVE_KEY = 'merge-cafe-lite.save';
  const params = new URLSearchParams(location.search);
  const DEBUG = params.has('debug');

  /* ---------- 时间（调试面板可快进，用来测离线恢复 / 冷却 / 订单超时） ---------- */
  let timeOffset = 0;
  try { timeOffset = +sessionStorage.getItem('mcl.timeOffset') || 0; } catch (e) {}
  const now = () => Date.now() + timeOffset;
  const clock = () => performance.now() / 1000;

  /* ---------- 存档 ---------- */
  function store() { try { return window.localStorage; } catch (e) { return null; } }
  if (params.has('reset')) { // 清档后把 ?reset 从地址栏去掉，免得 QA 刷新时又清一次
    const ls = store(); if (ls) ls.removeItem(SAVE_KEY);
    try { sessionStorage.removeItem('mcl.timeOffset'); } catch (e) {} timeOffset = 0;
    params.delete('reset'); const q = params.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash); } catch (e) {}
  }
  let S = null, welcomeGain = 0;
  { const ls = store(), raw = ls && ls.getItem(SAVE_KEY); if (raw) S = Core.deserialize(C, raw, now()); }
  if (S) welcomeGain = Core.settleAll(C, S, now());
  else S = Core.newState(C, now());
  let dirty = true, saveTimer = 0;
  function save() { const ls = store(); if (!ls) return; try { ls.setItem(SAVE_KEY, Core.serialize(S, now())); dirty = false; } catch (e) {} }
  const markDirty = () => { dirty = true; };
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
    else { const g = Core.settleAll(C, S, now()); if (g > 0) toast(L.t('ui.welcomeBack', { n: g })); }
  });

  /* ---------- WebGL ---------- */
  const cv = $('cv');
  L.apply();
  if (!GL.init(cv)) { $('err').textContent = L.t('ui.webglError'); $('err').style.display = 'flex'; return; }
  document.title = L.t('game.title');

  /* ---------- 布局 ---------- */
  let mode = 'merge'; // 'merge' 棋盘 / 'cafe' 装修
  const LY = { W: 0, H: 0, portrait: true, bx: 0, by: 0, bs: 0, cs: 0, pad: 0, scene: null, orders: [], gens: [], hud: null };
  const gap = 8;
  function layout() {
    const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1); // 手机 3x 屏也按 2x 画，省填充率
    GL.resize(W, H, dpr);
    LY.W = W; LY.H = H; LY.portrait = H >= W * 1.05;
    const cs = getComputedStyle(document.documentElement);
    const safeT = parseFloat(cs.getPropertyValue('--sat')) || 0, safeB = parseFloat(cs.getPropertyValue('--sab')) || 0;
    const hudH = 54 + safeT, navH = 60;
    if (LY.portrait) {
      const cw = Math.min(W - 16, 620), cx = (W - cw) / 2;
      const gensH = Math.round(Math.min(84, Math.max(56, cw * 0.15)));
      const ordersH = Math.round(Math.min(150, Math.max(100, cw * 0.27)));
      const fixed = hudH + ordersH + gensH + navH + safeB + gap * 5;
      const sceneMin = Math.max(56, H * 0.1);
      const bs = Math.floor(Math.min(cw - 10, H - fixed - sceneMin));
      const sceneH = H - fixed - bs; // 场景吃掉剩余高度
      let y = hudH + sceneH;
      LY.scene = { x: 0, y: 0, w: W, h: y };
      const ow = (cw - gap * 2) / 3;
      LY.orders = [0, 1, 2].map((k) => ({ x: cx + k * (ow + gap), y: y + gap, w: ow, h: ordersH }));
      y += gap + ordersH + gap;
      LY.bs = bs; LY.bx = Math.round((W - bs) / 2); LY.by = Math.round(y);
      y += bs + gap;
      const gw = (cw - gap) / 2;
      LY.gens = C.genList.map((g, k) => ({ id: g.id, x: cx + k * (gw + gap), y, w: gw, h: gensH }));
      y += gensH + gap;
      placeNav(cx, H - navH - safeB - 4, cw, navH);
      placeHud(0, safeT + 8, W);
    } else {
      const rw = Math.round(Math.min(380, Math.max(220, W * 0.26)));
      const bs = Math.floor(Math.min(H - hudH - gap * 2, W * 0.46, W - rw - 140 - gap * 4));
      const lw = W - bs - rw - gap * 4;
      LY.bs = bs; LY.bx = Math.round(gap * 2 + lw); LY.by = Math.round(hudH + (H - hudH - gap - bs) / 2);
      LY.scene = { x: 0, y: 0, w: LY.bx - gap, h: H };
      placeNav(gap, H - navH - gap - safeB, lw - gap, navH);
      placeHud(LY.bx, safeT + 8, bs + gap + rw);
      const rx = LY.bx + bs + gap * 2, gensH = Math.round(Math.min(76, Math.max(56, bs * 0.15)));
      const oh = (bs - gensH - gap * 3) / 3;
      LY.orders = [0, 1, 2].map((k) => ({ x: rx, y: LY.by + k * (oh + gap), w: rw - gap, h: oh }));
      const gw = (rw - gap * 2) / 2;
      LY.gens = C.genList.map((g, k) => ({ id: g.id, x: rx + k * (gw + gap), y: LY.by + bs - gensH, w: gw, h: gensH }));
    }
    LY.pad = Math.round(LY.bs * 0.022);
    LY.cs = (LY.bs - LY.pad * 2) / C.cols;
    if (mode === 'cafe') { // 装修：场景铺满，下面是装修面板 + 底栏
      const cw = Math.min(W - 16, 620), cx = (W - cw) / 2;
      placeNav(cx, H - navH - safeB - 4, cw, navH);
      placeHud(0, safeT + 8, W);
      const ds = $('deco').style; ds.left = cx + 'px'; ds.width = cw + 'px'; ds.bottom = (navH + safeB + 4 + gap * 1.5) + 'px';
      const ph = $('deco').getBoundingClientRect().height || 200;
      LY.cafeScene = { x: 0, y: 0, w: W, h: Math.max(160, H - navH - safeB - ph - gap * 3) };
    }
    const pc = $('pill-coins').getBoundingClientRect(), ps = $('pill-stars').getBoundingClientRect();
    LY.coinTarget = [pc.left + 18, pc.top + pc.height / 2]; LY.starTarget = [ps.left + 18, ps.top + ps.height / 2];
  }
  function placeNav(x, y, w, h) { const s = $('nav').style; s.left = x + 'px'; s.top = y + 'px'; s.width = w + 'px'; s.height = h + 'px'; }
  function placeHud(x, y, w) { const s = $('hud').style; s.left = x + 'px'; s.top = y + 'px'; s.width = w + 'px'; }
  document.documentElement.style.setProperty('--sat', 'env(safe-area-inset-top)');
  addEventListener('resize', layout);
  layout();

  const cellXY = (i) => { const [r, c] = Core.rc(C, i); return [LY.bx + LY.pad + (c + 0.5) * LY.cs, LY.by + LY.pad + (r + 0.5) * LY.cs]; };
  function cellAt(x, y) {
    const c = Math.floor((x - LY.bx - LY.pad) / LY.cs), r = Math.floor((y - LY.by - LY.pad) / LY.cs);
    return r >= 0 && r < C.rows && c >= 0 && c < C.cols ? Core.idx(C, r, c) : -1;
  }
  const inRect = (x, y, R) => x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h;
  const orderAt = (x, y) => LY.orders.findIndex((R) => inRect(x, y, R));
  const genAt = (x, y) => { const g = LY.gens.find((R) => inRect(x, y, R)); return g ? g.id : null; };
  const genRect = (id) => LY.gens.find((g) => g.id === id);

  /* ---------- 动画 ---------- */
  const pops = new Map(), shakes = new Map(), cardPops = new Map(), genPress = new Map();
  const flies = [], parts = [], coinsFly = [];
  let pendingCoins = 0, pendingStars = 0;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  function popScale(t) {
    if (t >= 0.42 || t < 0) return 1;
    const k = t / 0.42; return 1 + 0.35 * Math.exp(-5 * k) * Math.cos(k * Math.PI * 2.2) * (1 - k);
  }
  function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1]; }
  function burst(x, y, color, n) {
    const rgb = hex(color);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = LY.cs * (1.6 + Math.random() * 2.2);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - LY.cs, life: 0, max: 0.45 + Math.random() * 0.3,
        r: LY.cs * (0.05 + Math.random() * 0.06), col: Math.random() < 0.4 ? [1, 0.95, 0.8, 1] : rgb });
    }
  }
  /* 金币 / 星星飞进顶栏：飞到了才加到顶栏数字上 */
  function flyRewards(x, y, coins, stars) {
    const nC = Math.min(10, Math.max(4, Math.round(coins / 10)));
    pendingCoins += coins; pendingStars += stars;
    for (let k = 0; k < nC; k++) coinsFly.push({ kind: 'coin', x0: x + (Math.random() - 0.5) * 40, y0: y + (Math.random() - 0.5) * 20, t0: clock() + k * 0.06, dur: 0.6, val: k === nC - 1 ? coins - Math.floor(coins / nC) * (nC - 1) : Math.floor(coins / nC) });
    for (let k = 0; k < stars; k++) coinsFly.push({ kind: 'star', x0: x, y0: y, t0: clock() + 0.25 + k * 0.1, dur: 0.75, val: 1 });
  }
  const flyingTo = (i) => flies.some((f) => f.cell === i);

  /* ---------- 提示 / 弹窗 ---------- */
  let toastT = 0;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg;
    el.style.top = (LY.portrait ? LY.by - 50 : LY.by + 8) + 'px';
    el.style.left = (LY.bx + LY.bs / 2) + 'px';
    el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
  }
  let modalOnClose = null, energyModalTick = null;
  function modal(title, body, buttons, comic) {
    $('m-title').textContent = title; $('m-body').textContent = body;
    $('m-comic').style.display = comic ? 'block' : 'none';
    if (comic) $('m-comic').innerHTML = comicSVG(comic);
    const box = $('m-btns'); box.textContent = '';
    for (const b of buttons) {
      const el = document.createElement('button'); el.className = 'btn' + (b.alt ? ' alt' : ''); el.textContent = b.label;
      if (b.ad) el.classList.add('ad');
      el.onclick = () => { closeModal(); if (b.on) b.on(); }; box.appendChild(el);
    }
    $('modal').classList.add('show');
  }
  function closeModal() { $('modal').classList.remove('show'); if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); } }
  const modalOpen = () => $('modal').classList.contains('show');
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  let hudCache = '';
  function updateHud() {
    Core.settleEnergy(C, S, now());
    const E = C.eco.energy, nx = Core.energyNextIn(C, S, now());
    const key = [S.energy, S.coins - pendingCoins, S.stars - pendingStars, S.energy < E.max ? mmss(nx) : ''].join('|');
    if (key === hudCache) return; hudCache = key;
    $('energy').textContent = S.energy; $('coins').textContent = (S.coins - pendingCoins).toLocaleString('en-US'); $('stars').textContent = S.stars - pendingStars;
    $('energy-timer').textContent = S.energy < E.max ? mmss(nx) : '';
    if (energyModalTick) energyModalTick();
  }
  function bump(id) { const el = $(id); el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 120); }

  /* ---------- 新手引导 ---------- */
  let tipKey = '';
  function updateTutorial() {
    const step = Core.tutStep(C, S);
    document.body.classList.toggle('tut', !!step);
    const key = step ? 'tut.' + step : '';
    const tip = $('tip');
    if (key !== tipKey) {
      tipKey = key;
      if (key) { tip.textContent = L.t(key); tip.classList.remove('show'); void tip.offsetWidth; tip.classList.add('show'); }
      else tip.classList.remove('show');
    }
    if (key) { // 竖屏：贴在棋盘下沿（盖住的是锁着的下 3 行，不挡要点的东西）；横屏：放在左侧场景栏
      const sc = LY.scene, mw = LY.portrait ? Math.min(LY.bs - 16, 360) : Math.max(160, sc.w - 24);
      tip.style.maxWidth = mw + 'px';
      tip.style.left = (LY.portrait ? LY.W / 2 : sc.x + sc.w / 2) + 'px';
      tip.style.top = (LY.portrait ? LY.by + LY.bs - LY.pad - 6 : LY.by + LY.bs * 0.5) + 'px';
    }
  }
  /* 当前引导步骤要高亮的东西：{gen, cells:[], order} */
  function tutFocus() {
    const step = Core.tutStep(C, S); if (!step) return null;
    if (step === 'tapGen') return { step, gen: C.tut.generator };
    const lv = C.tut.spawnLevel, ids = [];
    S.cells.forEach((c, i) => { if (c && c.chain === C.gens[C.tut.generator].chain && c.lvl === lv) ids.push(i); });
    if (step === 'merge') return { step, cells: ids.slice(0, 2) };
    const ready = S.cells.findIndex((c) => Core.orderNeedFor(C, S.orders[0], c) >= 0);
    return { step, cells: ready >= 0 ? [ready] : [], order: 0 };
  }

  /* ---------- 玩法动作 ---------- */
  function tapGenerator(id) {
    const r = Core.tapGen(C, S, id, now());
    genPress.set(id, clock());
    if (r.ok) {
      const R = genRect(id);
      flies.push({ cell: r.to, item: r.item, x0: R.x + R.h * 0.55, y0: R.y + R.h / 2, t0: clock(), dur: 0.32, spawn: true });
      markDirty(); return;
    }
    shakes.set('g' + id, clock());
    if (r.reason === 'full') toast(L.t('ui.full'));
    else if (r.reason === 'cooldown') showRefill(id);
    else if (r.reason === 'energy') showNoEnergy();
  }
  /* 激励视频：offer 计展示、click 计点击（策划案 §11 主动点击率 ≥40% 的数据口径） */
  async function watchAd(kind, grant) {
    Core.adClick(S, kind); markDirty();
    const ok = await Ads.rewarded(kind);
    if (ok) { grant(); markDirty(); save(); hudCache = ''; updateHud(); }
  }
  function showNoEnergy() { // 激励视频点位 1：+30 体力
    const body = () => L.t('ui.noEnergyBody', { t: mmss(Core.energyNextIn(C, S, now())) });
    Core.adOffer(S, 'energy'); markDirty();
    modal(L.t('ui.noEnergyTitle'), body(), [
      { label: L.t('ui.ok'), alt: true },
      { label: '▶ ' + L.t('ad.energy', { n: C.ads.rewarded.energy.amount }), ad: true, on: () => watchAd('energy', () => {
        const n = Core.grantEnergy(C, S, now()); bump('pill-energy'); toast('+' + n + ' ⚡');
      }) },
    ]);
    energyModalTick = () => { $('m-body').textContent = body(); };
    modalOnClose = () => { energyModalTick = null; };
  }
  function showRefill(id) { // 激励视频点位 2：生成器立即回满
    const g = S.gens[id], body = () => L.t('ui.genEmptyBody', { t: mmss(g.cdEnd - now()) });
    Core.adOffer(S, 'refill'); markDirty();
    modal(L.t('ui.genEmptyTitle'), body(), [
      { label: L.t('ui.ok'), alt: true },
      { label: '▶ ' + L.t('ad.refill'), ad: true, on: () => watchAd('refill', () => { Core.refillGen(C, S, id); genPress.set(id, clock()); const R = genRect(id); burst(R.x + R.h / 2, R.y + R.h / 2, '#f5c03a', 14); }) },
    ]);
    energyModalTick = () => { if (g.charges > 0) closeModal(); else $('m-body').textContent = body(); };
    modalOnClose = () => { energyModalTick = null; };
  }
  /* 激励视频点位 3：订单完成后顶栏金币旁出现"翻倍"按钮，几秒后消失（不打断操作） */
  let x2Timer = 0, x2Coins = 0;
  function offerDouble(coins) {
    x2Coins = coins; Core.adOffer(S, 'double'); markDirty();
    const el = $('x2'); el.querySelector('span').textContent = L.t('ad.double') + ' +' + coins;
    const pc = $('pill-coins').getBoundingClientRect();
    el.style.left = (pc.left + pc.width / 2) + 'px'; el.style.top = (pc.bottom + 6) + 'px';
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(x2Timer); x2Timer = setTimeout(() => el.classList.remove('show'), C.ads.rewarded.double.offerSec * 1000);
  }
  $('x2').onclick = () => {
    $('x2').classList.remove('show'); clearTimeout(x2Timer);
    const coins = x2Coins;
    watchAd('double', () => {
      Core.grantDouble(S, coins); pendingCoins += coins;
      const n = 6, each = Math.floor(coins / n);
      for (let k = 0; k < n; k++) coinsFly.push({ kind: 'coin', x0: LY.W / 2 + (Math.random() - 0.5) * 60, y0: LY.H / 2, t0: clock() + k * 0.06, dur: 0.6, val: k === n - 1 ? coins - each * (n - 1) : each });
      toast(L.t('ad.got', { n: coins }));
    });
  };
  /* 插屏：每 N 单一次，排队到"没在拖、没弹窗、没在引导、不在播别的广告"时才放 */
  let interQueued = false;
  function tryInterstitial() {
    if (!interQueued || down || drag || modalOpen() || Ads.busy || Core.tutStep(C, S) || flies.length) return;
    interQueued = false; S.ads.interstitials++; markDirty();
    Ads.interstitial();
  }
  function tapLocked(i) {
    if (Core.tutStep(C, S)) { shakes.set(i, clock()); return; }
    if (!Core.canUnlockHere(C, S, i)) { shakes.set(i, clock()); toast(L.t('ui.notAdjacent')); return; }
    const p = Core.unlockPrice(C, i);
    modal(L.t('ui.unlockTitle'), L.t('ui.unlockBody', { n: p }), [
      { label: L.t('ui.cancel'), alt: true },
      { label: L.t('ui.unlock'), on: () => {
        const r = Core.unlock(C, S, i);
        if (r.ok) { pops.set(i, clock()); const [x, y] = cellXY(i); burst(x, y, '#f5c03a', 14); markDirty(); hudCache = ''; }
        else if (r.reason === 'coins') { shakes.set(i, clock()); toast(L.t('ui.noCoins')); }
      } },
    ]);
  }
  function deliverTo(from, k, px, py) {
    const it = S.cells[from], R = LY.orders[k];
    const r = Core.deliver(C, S, from, k, now());
    if (r.type === 'reject') return false;
    // 物品飞进订单卡
    flies.push({ cell: -1, item: it, x0: px, y0: py, x1: R.x + R.w * 0.62, y1: R.y + R.h * 0.35, t0: clock(), dur: 0.22, shrink: true });
    if (r.type === 'complete') {
      cardPops.set(k, clock() + 0.2);
      flyRewards(R.x + R.w / 2, R.y + R.h / 2, r.coins, r.stars + r.bonusStar);
      toast(r.bonusStar ? L.t('ui.starBonus') : L.t('ui.orderDone'));
      if (!Core.tutStep(C, S) && S.stats.ordersDone > 1) offerDouble(r.coins);
      if (r.interstitial) interQueued = true;
    } else cardPops.set(k, clock());
    markDirty();
    return true;
  }

  /* ---------- 输入：按下 →（移动超过阈值）拖拽 / 抬起 = 点击 ---------- */
  let down = null, drag = null, sel = -1, selT = 0;
  const DRAG_PX = 8;
  cv.addEventListener('pointerdown', (e) => {
    if (modalOpen() || down || mode !== 'merge' || Ads.busy) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    down = { id: e.pointerId, x: e.clientX, y: e.clientY, cell: cellAt(e.clientX, e.clientY), gen: genAt(e.clientX, e.clientY) };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down || e.pointerId !== down.id) return;
    if (!drag) {
      const i = down.cell;
      if (i < 0 || !S.unlocked[i] || !S.cells[i] || flyingTo(i)) return;
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < DRAG_PX) return;
      const [cx, cy] = cellXY(i);
      drag = { from: i, ox: down.x - cx, oy: down.y - cy, x: e.clientX, y: e.clientY };
      sel = i;
    }
    drag.x = e.clientX; drag.y = e.clientY;
  });
  function release(e, cancelled) {
    if (!down || e.pointerId !== down.id) return;
    const d = down; down = null;
    if (drag) {
      const g = drag; drag = null;
      const px = g.x - g.ox, py = g.y - g.oy;
      const moving = S.cells[g.from];
      // 先看是不是拖进订单卡（用手指位置判断，跟手）
      const k = cancelled ? -1 : orderAt(g.x, g.y);
      if (k >= 0) {
        if (deliverTo(g.from, k, px, py)) { sel = -1; return; }
        cardPops.set(k, -1); shakes.set('o' + k, clock());
        if (!Core.tutStep(C, S)) toast(L.t('ui.wrongOrder'));
        flies.push({ cell: g.from, item: moving, x0: px, y0: py, t0: clock(), dur: 0.22 });
        return;
      }
      const to = cancelled ? -1 : cellAt(px, py);
      for (let j = flies.length - 1; j >= 0; j--) if (flies[j].cell === to) flies.splice(j, 1); // 目标格还在飞：直接落地
      const r = Core.drop(C, S, g.from, to, now());
      if (r.type === 'merge') {
        pops.set(to, clock()); sel = to; selT = clock();

    btn('energy 0', () => { S.energy = 0; S.energyTs = now(); });
    btn('+100 coins', () => { S.coins += 100; });
    btn('+5 stars', () => { S.stars += 5; decoKey = ''; });
    btn('skip tutorial', () => Core.skipTutorial(S));
    btn('fill board', () => { for (let i = 0; i < C.n; i++) if (S.unlocked[i] && !S.cells[i]) S.cells[i] = { k: 'item', chain: i % 2 ? 'coffee' : 'bake', lvl: 1 + (i % 7) }; });
    btn('serve-ready', () => { // 把三个订单要的东西都放到棋盘上
      for (const o of S.orders) for (const n of o.needs) if (!n.done) { const e = S.cells.findIndex((c, i) => !c && S.unlocked[i]); if (e >= 0) S.cells[e] = { k: 'item', chain: n.chain, lvl: n.lvl }; }
    });
    btn('reset', () => { const ls = store(); if (ls) ls.removeItem(SAVE_KEY); try { sessionStorage.removeItem('mcl.timeOffset'); } catch (e) {} timeOffset = 0; S = Core.newState(C, now()); sel = -1; pendingCoins = pendingStars = 0; decoKey = ''; });
  }
  // 自动化测试 / 调试入口
  window.MCL = {
    C, get S() { return S; }, cellXY, cellAt, layout: LY, save, now, genRect, orderRect: (k) => LY.orders[k], get mode() { return mode; },
    get fps() { return fps; }, get renderMs() { return renderMs; }, get pending() { return pendingCoins + pendingStars; },
  };
})();

</script>

</body>
