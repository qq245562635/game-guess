:root {
  --teal: #48b8af; --teal-d: #23807a; --cream: #fff4db; --coral: #ef7965; --coral-d: #c4553c;
  --wood: #c99a62; --wood-d: #8a5a32; --ink: #3a2416; --gold: #f5c03a;
  --font: Nunito, "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: #e6c48f; color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* 顶栏：体力 / 金币 / 星星 */
#hud { position: fixed; z-index: 2; display: flex; gap: 10px; justify-content: center; pointer-events: none; }
.pill { pointer-events: auto; position: relative; display: flex; align-items: center; gap: 6px; min-width: 84px; height: 38px; padding: 0 14px 0 4px;
  background: var(--cream); border: 3px solid #e9d2a6; border-radius: 22px; box-shadow: 0 3px 0 rgba(120,80,40,.35);
  font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; box-sizing: border-box; transition: transform .12s; }
.pill.bump { transform: scale(1.12); }
.pill svg, .pill img.ico { width: 30px; height: 30px; flex: none; margin-left: -10px; filter: drop-shadow(0 2px 0 rgba(120,80,40,.3)); object-fit: contain; }
.pill .sub { font-size: 12px; font-weight: 800; opacity: .65; }
#energy-timer:empty { display: none; }
/* 店铺等级徽章（V1 M1）：圆形徽章 + 外圈经验环（conic-gradient），点开看等级详情；正式图 badge_level 到了换背景 */
#lvl { pointer-events: auto; position: relative; flex: none; width: 44px; height: 44px; margin: -3px 2px 0 0; border-radius: 50%; cursor: pointer;
  background: conic-gradient(#3bb36a calc(var(--xp, 0) * 1turn), #e3cfa8 0); box-shadow: 0 3px 0 rgba(120,80,40,.35); transition: transform .12s; }
#lvl::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #48b8af; border: 2px solid #f5c03a; box-sizing: border-box; }
#lvl b { position: absolute; inset: 9px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--cream);
  font: 900 15px/1 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }
#lvl.art::before { background: center / contain no-repeat var(--badge); border: 0; inset: 2px; }
#lvl.art b { background: none; }
#lvl.bump { transform: scale(1.18); }
/* 升级庆典弹窗里的大徽章和奖励条 */
.lvup { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
.lvup .big { position: relative; width: 112px; height: 112px; border-radius: 50%; background: #48b8af; border: 5px solid #f5c03a; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; animation: lvspin .7s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 0 0 8px rgba(245,192,58,.25); }
.lvup .big.art { background: center / contain no-repeat var(--badge); border: 0; box-shadow: none; }
.lvup .big b { width: 70px; height: 70px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; font: 900 38px/1 var(--font); color: var(--ink); }
.lvup .big.art b { background: none; }
@keyframes lvspin { from { transform: scale(.3) rotate(-200deg); opacity: 0; } }
.rw-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rw-row span { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 14px; background: #f6e7c6; font: 900 16px var(--font); }
.rw-row img, .rw-row svg { width: 22px; height: 22px; }
.xp-line { width: 100%; height: 12px; border-radius: 6px; background: #e3cfa8; overflow: hidden; margin: 2px 0 12px; }
.xp-line i { display: block; height: 100%; background: linear-gradient(#7fd0a0, #3bb36a); border-radius: 6px; }

/* 底部导航（Tasks 不在 #39 范围，只做 Café / Merge） */
#nav { position: fixed; z-index: 2; display: flex; gap: 10px; }
.navb { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid #e9d2a6; border-radius: 18px;
  background: var(--cream); color: var(--teal-d); font: 900 20px var(--font); box-shadow: 0 4px 0 rgba(120,80,40,.35); cursor: pointer; padding: 0 10px; }
.navb svg, .navb img.ico { width: 34px; height: 34px; flex: none; object-fit: contain; }
.navb { min-width: 0; overflow: hidden; }
#nav.compact .navb { flex-direction: column; gap: 0; font-size: 13px; padding: 2px 4px; }
#nav.compact .navb svg, #nav.compact .navb img.ico { width: 26px; height: 26px; }
.navb.on { background: var(--coral); border-color: #f6a08f; color: #fff; box-shadow: 0 4px 0 var(--coral-d); }
.navb:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(120,80,40,.35); }
body.tut #nav { opacity: .45; pointer-events: none; }

/* 新手引导气泡 */
#tip { position: fixed; z-index: 4; display: none; box-sizing: border-box; width: max-content; padding: 12px 16px; border-radius: 16px; background: var(--cream);
  border: 3px solid var(--teal-d); box-shadow: 0 4px 0 rgba(30,70,70,.4); font: 800 17px/1.3 var(--font); text-align: center; transform: translate(-50%, -100%);
  animation: tipIn .3s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
#tip.show { display: block; }
@keyframes tipIn { from { transform: translate(-50%, -100%) scale(.8); opacity: 0; } }

/* 提示 */
#toast { position: fixed; z-index: 5; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .2s, transform .2s;
  max-width: min(86vw, 420px); padding: 10px 16px; border-radius: 14px; background: rgba(58,36,22,.92); color: #fff8ec;
  font-weight: 800; font-size: 16px; text-align: center; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 弹窗 */
#modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(20,40,45,.45); }
#modal.show { display: flex; }
.card { width: min(86vw, 340px); background: var(--cream); border: 4px solid var(--wood-d); border-radius: 22px; box-shadow: 0 6px 0 rgba(60,35,20,.4);

.btn { appearance: none; border: 3px solid var(--coral-d); background: var(--coral); color: #fff; font: 900 18px var(--font);

/* 装修面板（Café 模式） */
#deco { position: fixed; z-index: 3; display: none; box-sizing: border-box; padding: 12px 14px 14px; background: var(--cream);
  border: 3px solid #e9d2a6; border-radius: 20px; box-shadow: 0 5px 0 rgba(120,80,40,.35); }

/* 任务面板 */
#tasks { position: fixed; z-index: 3; display: none; box-sizing: border-box; padding: 12px 14px 14px; background: var(--cream);
  border: 3px solid #e9d2a6; border-radius: 20px; box-shadow: 0 5px 0 rgba(120,80,40,.35); }
body.tasks #tasks { display: block; }
#tasks h3 { margin: 0 0 8px; font-size: 19px; font-weight: 900; color: var(--teal-d); }
.task { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px; border-radius: 12px; background: #f6e7c6; }
.task.ready { background: #fff; outline: 3px solid var(--gold); }
.t-txt { flex: 1; min-width: 0; } .t-txt b { display: block; font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.t-bar { position: relative; height: 14px; border-radius: 7px; background: #e3cfa8; overflow: hidden; }
.t-bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#7fd0c6, #48b8af); border-radius: 7px; }
.t-bar span { position: relative; display: block; text-align: center; font: 900 10px/14px var(--font); color: #2a4b4a; }
.t-rw { display: flex; flex-direction: column; gap: 2px; font: 900 13px var(--font); }
.t-rw span { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.t-rw img { width: 18px; height: 18px; }
.btn.small { min-width: 0; padding: 6px 12px; font-size: 15px; }
.btn:disabled { filter: grayscale(.8); opacity: .5; box-shadow: none; }

.deco-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
#deco-act { font-size: 19px; font-weight: 900; color: var(--teal-d); }

#deco-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 10px; }
.chip { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 10px; background: #f6e7c6;
  font-size: 13px; font-weight: 800; }
.chip b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip span { flex: none; color: #c4851a; font-weight: 900; }
.chip.done { background: #d9f1e2; } .chip.done span { color: #2e9a5a; }
.chip.next { background: #fff; outline: 3px solid var(--gold); }
.chip.todo { opacity: .55; }
#deco-btn { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; padding-left: 10px; padding-right: 10px; }
.cm { display: inline-block; width: .9em; height: .9em; margin: 0 2px -1px 0; border-radius: 50%; background: #f2b632; box-shadow: inset 0 0 0 2px #b97a12; }
/* 出售按钮（选中物品时出现在它下方）、静音按钮 */
#sell { position: fixed; z-index: 3; display: none; transform: translateX(-50%); border: 3px solid #b97a12; border-radius: 14px; padding: 4px 10px;
  background: linear-gradient(#ffd866, #f2b632); color: #5a3a12; font: 900 14px var(--font); box-shadow: 0 3px 0 #b97a12; cursor: pointer; white-space: nowrap; }
#sell.show { display: block; animation: x2 .25s cubic-bezier(.2,1.6,.4,1); }
#snd { position: fixed; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #e9d2a6; background: var(--cream); box-shadow: 0 3px 0 rgba(120,80,40,.35);
  font: 16px/1 sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
body.cafe #snd, body.tasks #snd, body.book #snd { display: none; }
/* Book（图鉴 + 熟客，V1 M3） */
#book { position: fixed; z-index: 3; display: none; box-sizing: border-box; padding: 10px 12px 12px; background: var(--cream);
  border: 3px solid #e9d2a6; border-radius: 20px; box-shadow: 0 5px 0 rgba(120,80,40,.35); overflow-y: auto; }
body.book #book { display: block; }
.btabs { display: flex; gap: 6px; margin-bottom: 8px; }
.btabs button { flex: 1; font: 900 15px var(--font); padding: 6px; border-radius: 12px; border: 2px solid #e9d2a6; background: #f6e7c6; color: var(--ink); cursor: pointer; }

.rchain { margin-bottom: 8px; } .rchain h4 { margin: 0 0 4px; font: 900 14px var(--font); color: var(--teal-d); display: flex; justify-content: space-between; }
.rgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.rc { position: relative; aspect-ratio: 1 / 1.25; border-radius: 10px; background: #f6e7c6; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rc img, .rc i { width: 82%; aspect-ratio: 1; object-fit: contain; display: block; }
.rc i { border-radius: 50%; font: 900 13px/1 var(--font); color: #fff; display: flex; align-items: center; justify-content: center; font-style: normal; }
.rc.no img, .rc.no i { filter: brightness(0) opacity(.18); }
.rc em { font: 900 9px/1 var(--font); color: #d89a22; letter-spacing: -1px; font-style: normal; height: 10px; }
.reg { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin-bottom: 6px; border-radius: 12px; background: #f6e7c6; }
.reg img { width: 48px; height: 48px; border-radius: 10px; flex: none; }

.reg.locked { opacity: .55; }
.reg .t-bar { margin-top: 3px; }
/* 熟客升心 / 新菜谱卡 */
/* 每天回来（M5）：每日任务、签到日历、欢迎回来卡 */
#daily { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px dashed #e3cfa8; }
#daily h3 { display: flex; align-items: center; gap: 6px; }
#daily-ico img { width: 26px; height: 26px; display: block; }

.cal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 10px; }
.cal div { position: relative; padding: 6px 2px 5px; border-radius: 10px; background: #f6e7c6; font: 800 11px var(--font); color: #7a5a3a; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cal div img, .cal div svg { width: 22px; height: 22px; }
.cal div b { font: 900 13px var(--font); color: #3a2416; }

.cal .big { grid-column: span 2; background: #ffeec2; }
.cal-top { display: flex; justify-content: center; } .cal-top img { width: 56px; height: 56px; }
.welcome img.pic { width: 100%; height: auto; display: block; border-radius: 12px; margin-bottom: 8px; }

.heartup { display: flex; flex-direction: column; align-items: center; gap: 8px; }

.heartup img.comic { width: 100%; height: auto; aspect-ratio: 2 / 1; border-radius: 12px; border: 3px solid #3a2416; box-sizing: border-box; }
.heartup .hs { color: #e2566f; font-size: 24px; letter-spacing: 3px; }
.heartup q { font: italic 800 16px/1.4 var(--font); color: #3a2416; }
.newrec > img, .newrec > i { width: 120px; height: 120px; display: block; margin: 0 auto 6px; animation: lvspin .6s cubic-bezier(.2,1.6,.4,1); }
/* 宝箱 */
.chest { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.chest .box { width: 150px; height: 150px; position: relative; }

.chest .box.open { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.chest .rw-row span { opacity: 0; animation: chip .35s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes chip { from { opacity: 0; transform: translateY(14px) scale(.6); } to { opacity: 1; transform: none; } }
.floaty { position: fixed; z-index: 6; pointer-events: none; transform: translate(-50%, 0); font: 900 16px var(--font); text-shadow: 0 1px 0 #fff, 0 0 4px #fff;
  animation: floaty 1s ease-out forwards; white-space: nowrap; }
@keyframes floaty { to { transform: translate(-50%, -34px); opacity: 0; } }
#deco-btn.dim { filter: grayscale(.6); opacity: .7; }
.navb { position: relative; }
.navb.dot::after { content: ""; position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: #e2433a; border: 3px solid #fff; }

/* 激励视频：订单翻倍按钮（不打断操作，几秒后消失） */
#x2 { position: fixed; z-index: 3; display: none; transform: translateX(-50%); border: 3px solid #fff; border-radius: 16px; padding: 6px 12px;

#x2.show { display: block; animation: x2 .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes x2 { from { transform: translateX(-50%) scale(.5); opacity: 0; } }
.btn.ad { background: linear-gradient(#5fc8be, #2f9d97); border-color: #1d6f6a; box-shadow: 0 4px 0 #1d6f6a; }
/* 金币消耗按钮（2026-10-21）：金色底 + 金币图标 + 价格；钱不够时变灰但仍可点（点了提示金币不足） */

.btn .pr { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; padding-right: 8px; border-right: 2px solid rgba(90,58,18,.25); }
.btn .pr img, .btn .pr svg { width: 20px; height: 20px; }
.btns.col { flex-direction: column; align-items: stretch; }
#pill-energy { cursor: pointer; }
#m-comic { display: none; margin: 0 0 12px; } #m-comic svg { width: 100%; height: auto; display: block; }

.chain { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 2px; }

/* 广告 Mock 遮罩 */
#ad { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: #1b1b22; color: #fff; font: 800 18px var(--font); }

/* 本地化：所有玩家可见文案只从 locale/en.json 取（构建时内联为 LOCALE）。
   DOM 里写 data-l10n="key"，启动时 L.apply() 统一填。 */
const L = (() => {
  const table = LOCALE;
  const missing = new Set();
  function t(key, vars) {
    let s = table[key];
    if (s === undefined) { if (!missing.has(key)) { missing.add(key); console.warn('[l10n] missing', key); } s = key; }
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    return s;
  }
  function apply(root) { for (const el of (root || document).querySelectorAll('[data-l10n]')) el.textContent = t(el.dataset.l10n); }
  return { t, apply, missing };
})();

/* Merge Café Lite · 核心逻辑（纯数据，不碰 DOM / WebGL）
   浏览器里挂到全局 Core，Node 里 require 后做单测（tools/test_core.js）。
   所有数值来自 CONFIG（src/config/*.json），这里不写死任何数。
   时间一律用毫秒时间戳 now 传入，随机数用 rng 传入，方便离线结算和测试。 */
const Core = (() => {
  const SAVE_VERSION = 9;
  const TUT_DONE = -1;

  /* ---------- 配置索引 ---------- */
  function index(cfg) {
    const b = cfg.board, gens = {};
    for (const g of cfg.generators.generators) gens[g.id] = g;
    const O = cfg.orders, tpl = {};
    for (const t of O.templates) tpl[t.id] = t;
    if (cfg.tutorial && cfg.tutorial.firstOrder) tpl[cfg.tutorial.firstOrder.id] = cfg.tutorial.firstOrder;
    // 装修按区域组织（V1）：每个区域的节点拍平成 nodes，act / inAct 记所在幕
    const areas = ((cfg.deco && cfg.deco.areas) || []).map((ar, idx) => {
      const nodes = [];
      ar.acts.forEach((a, ai) => a.nodes.forEach((nd, ni) => nodes.push(Object.assign({ area: idx, act: ai, inAct: ni, actName: a.name }, nd))));
      return Object.assign({}, ar, { idx, nodes, comics: ar.comics || {} });
    });
    const P = cfg.progression || { xp: { rareMul: 1 }, levelNeed: [], after: 1e9, levelReward: {}, chest: {}, unlocks: [] };
    // 熟客（V1 M3）：按 id 和头像下标索引；每位一个熟客单模板 reg_<id>
    const RG = cfg.regulars || { regulars: [], hearts: [], heartRewards: [], points: {}, regularOrder: { chance: 0 }, seats: [] };
    const regs = RG.regulars, regById = {}, regByAvatar = {};
    for (const r of regs) {
      regById[r.id] = r; regByAvatar[r.avatar] = r;
      const lv = r.fav.reduce((a, [, l]) => a + l, 0), RO = RG.regularOrder;
      tpl['reg_' + r.id] = { id: 'reg_' + r.id, needs: r.fav, regular: r.id, coins: [RO.coinsPerLevel * lv * RO.coinsMul, RO.coinsPerLevel * lv * RO.coinsMul], timeSec: RO.timeSec };
    }
    return {
      areas, deco: areas.length ? areas[0].nodes : [], prog: P,
      RG, regs, regById, regByAvatar, RC: cfg.recipes || { coinsPerLevel: 0, stars: [], bonusPerStar: 0 },
      ads: cfg.ads || {}, tasks: cfg.tasks || { active: 0, list: [] },
      DY: cfg.daily || { tasks: { count: 0, fixed: [], extra: [] }, chest: {}, login: { rewards: [] }, offline: { capH: 0 } },
      cfg, cols: b.cols, rows: b.rows, n: b.cols * b.rows,
      maxLevel: cfg.chains.maxLevel, chains: cfg.chains.chains, gens, genList: cfg.generators.generators,
      eco: cfg.economy, O, tpl, tut: cfg.tutorial || { enabled: false }, ups: cfg.generators.upgrades || [],
    };
  }
  const idx = (C, r, c) => r * C.cols + c;
  const rc = (C, i) => [Math.floor(i / C.cols), i % C.cols];
  const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

  /* ---------- 新档 ---------- */
  function newState(C, now, rng) {
    rng = rng || Math.random;
    const b = C.cfg.board;
    const s = {
      v: SAVE_VERSION,
      coins: C.eco.startCoins, stars: C.eco.startStars, gems: C.eco.startGems,
      energy: C.eco.energy.start, energyTs: now,
      cells: new Array(C.n).fill(null),
      unlocked: new Array(C.n).fill(false),
      gens: {},
      orders: [],
      tut: C.tut.enabled ? 0 : TUT_DONE,
      seq: 0,
      deco: 0,                 // 当前区域已完成的装修节点数（按顺序解锁）
      area: 0,                 // 当前装修区域（V1 只有区域 1）
      xp: 0, level: 1,         // 店铺等级：xp 是当前等级内的经验
      regs: {},                // 熟客好感：id → { pts, hearts, regDay（今天出过熟客单的 UTC 日）, giftDay }
      recipes: {},             // 菜谱：chain+lvl → { f: 1 做出过, p: 熟练度点数 }
      ads: newAdStats(),
      tasks: { next: 0, active: [] },
      login: { n: 0, day: -1 }, // 累计签到：领过几格、最后领的 UTC 日
      daily: newDaily(now),    // 每日限次的金币消耗（UTC 0 点重置）
      stats: newStats(now),
    };
    for (let r = 0; r < C.rows; r++) for (let c = 0; c < C.cols; c++) s.unlocked[idx(C, r, c)] = b.mask[r][c] === 'x';
    s.hidden = rollHidden(C, s, rng); // 锁格里埋的物品（M4 棋盘障碍）
    for (const g of C.genList) s.gens[g.id] = { charges: g.charges, cdEnd: 0, lv: 1 };
    for (const it of b.startItems) s.cells[idx(C, it.at[0], it.at[1])] = { k: 'item', chain: it.chain, lvl: it.level };
    fillTasks(C, s);
    for (let k = 0; k < C.O.slots; k++) {
      if (k === 0 && s.tut !== TUT_DONE) s.orders.push(makeOrder(C, s, C.tut.firstOrder, now, rng, C.tut.firstOrder.customer));
      else s.orders.push(rollOrder(C, s, now, rng));
    }
    return s;
  }

  /* ---------- 棋盘障碍（V1 M4）：锁格里埋物品 ---------- */
  function rollHidden(C, s, rng) {
    const R = (C.cfg.board.obstacles || {}).rows || {}, chains = Object.keys(C.chains), h = new Array(C.n).fill(null);
    for (let i = 0; i < C.n; i++) {
      if (s.unlocked[i]) continue;
      const def = R[String(rc(C, i)[0])]; if (!def) continue;
      h[i] = { kind: def.kind, chain: chains[Math.floor(rng() * chains.length)], lvl: randInt(rng, def.lvl[0], def.lvl[1]) };
    }
    return h;
  }
  /* 这个锁格现在是不是"能挖的障碍"（开放了、埋了东西、和已开格相邻） */
  const obstacleAt = (C, s, i) => (featureOn(C, s, 'obstacles') && !s.unlocked[i] && s.hidden && s.hidden[i]) || null;
  /* 挖：把同款物品拖到障碍上 → 格子打开，里面是合成升一级的物品 */
  function canDig(C, s, it, i) {
    const h = obstacleAt(C, s, i);
    return !!(h && it && it.k === 'item' && it.chain === h.chain && it.lvl === h.lvl && it.lvl < C.maxLevel && canUnlockHere(C, s, i));
  }

  /* ---------- 体力：按时间戳结算，返回本次恢复了多少 ---------- */
  function settleEnergy(C, s, now) {
    const E = C.eco.energy, ms = E.regenSec * 1000;
    if (s.energy >= E.max) { s.energyTs = now; return 0; }
    if (now < s.energyTs) { s.energyTs = now; return 0; } // 系统时间被往回调：不倒扣，从现在重新计
    const gain = Math.floor((now - s.energyTs) / ms);
    if (gain <= 0) return 0;
    const before = s.energy;
    s.energy = Math.min(E.max, s.energy + gain);
    s.energyTs = s.energy >= E.max ? now : s.energyTs + gain * ms;
    return s.energy - before;
  }
  function energyNextIn(C, s, now) {
    if (s.energy >= C.eco.energy.max) return 0;
    const ms = C.eco.energy.regenSec * 1000;
    return Math.max(0, ms - (now - s.energyTs));
  }
  function spendEnergy(C, s, n, now) { settleEnergy(C, s, now); s.energy -= n; }

  /* ---------- 生成器（棋盘外按钮） ---------- */
  /* 生成器等级：Lv1 用生成器自己的定义，Lv2+ 查 generators.json 的 upgrades 表 */
  const genStats = (C, id, lv) => (lv > 1 && C.ups[lv - 2]) || { charges: C.gens[id].charges, cdMul: 1, levelWeights: C.gens[id].levelWeights };
  const genMaxCharges = (C, id, g) => genStats(C, id, (g && g.lv) || 1).charges;
  function settleGen(C, id, g, now) {
    if (g.charges <= 0 && g.cdEnd && now >= g.cdEnd) { g.charges = genMaxCharges(C, id, g); g.cdEnd = 0; return true; }
    return false;
  }
  function settleAll(C, s, now, rng) {
    const gained = settleEnergy(C, s, now);
    for (const id in s.gens) settleGen(C, id, s.gens[id], now);
    settleOrders(C, s, now, rng);
    settleBubbles(C, s, now);
    return gained;
  }
  function rollLevel(weights, rng) {
    const ent = Object.entries(weights).map(([l, w]) => [+l, w]);
    let tot = 0; for (const [, w] of ent) tot += w;
    let x = rng() * tot;
    for (const [l, w] of ent) { if ((x -= w) < 0) return l; }
    return ent[ent.length - 1][0];
  }
  /* 离 (ar,ac) 最近的空的已解锁格（欧氏距离，锚点可在棋盘外），没有返回 -1 */
  function nearestEmpty(C, s, ar, ac) {
    let best = -1, bd = 1e9;
    for (let i = 0; i < C.n; i++) {
      if (!s.unlocked[i] || s.cells[i]) continue;
      const [r, c] = rc(C, i), d = (r - ar) * (r - ar) + (c - ac) * (c - ac) * 1.0001;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function emptyCount(C, s) { let n = 0; for (let i = 0; i < C.n; i++) if (s.unlocked[i] && !s.cells[i]) n++; return n; }

  /* 点生成器。返回 {ok:true, to, item} 或 {ok:false, reason:'cooldown'|'full'|'energy'|'tutorial', ...}
     检查顺序：冷却 → 满格 → 体力，失败时什么都不扣。 */
  function tapGen(C, s, id, now, rng) {
    rng = rng || Math.random;
    const g = s.gens[id], def = C.gens[id];
    if (!g || !def) return { ok: false, reason: 'notGen' };
    if (s.tut !== TUT_DONE && tutStep(C, s) !== 'tapGen') return { ok: false, reason: 'tutorial' };
    if (s.tut !== TUT_DONE && id !== C.tut.generator) return { ok: false, reason: 'tutorial' };
    settleAll(C, s, now, rng);
    if (g.charges <= 0) return { ok: false, reason: 'cooldown', left: g.cdEnd - now };
    const to = nearestEmpty(C, s, def.anchor[0], def.anchor[1]);
    if (to < 0) return { ok: false, reason: 'full' };
    if (s.energy < def.energyCost) return { ok: false, reason: 'energy', next: energyNextIn(C, s, now) };
    spendEnergy(C, s, def.energyCost, now);
    g.charges--;
    if (g.charges <= 0) { g.cdLen = cooldownSec(C, s, id); g.cdEnd = now + g.cdLen * 1000; }
    const lvl = s.tut !== TUT_DONE ? C.tut.spawnLevel : rollLevel(genStats(C, id, g.lv || 1).levelWeights, rng);
    const item = { k: 'item', chain: def.chain, lvl };
    s.cells[to] = item;
    s.stats.spawns++; s.stats.maxLvl = Math.max(s.stats.maxLvl || 0, item.lvl);
    const found = markFound(C, s, item, now);
    if (s.tut !== TUT_DONE) s.tut++;
    return { ok: true, to, item, found };
  }
  /* 冷却时长：前期按已完成订单数走 cooldownRamp（15 → 30 秒），之后用生成器自己的 cooldownSec */
  function cooldownSec(C, s, id) {
    const ramp = C.cfg.generators.cooldownRamp || [], done = s.stats.ordersDone, mul = genStats(C, id, (s.gens[id] && s.gens[id].lv) || 1).cdMul || 1;
    for (const r of ramp) if (done < r.beforeOrders) return Math.round(r.sec * mul);
    return Math.round(C.gens[id].cooldownSec * mul);
  }
  /* 生成器立即回满（激励广告点位 2） */
  function refillGen(C, s, id) {
    const g = s.gens[id]; if (!g) return false;
    g.charges = genMaxCharges(C, id, g); g.cdEnd = 0; return true;
  }

  /* ---------- 金币消耗（2026-10-21）：生成器升级 / 金币回满 / 金币买体力 / 合成泡泡 / 换单 ---------- */
  const dayOf = (now) => Math.floor((now || 0) / 86400000); // UTC 日
  function newDaily(now) { return { day: dayOf(now), refills: 0, energyBuys: 0 }; }
  function daily(s, now) { if (!s.daily || s.daily.day !== dayOf(now)) s.daily = newDaily(now); return s.daily; }
  /* 升级：下一级价格，满级返回 null */
  function upgradeCost(C, s, id) { const g = s.gens[id], u = g && C.ups[(g.lv || 1) - 1]; return u ? u.cost : null; }
  function upgradeGen(C, s, id) {
    const g = s.gens[id]; if (!g) return { ok: false, reason: 'notGen' };
    if (tutStep(C, s)) return { ok: false, reason: 'tutorial' };
    const cost = upgradeCost(C, s, id);
    if (cost === null) return { ok: false, reason: 'max' };
    if (s.coins < cost) return { ok: false, reason: 'coins', price: cost };
    const before = genMaxCharges(C, id, g);
    s.coins -= cost; g.lv = (g.lv || 1) + 1; s.stats.coinsSpent.upgrade += cost; logEv(s, 'mid');
    if (g.charges > 0) g.charges += genMaxCharges(C, id, g) - before; // 升级立即多给差额储量；冷却中的等回满时按新上限
    return { ok: true, price: cost, lv: g.lv };
  }
  /* 金币立即回满：当天第 n 次（从 0 起）价格 base + step×n */
  function refillPrice(C, s, now) { const R = C.eco.coinRefill; return R ? R.base + R.step * daily(s, now).refills : null; }
  function buyRefill(C, s, id, now) {
    const g = s.gens[id]; if (!g) return { ok: false, reason: 'notGen' };
    settleGen(C, id, g, now);
    if (g.charges > 0) return { ok: false, reason: 'notEmpty' };
    const p = refillPrice(C, s, now); if (p === null) return { ok: false, reason: 'off' };
    if (s.coins < p) return { ok: false, reason: 'coins', price: p };
    s.coins -= p; daily(s, now).refills++; s.stats.coinsSpent.refill += p; refillGen(C, s, id);
    return { ok: true, price: p };
  }
  /* 金币买体力：每天按 prices 逐次涨价，买完当天返回 null（UI 不显示按钮） */
  function energyPrice(C, s, now) { const E = C.eco.coinEnergy; if (!E) return null; const n = daily(s, now).energyBuys; return n < E.prices.length ? E.prices[n] : null; }
  function buyEnergy(C, s, now) {
    const p = energyPrice(C, s, now); if (p === null) return { ok: false, reason: 'limit' };
    if (s.coins < p) return { ok: false, reason: 'coins', price: p };
    settleEnergy(C, s, now);
    s.coins -= p; daily(s, now).energyBuys++; s.stats.coinsSpent.energy += p; s.energy += C.eco.coinEnergy.amount;
    return { ok: true, price: p, amount: C.eco.coinEnergy.amount };
  }
  /* 合成泡泡：合出 minLevel 级以上时按 chance 在离合成格最近的空格冒一个同款泡泡（棋盘上同时最多 maxAtOnce 个）。
     泡泡占格、不能拖、不能合、不能交单；lifeSec 到点自动消失。 */
  function maybeBubble(C, s, at, it, now, rng) {
    const B = C.eco.bubble; if (!B || it.lvl < B.minLevel || s.tut !== TUT_DONE) return -1;
    if (s.cells.filter((c) => c && c.k === 'bubble').length >= B.maxAtOnce) return -1;
    // 保底：连续 pity 次没冒，这次必冒（满格冒不出来时计数保留到下一次）
    const forced = B.pity && (s.bubblePity || 0) >= B.pity;
    if (!forced && rng() >= B.chance) { s.bubblePity = (s.bubblePity || 0) + 1; return -1; }
    const [r, c] = rc(C, at), to = nearestEmpty(C, s, r, c);
    if (to < 0) { s.bubblePity = (s.bubblePity || 0) + 1; return -1; }
    s.bubblePity = 0;
    s.cells[to] = { k: 'bubble', chain: it.chain, lvl: it.lvl, until: (now || 0) + B.lifeSec * 1000 };
    s.stats.bubbles = (s.stats.bubbles || 0) + 1;
    return to;
  }
  /* 百搭星掉落（V1 M4）：合出 minLevel 级以上按 chance 在旁边空格掉一颗，连续 pity 次没掉必掉 */
  function maybeWildStar(C, s, at, it, rng) {
    const W = C.eco.wildStar; if (!W || !featureOn(C, s, 'wildStar') || it.lvl < W.minLevel) return -1;
    const forced = (s.wildPity || 0) >= W.pity;
    if (!forced && rng() >= W.chance) { s.wildPity = (s.wildPity || 0) + 1; return -1; }
    const [r, c] = rc(C, at), to = nearestEmpty(C, s, r, c);
    if (to < 0) { s.wildPity = (s.wildPity || 0) + 1; return -1; }
    s.wildPity = 0; s.cells[to] = { k: 'tool', id: 'wild' }; s.stats.wildGot = (s.stats.wildGot || 0) + 1; logEv(s, 'mid');
    return to;
  }
  /* 直接给一颗百搭星（每日宝箱等）：放到离 (ar,ac) 最近的空格，没空格返回 -1 */
  function giveWildStar(C, s, ar, ac) { const to = nearestEmpty(C, s, ar, ac); if (to < 0) return -1; s.cells[to] = { k: 'tool', id: 'wild' }; s.stats.wildGot = (s.stats.wildGot || 0) + 1; return to; }
  function settleBubbles(C, s, now) {
    const gone = [];
    for (let i = 0; i < C.n; i++) { const c = s.cells[i]; if (c && c.k === 'bubble' && !c.hold && now >= c.until) { s.cells[i] = null; gone.push(i); } }
    return gone;
  }
  const bubblePrice = (C, b) => b.lvl * C.eco.bubble.pricePerLevel;
  /* 拿下泡泡：pay='coins' 扣金币，pay='ad' 由广告发奖调用（不扣钱）。
     看广告期间 UI 给泡泡打 hold 标记：不会在广告播放中过期，看完照样能拿（没看完由 UI 去掉 hold，过期的下一次结算就消失） */
  function popBubble(C, s, i, pay, now) {
    const b = s.cells[i]; if (!b || b.k !== 'bubble') return { ok: false, reason: 'none' };
    if (now >= b.until && !(pay === 'ad' && b.hold)) { s.cells[i] = null; return { ok: false, reason: 'expired' }; }
    const p = pay === 'ad' ? 0 : bubblePrice(C, b);
    if (s.coins < p) return { ok: false, reason: 'coins', price: p };
    s.coins -= p; s.stats.coinsSpent.bubble += p;
    if (pay === 'ad') s.ads.rewards++;
    s.cells[i] = { k: 'item', chain: b.chain, lvl: b.lvl }; logEv(s, 'mid');
    return { ok: true, price: p, item: s.cells[i], found: markFound(C, s, s.cells[i], now) };
  }
  /* 换单：花金币把第 k 个订单换成别的（交过一部分的不能换，引导中不能换） */
  function canSwap(C, s, k) { const o = s.orders[k]; return !!(o && C.eco.swapOrder && !tutStep(C, s) && !o.needs.some((n) => n.done)); }
  function swapOrder(C, s, k, now, rng) {
    if (!canSwap(C, s, k)) return { ok: false, reason: 'locked' };
    const p = C.eco.swapOrder.price;
    if (s.coins < p) return { ok: false, reason: 'coins', price: p };
    s.coins -= p; s.stats.coinsSpent.swap += p;
    s.orders[k] = rollOrder(C, s, now, rng || Math.random); // 旧单还在槽位里时抽，保证换到的不是同一张
    return { ok: true, price: p };
  }

  /* ---------- 拖放 ---------- */
  function canMerge(C, a, b) {
    return !!(a && b && a.k === 'item' && b.k === 'item' && a.chain === b.chain && a.lvl === b.lvl && a.lvl < C.maxLevel);
  }
  function drop(C, s, from, to, now, rng) {
    const a = s.cells[from];
    if (!a || (a.k !== 'item' && a.k !== 'tool')) return { type: 'none' };
    if (to < 0 || to >= C.n || to === from) return { type: 'none' };
    if (!s.unlocked[to]) {
      if (canDig(C, s, a, to)) { // 挖障碍
        const it = { k: 'item', chain: a.chain, lvl: a.lvl + 1 };
        s.unlocked[to] = true; s.hidden[to] = null; s.cells[to] = it; s.cells[from] = null;
        s.stats.unlocks = (s.stats.unlocks || 0) + 1; s.stats.dug = (s.stats.dug || 0) + 1; s.stats.merges++;
        s.stats.maxLvl = Math.max(s.stats.maxLvl || 0, it.lvl); logEv(s, 'mid');
        const found = markFound(C, s, it, now), combo = addCombo(C, s, now);
        return { type: 'dig', lvl: it.lvl, found, combo, star: maybeWildStar(C, s, to, it, rng || Math.random) };
      }
      return { type: 'bounce', reason: obstacleAt(C, s, to) ? 'dig' : 'locked' };
    }
    const b = s.cells[to];
    const step = tutStep(C, s);
    if (a.k === 'tool') { // 百搭星：拖到 8 级以下物品上 = 升 1 级；拖到空格是移动
      if (step) return { type: 'bounce', reason: 'tutorial' };
      if (!b) { s.cells[to] = a; s.cells[from] = null; return { type: 'move' }; }
      if (b.k !== 'item' || b.lvl >= C.maxLevel) return { type: 'bounce', reason: b.k === 'item' ? 'max' : 'mismatch' };
      const it = { k: 'item', chain: b.chain, lvl: b.lvl + 1 };
      s.cells[to] = it; s.cells[from] = null; s.stats.wildUsed = (s.stats.wildUsed || 0) + 1;
      s.stats.maxLvl = Math.max(s.stats.maxLvl || 0, it.lvl); logEv(s, 'mid');
      return { type: 'wild', lvl: it.lvl, found: markFound(C, s, it, now) };
    }
    if (b && b.k === 'tool') return { type: 'bounce', reason: 'mismatch' };
    if (step && step !== 'merge') return { type: 'bounce', reason: 'tutorial' };
    if (!b) {
      if (step) return { type: 'bounce', reason: 'tutorial' };
      s.cells[to] = a; s.cells[from] = null; return { type: 'move' };
    }
    if (canMerge(C, a, b)) {
      s.cells[to] = { k: 'item', chain: a.chain, lvl: a.lvl + 1 };
      s.cells[from] = null;
      s.stats.merges++;
      const found = markFound(C, s, s.cells[to], now);
      if (a.lvl + 1 > (s.stats.maxLvl || 0)) { s.stats.maxLvl = a.lvl + 1; if (!found) logEv(s, 'mid'); } // 第一次做出这个等级（图鉴已记中奖励的不重复记）
      if (!s.stats.firstMergeAt) s.stats.firstMergeAt = now || 1;
      if (step === 'merge') s.tut++;
      const bubble = maybeBubble(C, s, to, s.cells[to], now, rng || Math.random);
      const combo = step ? null : addCombo(C, s, now);
      const star = step ? -1 : maybeWildStar(C, s, to, s.cells[to], rng || Math.random);
      return { type: 'merge', lvl: a.lvl + 1, bubble, combo, found, star };
    }
    let reason = 'mismatch';
    if (a.k === 'item' && b.k === 'item' && a.chain === b.chain && a.lvl === b.lvl) reason = 'max';
    return { type: 'bounce', reason };
  }

  /* ---------- 合成连击（V1 M2）：两次合成间隔 ≤ windowSec 算连击；断了只是从 1 重新数，不罚 ---------- */
  function addCombo(C, s, now) {
    const K = C.eco.combo; if (!K) return null;
    const t = now || 0, c = s.combo || (s.combo = { n: 0, at: 0 });
    c.n = c.at && t - c.at <= K.windowSec * 1000 ? c.n + 1 : 1; c.at = t;
    const r = { n: c.n, show: c.n >= K.showFrom, coins: 0, energy: 0 };
    if (K.coinsEvery && c.n % K.coinsEvery === 0) { r.coins = K.coins; s.coins += K.coins; s.stats.coinsEarned += K.coins; }
    if (K.energyEvery && c.n % K.energyEvery === 0) { r.energy = K.energy; settleEnergy(C, s, t); s.energy += K.energy; }
    if (r.coins || r.energy) logEv(s, 'small');
    s.stats.bestCombo = Math.max(s.stats.bestCombo || 0, c.n);
    if (c.n === 5) s.stats.combo5 = (s.stats.combo5 || 0) + 1; // 每日任务「打出 x5 连击」
    return r;
  }

  /* ---------- 出售 + 回收桶（V1 M2） ---------- */
  const sellPrice = (C, it) => Math.pow(2, it.lvl - 1);
  function sellItem(C, s, i, now) {
    const it = s.cells[i];
    if (!it || it.k !== 'item') return { ok: false, reason: 'none' };
    if (tutStep(C, s)) return { ok: false, reason: 'tutorial' };
    const price = sellPrice(C, it), R = C.eco.recycle || { size: 0 };
    s.cells[i] = null; s.coins += price; s.stats.coinsEarned += price; s.stats.sold = (s.stats.sold || 0) + 1;
    s.recycle = (s.recycle || 0) + 1;
    let energy = 0;
    if (R.size && s.recycle >= R.size) { s.recycle = 0; energy = R.energy; settleEnergy(C, s, now || 0); s.energy += energy; logEv(s, 'mid'); }
    else logEv(s, 'small');

  }

  /* ---------- 提示（V1 M2）：永不卡死 ---------- */
  /* 棋盘上一对能合成的物品（优先低等级，引导中不提示），没有返回 null */
  function findMergePair(C, s) {
    let best = null;
    for (let i = 0; i < C.n; i++) {
      const a = s.cells[i]; if (!a || a.k !== 'item' || a.lvl >= C.maxLevel) continue;
      for (let j = i + 1; j < C.n; j++) if (canMerge(C, a, s.cells[j]) && (!best || a.lvl < s.cells[best[0]].lvl)) { best = [i, j]; break; }
    }
    return best;
  }
  /* 满格且没有能合的：返回最低级物品的格子（提示卖掉它腾地方），否则 -1 */
  function stuckHint(C, s) {
    if (emptyCount(C, s) > 0 || findMergePair(C, s)) return -1;
    if (s.cells.some((c) => c && c.k === 'tool') && s.cells.some((c) => c && c.k === 'item' && c.lvl < C.maxLevel)) return -1; // 有百搭星能用
    for (let i = 0; i < C.n; i++) if (s.cells[i] && s.cells.some((_, j) => canDig(C, s, s.cells[i], j))) return -1; // 有障碍能挖
    let low = -1;
    for (let i = 0; i < C.n; i++) { const c = s.cells[i]; if (c && c.k === 'item' && (low < 0 || c.lvl < s.cells[low].lvl)) low = i; }
    return low;
  }

  /* ---------- 订单 ---------- */
  const isRare = (C, t) => t.needs.some(([, l]) => l >= C.O.rareMinLevel);
  function makeOrder(C, s, t, now, rng, customer) {
    const sec = randInt(rng, t.timeSec[0], t.timeSec[1]);
    const rare = isRare(C, t);
    return {
      uid: ++s.seq, tid: t.id,
      needs: t.needs.map(([chain, lvl]) => ({ chain, lvl, done: false })),
      coins: randInt(rng, t.coins[0], t.coins[1]),
      stars: C.O.bands[rare ? 'rare' : 'normal'].stars,
      rare, cust: customer !== undefined ? customer : randInt(rng, 0, C.O.customers.length - 1),
      start: now, expiresAt: now + sec * 1000,
      ...setOrderFields(C, s, t.needs, now),
    };
  }
  /* 套餐单（V1 M4）：开放后，同时要两条链的订单在 perfectSec 秒内交齐有 Perfect 加成 */
  function setOrderFields(C, s, needs, now) {
    const S2 = C.eco.setOrder; if (!S2 || !featureOn(C, s, 'setOrders') || s.tut !== TUT_DONE) return {};
    const chains = new Set(needs.map((n) => n[0] || n.chain));
    return chains.size >= 2 ? { set: true, perfectEnd: now + S2.perfectSec * 1000 } : {};
  }
  /* 熟客单：2 心以上的熟客每人每天最多 1 张；新订单有 chance 概率出 */
  function rollRegularOrder(C, s, now, rng) {
    const RO = C.RG.regularOrder, today = dayOf(now);
    if (!RO.chance || !featureOn(C, s, 'regulars') || s.tut !== TUT_DONE) return null;
    const liveCust = new Set(s.orders.filter(Boolean).map((o) => o.cust));
    const cand = C.regs.filter((r) => regOn(C, s, r) && regState(s, r.id).hearts >= 2 && regState(s, r.id).regDay !== today && !liveCust.has(r.avatar));
    if (!cand.length || rng() >= RO.chance) return null;
    const r = cand[Math.floor(rng() * cand.length)], t = C.tpl['reg_' + r.id];
    const o = makeOrder(C, s, t, now, rng, r.avatar);
    o.rare = false; o.stars = RO.stars; o.regular = r.id; regState(s, r.id).regDay = today;
    return o;
  }
  /* 按 minDone / 权重抽模板；同屏不重复模板、不出需求完全相同的单、稀有最多 maxRareAtOnce 个、顾客尽量不重复 */
  function rollOrder(C, s, now, rng) {
    const reg = rollRegularOrder(C, s, now, rng); if (reg) return reg;
    const done = s.stats.ordersDone;
    const sig = (needs) => needs.map((n) => (n.chain || n[0]) + (n.lvl || n[1])).sort().join('+');
    const live = new Set(s.orders.filter(Boolean).map((o) => o.tid));
    const liveSig = new Set(s.orders.filter(Boolean).map((o) => sig(o.needs)));
    const rareLive = s.orders.filter((o) => o && o.rare).length;
    let pool = C.O.templates.filter((t) => t.minDone <= done && !live.has(t.id) && !liveSig.has(sig(t.needs)) && (!isRare(C, t) || rareLive < C.O.maxRareAtOnce));
    if (!pool.length) pool = C.O.templates.filter((t) => t.minDone <= done && !isRare(C, t));
    let tot = 0; for (const t of pool) tot += t.weight;
    let x = rng() * tot, pick = pool[pool.length - 1];
    for (const t of pool) { if ((x -= t.weight) < 0) { pick = t; break; } }
    const usedCust = new Set(s.orders.filter(Boolean).map((o) => o.cust));
    const free = C.O.customers.map((_, i) => i).filter((i) => !usedCust.has(i));
    const cust = free.length ? free[Math.floor(rng() * free.length)] : randInt(rng, 0, C.O.customers.length - 1);
    return makeOrder(C, s, pick, now, rng, cust);
  }
  /* 超时刷新：不惩罚；已经交过部分物品的订单不过期（不吞玩家已交的东西）。返回被刷新的槽位 */
  function settleOrders(C, s, now, rng) {
    rng = rng || Math.random;
    const refreshed = [];
    for (let k = 0; k < s.orders.length; k++) {
      const o = s.orders[k];
      if (!o || now < o.expiresAt || o.needs.some((n) => n.done)) continue;
      if (s.tut !== TUT_DONE && k === 0) continue; // 引导订单不过期
      s.orders[k] = null; s.orders[k] = rollOrder(C, s, now, rng); refreshed.push(k);
    }
    return refreshed;
  }
  /* 这个物品能交给这个订单吗：返回 need 下标或 -1 */
  function orderNeedFor(C, o, it) {
    if (!o || !it || it.k !== 'item') return -1;
    return o.needs.findIndex((n) => !n.done && n.chain === it.chain && n.lvl === it.lvl);
  }
  /* 交货：把棋盘 from 格的物品交给第 k 个订单。全部交齐则结算并在该槽位刷新新订单。 */
  function deliver(C, s, from, k, now, rng) {
    rng = rng || Math.random;
    const it = s.cells[from], o = s.orders[k];
    const step = tutStep(C, s);
    if (step && (step !== 'deliver' || k !== 0)) return { type: 'reject', reason: 'tutorial' };
    const ni = orderNeedFor(C, o, it);
    if (ni < 0) return { type: 'reject', reason: 'mismatch' };
    o.needs[ni].done = true; s.cells[from] = null;
    if (o.needs.some((n) => !n.done)) return { type: 'partial', need: ni };
    const pay = orderCoins(C, s, o, now);
    if (pay.perfect) { s.stats.perfects = (s.stats.perfects || 0) + 1; logEv(s, 'mid'); }
    s.coins += pay.total; s.stars += o.stars;
    s.stats.ordersDone++; s.stats.coinsEarned += pay.total;
    logEv(s, 'small');

    if (o.set) s.stats.setDone = (s.stats.setDone || 0) + 1;
    if (aff.reg) s.stats.regServed = (s.stats.regServed || 0) + 1;

    s.stars += bonusStar;
    if (!s.stats.firstOrderAt) s.stats.firstOrderAt = now || 1;
    if (step === 'deliver') s.tut = TUT_DONE;
    const doneOrder = o;
    s.orders[k] = null; s.orders[k] = rollOrder(C, s, now, rng);

    const interstitial = !!(ie && done % ie === 0 && done >= (A.interstitialFirstAtOrder || 0) &&

    const de = (A.rewarded && A.rewarded.double && A.rewarded.double.everyOrders) || 1, offerDouble = done % de === 0;

  }

  /* ---------- 熟客好感（V1 M3） ---------- */
  function regState(s, id) { const r = s.regs || (s.regs = {}); return r[id] || (r[id] = { pts: 0, hearts: 0, regDay: -1, giftDay: -1 }); }
  const regOn = (C, s, r) => featureOn(C, s, 'regulars') && s.level >= r.unlock;
  function heartsFor(C, pts) { let h = 0; for (const t of C.RG.hearts) if (pts >= t) h++; return h; }
  /* 当前心数对应的小费加成（%）和每日礼物（体力） */
  function regPerks(C, hearts) {
    let tip = 0, gift = 0;
    for (const R of C.RG.heartRewards) if (hearts >= R.heart) { if (R.tip) tip = Math.max(tip, R.tip); if (R.gift) gift = R.gift; }
    return { tip, gift };
  }
  /* 交单后加好感：返回升到的心（含台词 / 宝箱）和今天的礼物 */
  function addAffinity(C, s, o, now) {
    const r = C.regByAvatar[o.cust]; if (!r || !regOn(C, s, r)) return { heartUps: [], gift: 0, reg: null };
    const st = regState(s, r.id), P = C.RG.points;
    const fav = o.needs.some((n) => r.fav.some(([c, l]) => c === n.chain && l === n.lvl));
    st.pts += (P.order || 0) + (fav ? P.fav || 0 : 0) + (o.regular === r.id ? P.regularOrder || 0 : 0);
    const heartUps = [], h = heartsFor(C, st.pts);
    while (st.hearts < h) {
      st.hearts++;
      const R = C.RG.heartRewards.find((x) => x.heart === st.hearts) || {}, up = { reg: r.id, heart: st.hearts, line: R.line ? 'line.' + r.id + '.' + R.line : null, chest: null };
      if (R.chest) up.chest = openChest(C, s, now); // 宝箱内容已入账，UI 做开箱演出
      logEv(s, 'mid'); heartUps.push(up);
    }
    let gift = 0; const today = dayOf(now), perks = regPerks(C, st.hearts);
    if (perks.gift && st.giftDay !== today) { st.giftDay = today; gift = perks.gift; settleEnergy(C, s, now || 0); s.energy += gift; logEv(s, 'small'); }
    return { heartUps, gift, reg: r.id };
  }

  /* ---------- 菜谱：图鉴 + 熟练度（V1 M3） ---------- */
  const recKey = (chain, lvl) => chain + lvl;
  function recState(s, chain, lvl) { const r = s.recipes || (s.recipes = {}); const k = recKey(chain, lvl); return r[k] || (r[k] = { f: 0, p: 0 }); }
  function recipeStars(C, s, chain, lvl) { const st = (s.recipes || {})[recKey(chain, lvl)]; if (!st) return 0; let n = 0; for (const t of C.RC.stars) if (st.p >= t) n++; return n; }
  /* 第一次做出某物品：记进图鉴；菜谱开放后发 等级×coinsPerLevel 金币，集齐一条链送宝箱。返回 null 或 { item, coins, chainDone, chest } */
  function markFound(C, s, it, now) {
    if (!it || it.k !== 'item') return null;
    const st = recState(s, it.chain, it.lvl); if (st.f) return null;
    st.f = 1;
    if (!featureOn(C, s, 'recipes')) return null; // 没开放前做出的照常记录，不发奖
    const coins = it.lvl * (C.RC.coinsPerLevel || 0); s.coins += coins; s.stats.coinsEarned += coins;
    const chainDone = C.chains[it.chain].items.every((_, i) => recState(s, it.chain, i + 1).f);
    const chest = chainDone ? openChest(C, s, now) : null;
    logEv(s, 'mid');
    return { item: { chain: it.chain, lvl: it.lvl }, coins, chainDone, chest };
  }
  /* 交单加熟练度：每道菜 +等级 点；返回升星列表 */
  function addMastery(C, s, o) {
    const ups = [];
    for (const n of o.needs) {
      const before = recipeStars(C, s, n.chain, n.lvl); recState(s, n.chain, n.lvl).p += n.lvl;
      const after = recipeStars(C, s, n.chain, n.lvl);
      if (after > before && featureOn(C, s, 'recipes')) { ups.push({ chain: n.chain, lvl: n.lvl, stars: after }); logEv(s, 'mid'); }
    }
    return ups;
  }
  /* 这张订单实际给多少金币：基础 + 菜谱星级加成（多道菜取平均）+ 熟客小费 */
  function orderCoins(C, s, o, now) {
    const base = o.coins;
    // 套餐单 Perfect：在时限内交齐（now 不传时按"还在时限内"显示）
    const perfect = o.set && (now === undefined || now <= o.perfectEnd) ? Math.round(base * C.eco.setOrder.bonusPct / 100) : 0;
    let recipe = 0;
    if (featureOn(C, s, 'recipes')) { const pct = o.needs.reduce((a, n) => a + recipeStars(C, s, n.chain, n.lvl) * C.RC.bonusPerStar, 0) / o.needs.length; recipe = Math.round(base * pct / 100); }
    let tip = 0; const r = C.regByAvatar[o.cust];
    if (r && regOn(C, s, r)) tip = Math.round(base * regPerks(C, regState(s, r.id).hearts).tip / 100);
    return { base, recipe, tip, perfect, total: base + recipe + tip + perfect };
  }
  /* 已经入座的熟客（UI 画在咖啡馆场景里）：按登场顺序依次占座，座位所在图层要已经装修 */
  function seatedRegulars(C, s) {
    const out = [], seats = C.RG.seats.filter((st) => decoDone(C, s, st.layer, 0));
    for (const r of C.regs) { if (!regOn(C, s, r) || out.length >= seats.length) continue; out.push({ reg: r, seat: seats[out.length], hearts: regState(s, r.id).hearts }); }
    return out;
  }

  /* ---------- 装修：按区域、按顺序解锁，扣星 + 金币 ---------- */
  const areaOf = (C, s) => C.areas[s.area || 0] || C.areas[0];
  const areaNodes = (C, s) => areaOf(C, s).nodes;
  function decoNext(C, s) { return areaNodes(C, s)[s.deco] || null; }
  function renovate(C, s) {
    const nd = decoNext(C, s);
    if (!nd) return { ok: false, reason: 'done' };
    if (tutStep(C, s)) return { ok: false, reason: 'tutorial' };
    if (s.stars < nd.cost) return { ok: false, reason: 'stars', need: nd.cost - s.stars };
    const price = nd.coins || 0;
    if (s.coins < price) return { ok: false, reason: 'coins', need: price - s.coins };
    s.stars -= nd.cost; s.coins -= price; s.stats.coinsSpent.deco = (s.stats.coinsSpent.deco || 0) + price; s.deco++;

  }
  /* 某个图层是否已解锁（场景用）：layer 属于 areaIdx 区域；已经进到后面的区域 = 前面的全装完了 */
  function decoDone(C, s, layer, areaIdx) {
    const a = areaIdx || 0; if ((s.area || 0) > a) return true; if ((s.area || 0) < a) return false;
    const i = C.areas[a].nodes.findIndex((d) => d.layer === layer); return i >= 0 && i < s.deco;
  }

  /* ---------- 店铺等级（V1）：每单得经验，升级给体力 / 金币，每 N 级一个宝箱 ---------- */
  function xpNeed(C, level) { const t = C.prog.levelNeed; return level - 1 < t.length ? t[level - 1] : C.prog.after; }
  function orderXp(C, o) { const base = o.needs.reduce((a, n) => a + n.lvl, 0); return Math.round(base * (o.rare ? (C.prog.xp.rareMul || 1) : 1) * (o.regular ? (C.prog.xp.regularMul || 1) : 1)); }
  /* 加经验，返回这次升的每一级及其奖励（奖励已经发到 s 上） */
  function addXp(C, s, n, now) {

  }
  /* 宝箱：内容在 progression.json 的 chest；M2 起改成开箱动画 + 随机内容 */
  function openChest(C, s, now) {
    const c = C.prog.chest || {};
    if (c.energy) { settleEnergy(C, s, now || 0); s.energy += c.energy; }
    if (c.coins) { s.coins += c.coins; s.stats.coinsEarned += c.coins; }
    if (c.stars) s.stars += c.stars;

  }
  /* 功能开关：配置里 ready 且店铺等级够 */
  function unlockLevel(C, feature) { const u = C.prog.unlocks.find((x) => x.feature === feature); return u ? u.level : 1; }
  const featureOn = (C, s, feature) => { const u = C.prog.unlocks.find((x) => x.feature === feature); return !u || (u.ready && s.level >= u.level); };
  /* 下一个要开放的功能（只看 ready 的），用于"还差几级"提示 */
  function nextUnlock(C, s) { return C.prog.unlocks.filter((u) => u.ready && u.level > s.level).sort((a, b) => a.level - b.level)[0] || null; }

  /* ---------- 打点（V1 验收）：每天是否上线、奖励事件按档计数、有效游玩时长 ---------- */
  function logEv(s, tier) { const e = s.stats.ev || (s.stats.ev = { small: 0, mid: 0, big: 0 }); e[tier] = (e[tier] || 0) + 1; }
  /* 记一次上线：按 UTC 日去重，最多留 60 天；返回是否是新的一天 */
  function markDay(s, now) {
    const d = dayOf(now), days = s.stats.days || (s.stats.days = []);
    if (days.includes(d)) return false;
    days.push(d); if (days.length > 60) days.shift(); return true;
  }
  /* 首次进入后第 7 天内来过几天（含首日） */
  function daysInFirstWeek(s) { const ds = s.stats.days || []; if (!ds.length) return 0; const d0 = Math.min(...ds); return ds.filter((d) => d - d0 < 7).length; }

  /* ---------- 任务（底栏 Tasks） ---------- */
  const newSpent = () => ({ unlock: 0, upgrade: 0, refill: 0, energy: 0, bubble: 0, swap: 0, deco: 0 });
  function newStats(now) {
    return { merges: 0, spawns: 0, ordersDone: 0, coinsEarned: 0, unlocks: 0, maxLvl: 0, firstMergeAt: 0, firstOrderAt: 0, createdAt: now, coinsSpent: newSpent(), bubbles: 0,

  }
  function taskStat(s, type) {
    switch (type) {

      case 'unlocks': return s.stats.unlocks || 0; case 'renovate': return s.deco; case 'coins': return s.stats.coinsEarned;
      case 'level': return s.stats.maxLvl || 0;
      case 'regulars': return s.stats.regServed || 0; case 'combo5': return s.stats.combo5 || 0;

/* Merge Café Lite · 音效（V1 M2）：全部用 WebAudio 现场合成，不占包体。
   浏览器要求用户手势后才能出声：第一次 pointerdown 时 Sfx.unlock()。
   静音状态存在存档 settings.mute（main.js 设置）；广告播放时 Ads 调 Sfx.duck(true) 暂停（门户 SDK 要求）。
   音色都是短促、柔和的正弦 / 三角波，音量偏低，适合长时间循环听。 */
const Sfx = (() => {
  let ctx = null, master = null, muted = false, ducked = false;
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  function ensure() {
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); } catch (e) { ctx = null; return null; }
    }
    return ctx;
  }
  function unlock() { const c = ensure(); if (c && c.state === 'suspended' && !ducked) c.resume().catch(() => {}); }
  function setMuted(m) { muted = !!m; }
  function duck(on) { ducked = !!on; if (!ctx) return; if (on) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {}); }
  const live = () => !muted && !ducked && ensure() && ctx.state === 'running';

  /* 一个音：频率 f（可滑到 f2），时长 d 秒，波形 type，音量 g，延迟 at 秒 */
  function tone(f, d, type, g, at, f2) {
    const t = ctx.currentTime + (at || 0), o = ctx.createOscillator(), v = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g || 0.2, t + 0.012); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(v); v.connect(master); o.start(t); o.stop(t + d + 0.02);
  }
  // 合成音阶：五声音阶，等级越高越高（1 级 C5 … 8 级 E6）
  const SCALE = [523.3, 587.3, 659.3, 784.0, 880.0, 1046.5, 1174.7, 1318.5];
  const play = {
    tap() { tone(440, 0.07, 'sine', 0.12, 0, 520); },
    spawn() { tone(392, 0.09, 'triangle', 0.14, 0, 600); },
    merge(lvl) {
      const f = SCALE[Math.max(0, Math.min(7, (lvl || 2) - 1))];
      tone(f, 0.16, 'triangle', 0.22); tone(f * 1.5, 0.12, 'sine', 0.08, 0.03);
      if (lvl >= 6) { tone(f * 2, 0.25, 'sine', 0.1, 0.08); tone(f * 2.5, 0.3, 'sine', 0.07, 0.14); } // 高级合成加一串亮音
    },
    bounce() { tone(220, 0.1, 'sine', 0.12, 0, 170); },
    coin() { tone(988, 0.07, 'square', 0.06); tone(1319, 0.14, 'square', 0.06, 0.06); },
    deliver() { tone(659, 0.08, 'triangle', 0.15); tone(988, 0.16, 'triangle', 0.15, 0.07); },
    combo(n) { const f = 600 * Math.pow(2, Math.min(12, n) / 12); tone(f, 0.1, 'sine', 0.13); },
    sell() { tone(880, 0.06, 'triangle', 0.13); tone(660, 0.1, 'triangle', 0.13, 0.05); },
    levelUp() { [523.3, 659.3, 784.0, 1046.5].forEach((f, k) => tone(f, 0.22, 'triangle', 0.18, k * 0.09)); tone(1318.5, 0.5, 'sine', 0.1, 0.38); },
    chestShake() { tone(140, 0.09, 'sine', 0.25, 0, 110); },
    chestOpen() { [784.0, 987.8, 1174.7, 1568.0].forEach((f, k) => tone(f, 0.18, 'sine', 0.14, k * 0.05)); },
    pop() { tone(700, 0.08, 'sine', 0.12, 0, 1100); },
    unlock() { tone(587.3, 0.1, 'triangle', 0.15); tone(880, 0.2, 'triangle', 0.15, 0.08); },
  };
  const api = { unlock, setMuted, duck, get muted() { return muted; }, get supported() { return !!AC; } };
  for (const k in play) api[k] = (...a) => { if (live()) { try { play[k](...a); } catch (e) {} } };
  return api;
})();

/* Merge Café Lite · 平台层（CrazyGames SDK v3，https://docs.crazygames.com/sdk/intro/）
   两种构建：
     - 普通构建（GitHub Pages / 本地 / e2e，python3 tools/build.py）：不加载 SDK；广告走 Mock，存档走 localStorage。
     - CrazyGames 构建（python3 tools/build.py --crazygames → dist/crazygames/）：<head> 里先加载 SDK 脚本，并设 window.MCL_PLATFORM = 'crazygames'。
         SDK 环境 crazygames / local → 广告、存档（Data 模块，登录后跨设备云同步）、游戏事件全部走 SDK；
         environment = disabled（不在 CrazyGames 域名）、SDK 脚本被广告拦截插件挡掉、init 超时 → 没有广告（广告按钮隐藏），存档退回 localStorage。
   对外：
     Platform.ready            Promise，main.js 开头 await（Data 模块要先 init 才能读档）
     Platform.storage          get / set / remove（SDK 优先，第一次读档时把老的 localStorage 存档迁进 SDK）
     Platform.game             loadingStop / gameplayStart / gameplayStop / happytime（没有 SDK 时都是空操作）
     Platform.adsMode          'mock' | 'sdk' | 'none'
     Platform.adblock          SDK 检测到广告拦截（检测不保证准，玩法不能依赖它）
     Platform.muted            门户要求静音（settings.muteAudio，优先于游戏内喇叭按钮）
     Platform.onMute(fn)       门户静音设置变化
     Platform.requestAd(type)  'rewarded' | 'midgame' → Promise<{ ok, code }> */
const Platform = (() => {
  const want = typeof window !== 'undefined' && window.MCL_PLATFORM === 'crazygames';
  let sdk = null, adsMode = want ? 'none' : 'mock', adblock = false, muted = false, playing = false;
  const muteFns = [];
  const wait = (ms, v) => new Promise((r) => setTimeout(() => r(v), ms));
  const safe = (fn) => { try { return fn(); } catch (e) { return undefined; } };

  const ready = (async () => {
    if (!want) return;
    const S = window.CrazyGames && window.CrazyGames.SDK;
    if (!S) return; // SDK 脚本没加载到（多半是广告拦截插件）：照常玩，只是没有广告和云存档
    const ok = await Promise.race([S.init().then(() => true, () => false), wait(6000, false)]);
    if (!ok || S.environment === 'disabled') return;
    sdk = S; adsMode = 'sdk';
    safe(() => S.game.loadingStart());
    safe(() => { muted = !!(S.game.settings && S.game.settings.muteAudio); });
    safe(() => S.game.addSettingsChangeListener((ns) => { muted = !!(ns && ns.muteAudio); for (const f of muteFns) safe(() => f(muted)); }));
    adblock = !!(await Promise.race([S.ad.hasAdblock().catch(() => false), wait(3000, false)]));
  })();

  /* 存档：SDK Data 模块优先（未登录时 SDK 自己存在本地，登录后同步到账号）；出错就退回 localStorage */
  const local = () => safe(() => window.localStorage) || null;
  const storage = {
    get(k) {
      const l = local(), lv = l ? safe(() => l.getItem(k)) : null;
      if (!sdk) return lv || null;
      const v = safe(() => sdk.data.getItem(k));
      if (v !== null && v !== undefined && v !== '') return String(v);
      if (lv) safe(() => sdk.data.setItem(k, lv)); // 迁移：之前只有本地存档（老版本 / Data 模块没开）
      return lv || null;
    },
    set(k, v) {
      if (sdk) { let ok = true; try { sdk.data.setItem(k, v); } catch (e) { ok = false; } if (ok) return true; }
      const l = local(); if (!l) return false;
      try { l.setItem(k, v); return true; } catch (e) { return false; }
    },
    remove(k) { if (sdk) safe(() => sdk.data.removeItem(k)); const l = local(); if (l) safe(() => l.removeItem(k)); },
  };

  /* 游戏事件：gameplayStart 在可以玩时、每次从中断回来时调；gameplayStop 在弹窗 / 广告等中断时调。重复调用自动去重 */
  const game = {
    loadingStop() { if (sdk) safe(() => sdk.game.loadingStop()); },
    gameplayStart() { if (playing) return; playing = true; if (sdk) safe(() => sdk.game.gameplayStart()); },
    gameplayStop() { if (!playing) return; playing = false; if (sdk) safe(() => sdk.game.gameplayStop()); },
    happytime() { if (sdk) safe(() => sdk.game.happytime()); },
    get playing() { return playing; },
  };

  /* 广告：静音只在 adStarted（广告真的开始播）时做，adFinished / adError 时恢复；奖励只在 adFinished 发 */
  function requestAd(type) {
    return new Promise((resolve) => {
      if (!sdk) { resolve({ ok: false, code: 'other' }); return; }
      let started = false, done = false;
      const end = (r) => { if (done) return; done = true; if (started) Sfx.duck(false); resolve(r); };
      try {
        sdk.ad.requestAd(type, {
          adStarted: () => { started = true; Sfx.duck(true); },
          adFinished: () => end({ ok: true }),
          adError: (err) => end({ ok: false, code: (err && err.code) || 'other' }),
        });
      } catch (e) { end({ ok: false, code: 'other' }); }
    });
  }

  return {
    ready, storage, game, requestAd,
    get adsMode() { return adsMode; }, get adblock() { return adblock; }, get muted() { return muted; },
    onMute(fn) { muteFns.push(fn); },
  };
})();

/* Merge Café Lite · 广告层
   对外两个入口，返回 Promise：
     Ads.rewarded(kind) → true = 看完发奖 / false = 没看完或没广告（不发奖）
     Ads.interstitial() → 播完或失败都 resolve，游戏照常继续
   广告来源由 Platform 决定（src/platform.js）：
     mock：普通构建（GitHub Pages / 本地 / e2e），全屏遮罩倒计时 CONFIG.ads.mockSec / interstitialMockSec 秒，视为看完；
     sdk： CrazyGames 构建，走 CrazyGames.SDK.ad.requestAd('rewarded' | 'midgame')；请求到播完期间挡住界面、gameplayStop；
     none：CrazyGames 构建但 SDK 不可用（脚本被拦截 / 不在门户域名）。
   Ads.available = false 时（none、检测到广告拦截、门户关了广告如 Basic Launch）所有激励按钮隐藏，不留点了没反应的按钮（门户广告规范）。
   插屏的频率由门户 SDK 控制（两次至少 3 分钟，含激励视频），我们这边仍保留 ads.json 的降频规则。
   Playgama 以后接：在 Platform 里加一个分支（bridge.advertisement.showRewarded / showInterstitial），这里不用改。 */
const Ads = (() => {
  let busy = false, off = false, lastError = '';
  const FAST = /[?&]fastads\b/.test(location.search); // QA / 自动化测试：Mock 广告 1 秒播完
  const secs = (n) => (FAST ? 1 : n);
  const box = () => document.getElementById('ad');
  function mock(sec, label) {
    return new Promise((resolve) => {
      const txt = document.getElementById('ad-count');
      document.getElementById('ad-label').textContent = label;
      box().classList.add('show'); Sfx.duck(true); // 广告期间游戏静音（门户 SDK 要求）
      let n = sec;
      const tick = () => {
        txt.textContent = L.t('ad.playing', { n });
        if (n-- <= 0) { box().classList.remove('show'); Sfx.duck(false); resolve(true); return; }
        setTimeout(tick, 1000);
      };
      tick();
    });
  }
  /* SDK 广告：请求到结束之间用一层透明遮罩挡住操作（门户要求请求期间暂停、挡住界面），广告本身由门户全屏播放 */
  async function viaSdk(type) {
    box().classList.add('show', 'sdk'); Platform.game.gameplayStop();
    try { return await Platform.requestAd(type); }
    finally { box().classList.remove('show', 'sdk'); Platform.game.gameplayStart(); } // 回到游戏；之后若再弹窗，main.js 会再 stop
  }
  const available = () => !off && (Platform.adsMode === 'mock' || (Platform.adsMode === 'sdk' && !Platform.adblock));
  async function rewarded(kind) {
    if (busy || !available()) return false;
    busy = true;
    try {
      if (Platform.adsMode === 'mock') return await mock(secs(CONFIG.ads.mockSec), L.t('ad.label'));
      const r = await viaSdk('rewarded');
      if (!r.ok) { lastError = r.code; if (r.code === 'adsDisabledBasicLaunch' || r.code === 'adblock') off = true; }
      return r.ok;
    } finally { busy = false; }
  }
  async function interstitial() {
    if (busy || !available()) return;
    busy = true;
    try {
      if (Platform.adsMode === 'mock') await mock(secs(CONFIG.ads.interstitialMockSec), L.t('ad.label'));
      else { const r = await viaSdk('midgame'); if (!r.ok) lastError = r.code; }
    } finally { busy = false; }
  }
  return {
    rewarded, interstitial,
    get busy() { return busy; },
    get available() { return available(); },
    get blocked() { return Platform.adsMode === 'sdk' && (Platform.adblock || lastError === 'adblock'); }, // 显示「广告拦截」说明用
    get lastError() { return lastError; },
  };
})();

/* Merge Café Lite · 主循环：布局、绘制、输入、HUD、订单、新手引导、存档
   场景 / 订单卡 / 棋盘 / 生成器按钮全部用 GL（原生 WebGL）画；顶栏、底部导航、弹窗、提示、引导气泡是 DOM。
   布局按 #38 效果图：竖屏 顶栏 → 场景+Logo → 3 张订单卡 → 棋盘 → 生成器 → 底栏；横屏 左场景+底栏 / 中棋盘 / 右订单+生成器。 */
(async () => {
  'use strict';
  await Platform.ready; // CrazyGames 构建：先等 SDK init（Data 模块要先 init 才能读档）；普通构建立即返回
  const C = Core.index(CONFIG);
  const $ = (id) => document.getElementById(id);
  const SAVE_KEY = 'merge-cafe-lite.save';

      const ref = Core.settleOrders(C, S, now());
      for (const k of ref) { cardPops.set(k, clock()); markDirty(); }
      for (const i of Core.settleBubbles(C, S, now())) { const [x, y] = cellXY(i); burst(x, y, '#bfe8f2', 12); markDirty(); if (mode === 'merge') toast(L.t('ui.bubblePopped')); }
      updateHud(); updateTutorial(); updateDeco(); updateTasks(); updateBook(); tryLevelUp(); tryPopups(); tryInterstitial(); updateHints(clock());
      if (!document.hidden) { const dt = Math.min(1000, tn - (lastPlayTick || tn)); S.stats.playMs += dt; } lastPlayTick = tn; // 有效游玩时长（页面在前台）
      if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
      if (DEBUG) debugStats();
    }
    const r0 = performance.now(); render(); renderMs = renderMs * 0.9 + (performance.now() - r0) * 0.1; updateSellBtn();
    fpsN++; if (tn - fpsT >= 1000) { fps = Math.round(fpsN * 1000 / (tn - fpsT)); fpsN = 0; fpsT = tn; }
    requestAnimationFrame(frame);
  }
  function start() {
    layout();
    // 装修场景和漫画不挡首帧：开画后再后台加载（玩家进 Café 页前一般早就到了；没到时先画程序占位）
    Art.load(CONFIG.art.uiWebp || [], 'assets/ui/', () => {}, 'webp'); // 欢迎回来插画（M5）
    Art.load(CONFIG.art.cafe || [], 'assets/scene/', () => {}, 'webp');
    Art.load(CONFIG.art.comics || [], 'assets/comics/', () => {}, 'webp');
    if (welcomeGain > 0) setTimeout(() => toast(L.t('ui.welcomeBack', { n: welcomeGain })), 300);
    { const r = Core.offlineEarn(C, S, awayFrom, now()); if (r) { queueWelcome(r); markDirty(); } }
    startedAt = clock();
    updateHud(); updateTutorial(); updateSndBtn();
    requestAnimationFrame(frame);
    requestAnimationFrame(() => { Platform.game.loadingStop(); if (!modalOpen()) Platform.game.gameplayStart(); }); // 首帧画出来 = 可以玩了
  }
  /* 正式图和字体一起预加载：都到了（或 2.5 秒超时）才开画，避免占位图闪一下再换。没到的图之后到了照样自动替换 */
  const artReady = Promise.all([
    Art.load(CONFIG.art.items, 'assets/items/', () => {}),
    Art.load(CONFIG.art.avatars || [], 'assets/avatars/', () => {}),
    Art.load(CONFIG.art.ui || [], 'assets/ui/', swapDomIcon),
    Art.load(CONFIG.art.scene || [], 'assets/scene/', () => {}, 'webp'),
  ]);
  /* 顶栏和底栏的图标是 DOM 里的 SVG 占位：正式图到了换成 <img> */
  const DOM_ICONS = { icon_energy: '#pill-energy svg', icon_coin: '#pill-coins svg', icon_star: '#pill-stars svg', nav_cafe: '#nav-cafe svg', nav_merge: '#nav-merge svg', nav_tasks: '#nav-tasks svg', nav_book: '#nav-book svg' };
  function swapDomIcon(id) {
    if (id === 'icon_sound_on' || id === 'icon_sound_off') { updateSndBtn(); return; }
    if (id === 'badge_level') { const el = $('lvl'); el.style.setProperty('--badge', `url('${Art.src(id)}')`); el.classList.add('art'); return; }
    const old = DOM_ICONS[id] && document.querySelector(DOM_ICONS[id]); if (!old) return;
    const img = document.createElement('img'); img.src = Art.src(id); img.alt = ''; img.className = 'ico'; img.dataset.art = id;
    old.replaceWith(img); layout();
  }
  // 等内联的 Nunito 解码完（最多 1.5 秒）、正式图加载完（最多 2.5 秒）再开画
  const fontReady = document.fonts && document.fonts.load ? Promise.race([
    Promise.all([document.fonts.load('900 20px Nunito'), document.fonts.load('800 20px Nunito')]),
    new Promise((r) => setTimeout(r, 1500)),
  ]) : Promise.resolve();
  const timeout = (ms) => new Promise((r) => setTimeout(r, ms));
  Promise.all([fontReady, Promise.race([artReady, timeout(2500)])]).then(() => { GL.reset(); start(); }, start);

  /* ---------- 调试面板（?debug=1，给 QA 用，文案不进本地化表） ---------- */
  function debugStats() {
    const st = S.stats, c = st.createdAt;
    $('dbg-fps').textContent = `${fps} fps · ${renderMs.toFixed(2)} ms/frame\norders ${st.ordersDone} · merges ${st.merges}\n1st merge ${st.firstMergeAt ? ((st.firstMergeAt - c) / 1000).toFixed(1) + 's' : '-'} · 1st order ${st.firstOrderAt ? ((st.firstOrderAt - c) / 1000).toFixed(1) + 's' : '-'}\nads[${Platform.adsMode}${Platform.adblock ? ' adblock' : ''}${Ads.available ? '' : ' off'}] ${['energy', 'refill', 'double', 'bubble', 'offline'].map((k) => k + ' ' + S.ads.clicks[k] + '/' + S.ads.offers[k]).join(' · ')} · inter ${S.ads.interstitials}\nLv ${S.level} (${S.xp}/${Core.xpNeed(C, S.level)}) · ev ${st.ev.small}/${st.ev.mid}/${st.ev.big} · mid/3min ${st.playMs > 60e3 ? (st.ev.mid / (st.playMs / 180e3)).toFixed(1) : '-'} · days ${Core.daysInFirstWeek(S)} · play ${Math.round(st.playMs / 60e3)}m\ndeco ${S.deco}/${Core.areaNodes(C, S).length} · gens ${C.genList.map((g) => 'Lv' + (S.gens[g.id].lv || 1)).join('/')}\nspent ${Object.entries(st.coinsSpent).filter(([, v]) => v).map(([k, v]) => k + ' ' + v).join(' · ') || '-'} · earned ${st.coinsEarned}`;
  }
  if (DEBUG) {
    const box = $('dbg'); box.classList.add('show');
    const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); markDirty(); save(); hudCache = ''; }; box.appendChild(b); };
    const skip = (ms) => { timeOffset += ms; try { sessionStorage.setItem('mcl.timeOffset', timeOffset); } catch (e) {} const g = Core.settleAll(C, S, now()); toast('+' + Math.round(ms / 60000) + ' min, energy +' + g); };
    btn('+1m', () => skip(60e3)); btn('+10m', () => skip(600e3)); btn('+1h', () => skip(3600e3));
    btn('energy 0', () => { S.energy = 0; S.energyTs = now(); });
    btn('+100 coins', () => { S.coins += 100; });
    btn('+1000 coins', () => { S.coins += 1000; });
    btn('bubble', () => { const e = S.cells.findIndex((c, i) => !c && S.unlocked[i]); if (e >= 0) S.cells[e] = { k: 'bubble', chain: 'coffee', lvl: 5, until: now() + C.eco.bubble.lifeSec * 1000 }; });
    btn('+5 stars', () => { S.stars += 5; decoKey = ''; });
    btn('+100 xp', () => { queueLevelUps(Core.addXp(C, S, 100, now())); });
    btn('wild star', () => { Core.giveWildStar(C, S, 3, 3); });
    btn('+20 hearts', () => { for (const r of C.regs) if (Core.regOn(C, S, r)) { const st = Core.regState(S, r.id); st.pts += 20; } });
    btn('chest', () => { const r = Core.openChest(C, S, now()); pendingCoins += r.coins; pendingStars += r.stars; showChest(r); });
    btn('skip tutorial', () => Core.skipTutorial(S));
    btn('+1 day', () => skip(864e5));
    btn('away 3h', () => { const r = Core.offlineEarn(C, S, now() - 3 * 3600e3, now()); if (r) queueWelcome(r); });
    btn('daily done', () => { if (S.dtasks) for (const t of S.dtasks.list) t.base -= t.n; });
    btn('fill board', () => { for (let i = 0; i < C.n; i++) if (S.unlocked[i] && !S.cells[i]) S.cells[i] = { k: 'item', chain: i % 2 ? 'coffee' : 'bake', lvl: 1 + (i % 7) }; });
    btn('serve-ready', () => { // 把三个订单要的东西都放到棋盘上
      for (const o of S.orders) for (const n of o.needs) if (!n.done) { const e = S.cells.findIndex((c, i) => !c && S.unlocked[i]); if (e >= 0) S.cells[e] = { k: 'item', chain: n.chain, lvl: n.lvl }; }
    });
    btn('reset', () => { Platform.storage.remove(SAVE_KEY); try { sessionStorage.removeItem('mcl.timeOffset'); } catch (e) {} timeOffset = 0; S = Core.newState(C, now()); sel = -1; pendingCoins = pendingStars = 0; decoKey = ''; });
  }
  // 自动化测试 / 调试入口
  window.MCL = {
    C, get S() { return S; }, get pendingLevels() { return pendingLevels; }, cellXY, cellAt, layout: LY, save, now, genRect, upgradeBadge: (id) => upgradeBadge(genRect(id)), orderRect: (k) => LY.orders[k], get mode() { return mode; }, needAt,
    get fps() { return fps; }, get sel() { return sel; }, get popups() { return popups.length; }, setMode, get spotlight() { return !!spotlight; }, get renderMs() { return renderMs; }, get pending() { return pendingCoins + pendingStars; }, get pendingCoins() { return pendingCoins; },
  };
})();

</script>

</body>
