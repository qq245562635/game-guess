<title>Merge Café Lite</title>
<style>
:root {
  --teal: #2f9ea3; --teal-d: #1d6f73; --cream: #fff6e6; --coral: #ee7a5f; --coral-d: #c4553c;
  --wood: #b07a4c; --wood-d: #7c5130; --ink: #3a2416; --gold: #f2b632;
  --font: "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: #bfe9ee; color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }

/* 顶栏：体力 / 金币 / 星星 */
#hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; justify-content: center; padding: max(8px, env(safe-area-inset-top)) 10px 8px; pointer-events: none; z-index: 2; }
.pill { pointer-events: auto; display: flex; align-items: center; gap: 6px; min-width: 76px; height: 36px; padding: 0 12px 0 4px;
  background: var(--cream); border: 3px solid var(--wood-d); border-radius: 20px; box-shadow: 0 3px 0 rgba(60,35,20,.35);
  font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; box-sizing: border-box; }
.pill svg { width: 28px; height: 28px; flex: none; }
.pill .sub { font-size: 11px; font-weight: 700; opacity: .7; margin-left: 2px; }
#energy-timer:empty { display: none; }

/* 底部信息栏 */
#info { position: fixed; z-index: 2; display: flex; align-items: center; justify-content: center; text-align: center;
  background: rgba(255,246,230,.94); border: 3px solid var(--wood-d); border-radius: 14px; box-shadow: 0 3px 0 rgba(60,35,20,.3);
  font-weight: 700; font-size: 15px; padding: 0 12px; box-sizing: border-box; pointer-events: none; }
#info b { font-weight: 900; margin-right: 6px; }

/* 提示 */
#toast { position: fixed; z-index: 5; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .2s, transform .2s;
  max-width: min(86vw, 420px); padding: 10px 16px; border-radius: 14px; background: rgba(58,36,22,.92); color: #fff8ec;
  font-weight: 700; font-size: 15px; text-align: center; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 弹窗 */
#modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: rgba(20,40,45,.45); }
#modal.show { display: flex; }
.card { width: min(86vw, 340px); background: var(--cream); border: 4px solid var(--wood-d); border-radius: 22px; box-shadow: 0 6px 0 rgba(60,35,20,.4);
  padding: 18px 18px 16px; text-align: center; animation: pop .22s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 900; color: var(--teal-d); }
.card p { margin: 0 0 16px; font-size: 16px; font-weight: 600; line-height: 1.35; }
.btns { display: flex; gap: 10px; justify-content: center; }
.btn { appearance: none; border: 3px solid var(--coral-d); background: var(--coral); color: #fff; font: 900 17px var(--font);
  border-radius: 16px; padding: 10px 18px; min-width: 110px; box-shadow: 0 4px 0 var(--coral-d); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--coral-d); }
.btn.alt { background: #fff; color: var(--ink); border-color: var(--wood-d); box-shadow: 0 4px 0 var(--wood-d); }

#err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-weight: 800; padding: 24px; text-align: center; }

/* 调试面板（?debug=1） */
#dbg { position: fixed; right: 6px; bottom: 6px; z-index: 20; display: none; flex-wrap: wrap; gap: 4px; max-width: 220px; justify-content: flex-end;
  font: 600 11px ui-monospace, monospace; }
#dbg.show { display: flex; }
#dbg button { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid #333; background: #fff; }
#dbg span { width: 100%; text-align: right; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 4px; }
</style>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="pill" id="pill-energy" title="Energy">
    <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#2f9ea3"/><path d="M15.5 4.5 8 15.5h5l-1.5 8 7.5-11h-5z" fill="#fff8ec"/></svg>
    <span id="energy">100</span><span class="sub" id="energy-timer"></span>
  </div>
  <div class="pill" title="Coins">
    <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#f2b632" stroke="#b97a12" stroke-width="2.4"/><circle cx="14" cy="14" r="6" fill="#ffe28a"/></svg>
    <span id="coins">0</span>
  </div>
  <div class="pill" title="Stars">
    <svg viewBox="0 0 28 28"><path d="M14 2.5l3.4 7.2 7.9.9-5.9 5.4 1.6 7.8L14 19.9l-7 3.9 1.6-7.8-5.9-5.4 7.9-.9z" fill="#ee7a5f" stroke="#c4553c" stroke-width="2" stroke-linejoin="round"/></svg>
    <span id="stars">0</span>
  </div>
</div>
<div id="info"></div>
<div id="toast"></div>
<div id="modal"><div class="card"><h2 id="m-title"></h2><p id="m-body"></p><div class="btns" id="m-btns"></div></div></div>
<div id="err"></div>
<div id="dbg"><span id="dbg-fps"></span></div>
<script>
/*GAME*/
</script>
