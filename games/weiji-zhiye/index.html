// ---------- 绘图工具 ----------
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function ell(c, x, y, rx, ry) {
  c.beginPath();
  c.save(); c.translate(x, y); c.scale(rx, ry); c.arc(0, 0, 1, 0, PI * 2); c.restore();
  c.closePath();
}
function lg(c, x0, y0, x1, y1, stops) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((s, i) => g.addColorStop(Array.isArray(s) ? s[0] : i / (stops.length - 1), Array.isArray(s) ? s[1] : s));
  return g;
}
function fill(c, style) { c.fillStyle = style; c.fill(); }
function stroke(c, style, lw) { c.strokeStyle = style; c.lineWidth = lw; c.stroke(); }
function line(c, x0, y0, x1, y1, style, lw) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); stroke(c, style, lw); }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }

function sparkle(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s * 0.22, y - s * 0.22); c.lineTo(x + s, y); c.lineTo(x + s * 0.22, y + s * 0.22);

}

const P = require('./platform');
const KEY = 'weiji_night_bedroom_demo_v1';

function fresh() {
  return {
    v: 1,
    phase: 'new',        // new | intro | room | roomDone | outro | done
    introIdx: 0,
    outroIdx: 0,
    placed: [],          // 已放置贴纸 ID
    group: 0,            // 当前组 0..2
    choice: null,        // 'A' | 'B'
    read: { intro: false, outro: false },
    sound: true,
    feedback: null,
    stats: { groupSec: [0, 0, 0], misses: 0, hints: 0, revisits: 0, replays: 0 },
  };
}

const S = {
  d: fresh(),
  load() {
    const raw = P.storageGet(KEY);
    if (raw) {
      try {
        const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
        const f = fresh();
        this.d = Object.assign(f, o);
        this.d.read = Object.assign(f.read, o.read || {});
        this.d.stats = Object.assign(fresh().stats, o.stats || {});
      } catch (e) { this.d = fresh(); }
    }
    return this.d;
  },
  write() { P.storageSet(KEY, JSON.stringify(this.d)); },
  reset() { const snd = this.d.sound; this.d = fresh(); this.d.sound = snd; this.write(); },
};

module.exports = S;

};

const P = require('./platform');

          lines.push({ text: cur, widths, w });
          cur = ''; widths = []; w = 0;
        }
        cur += ch; w += cw; widths.push(w);
      }
      lines.push({ text: cur, widths, w });
    });

    const lhPx = Math.round(fs * lh);

        y: y / k, h: lhPx / k, x0: x0 / k,

}
