name: CI

on:
  push:
    branches: [main, "m*-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gg
          POSTGRES_PASSWORD: gg
          POSTGRES_DB: gameguess
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gg:gg@localhost:5432/gameguess
      SHADOW_DATABASE_URL: postgresql://gg:gg@localhost:5432/gameguess_shadow
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Upload lockfile (commit it from here until one is in the repo)
        uses: actions/upload-artifact@v5
        with:
          name: package-lock
          path: package-lock.json
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Versions
        run: echo "::notice title=versions::node $(node -v), next $(npx next --version | tail -1), prisma $(npm ls prisma --depth=0 | grep -o 'prisma@[0-9.]*'), react $(npm ls react --depth=0 | grep -o 'react@[0-9.]*' | head -1)"
      - name: Unit + integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
          echo "::notice title=unit+integration::$(grep -E '^# (tests|pass|fail) ' unit.log | tr '\n' ' ')"
      - name: Migrate
        run: npm run db:migrate
      - name: Migration matches schema
        run: |
          psql "postgresql://gg:gg@localhost:5432/postgres" -c "CREATE DATABASE gameguess_shadow"
          npm run db:check
      - name: Seed
        run: npm run db:seed
      - name: Database tests
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee db.log
          echo "::notice title=db::$(grep -E '^# (tests|pass|fail) ' db.log | tr '\n' ' ')"
      - name: Build
        run: npm run build
      - name: No secrets or answers in client bundle
        run: |
          ! grep -rl "SESSION_SECRET\|DATABASE_URL\|$SESSION_SECRET" .next/static || (echo "secret found in client bundle" && exit 1)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: |
          set -o pipefail
          status=0
          E2E_REPEAT=3 PLAYWRIGHT_JSON_OUTPUT_NAME=e2e.json npx playwright test --reporter=list,json 2>&1 | tee e2e.log || status=$?
          echo "::notice title=e2e::$(grep -E '[0-9]+ (passed|failed|flaky|skipped)' e2e.log | tr '\n' ' ')"
          node -e '
            const r = require("./e2e.json");
            const walk = (s, p = []) => [...(s.specs || []).flatMap((sp) => sp.tests.map((t) => ({ title: [...p, sp.title].join(" > "), t }))), ...(s.suites || []).flatMap((c) => walk(c, [...p, c.title]))];
            for (const { title, t } of r.suites.flatMap((s) => walk(s))) {
              if (t.status === "expected") continue;
              const err = t.results.find((x) => x.error)?.error?.message?.split("\n").slice(0, 3).join(" | ") || "";
              console.log(`::warning title=e2e ${t.status} [${t.projectName}]::${title} :: ${err.replace(/\x1b\[[0-9;]*m/g, "").slice(0, 400)}`);
            }'
          exit $status
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  fresh-clone:
    # What a new contributor does: clone, npm install, npm run setup, npm run dev. No Docker, no system Postgres.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: npm run setup
        run: |
          set -o pipefail
          if ! npm run setup 2>&1 | tee setup.log; then
            tail -25 setup.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=setup::$line"; done
            exit 1
          fi
          echo "::notice title=fresh-clone ${{ matrix.os }}::embedded-postgres $(node -p "require('./node_modules/embedded-postgres/package.json').version")"
      - name: npm run dev, then play through a forwarded origin
        run: |
          set -euo pipefail
          npm run dev > dev.log 2>&1 &
          for _ in $(seq 1 90); do curl -sf localhost:3000/api/puzzle/today > /dev/null && break; sleep 2; done
          FWD=demo-3000.app.github.dev
          curl -sf -c jar -H "X-Forwarded-Host: $FWD" localhost:3000/ > page.html
          today=$(curl -sf -b jar -c jar -H "X-Forwarded-Host: $FWD" localhost:3000/api/puzzle/today)
          echo "$today" | grep -q '"available":true'
          n=$(echo "$today" | node -pe 'JSON.parse(require("fs").readFileSync(0)).puzzleNumber')
          game=$(curl -sf localhost:3000/api/games/index | node -pe 'JSON.parse(require("fs").readFileSync(0))[0].id')
          code=$(curl -s -o guess.json -w '%{http_code}' -b jar -X POST localhost:3000/api/guess \
            -H "Content-Type: application/json" -H "Origin: https://$FWD" -H "X-Forwarded-Host: $FWD" \
            -d "{\"puzzleNumber\":$n,\"gameId\":\"$game\",\"clientGuessId\":\"smoke-1\"}")
          cat guess.json; echo
          test "$code" = 200
          grep -q '"status":"accepted"' guess.json
          bad=$(curl -s -o /dev/null -w '%{http_code}' -b jar -X POST localhost:3000/api/guess \
            -H "Content-Type: application/json" -H "Origin: https://evil.example" \
            -d "{\"puzzleNumber\":$n,\"gameId\":\"$game\",\"clientGuessId\":\"smoke-2\"}")
          test "$bad" = 403
          echo "::notice title=fresh-clone ${{ matrix.os }}::setup + dev ok, guess=200, cross-site=403"
      - name: Dev server log
        if: always()
        run: tail -60 dev.log || true
